<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Draft Night FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700&family=DotGothic16&display=swap">
<style>
/* Layout: sticker-album matchday program. Category card + timer up top, two team "album pages" (pitches with sticker cards) side by side, action panel between. */
:root{
  --paper:#e9edf4; --paper-2:#dde3ee; --card:#ffffff; --ink:#111a2f; --muted:#5a6479; --rule:#c6cedd;
  --cobalt:#1d3fc4; --cobalt-soft:#dfe5fb; --saffron:#f2b705; --saffron-ink:#5b4300; --red:#d22f2a; --red-soft:#fbe1df;
  --ok:#147a3e; --ok-soft:#dcf1e3; --warn:#a85c00;
  --pitch:#2d7a47; --pitch-2:#286f40; --chalk:rgba(255,255,255,.72);
  --shadow:0 1px 0 rgba(17,26,47,.06),0 6px 18px -10px rgba(17,26,47,.35);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --dot:"DotGothic16",ui-monospace,"Courier New",monospace;
  --teamA:var(--cobalt); --teamB:var(--red);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0c1222; --paper-2:#121a2e; --card:#18223b; --ink:#e7ebf5; --muted:#9aa5bd; --rule:#2a3655;
  --cobalt:#7d96ff; --cobalt-soft:#1c2a5c; --saffron:#f6c437; --saffron-ink:#2a1f00; --red:#ff6a63; --red-soft:#4a1d1c;
  --ok:#4fd185; --ok-soft:#163a26; --warn:#ffb050;
  --pitch:#1f5e37; --pitch-2:#1b5531; --chalk:rgba(255,255,255,.55);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c1222; --paper-2:#121a2e; --card:#18223b; --ink:#e7ebf5; --muted:#9aa5bd; --rule:#2a3655;
  --cobalt:#7d96ff; --cobalt-soft:#1c2a5c; --saffron:#f6c437; --saffron-ink:#2a1f00; --red:#ff6a63; --red-soft:#4a1d1c;
  --ok:#4fd185; --ok-soft:#163a26; --warn:#ffb050;
  --pitch:#1f5e37; --pitch-2:#1b5531; --chalk:rgba(255,255,255,.55);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding:0 16px 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px;border-bottom:2px solid var(--ink);margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:34px;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
.brand h1 span{color:var(--cobalt)}
.brand .tag{font-family:var(--dot);font-size:13px;color:var(--muted)}
.mast .who{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--paper-2);color:var(--ink)}
.pill.a{background:var(--cobalt-soft);color:var(--cobalt)}
.pill.b{background:var(--red-soft);color:var(--red)}
.pill.gold{background:var(--saffron);color:var(--saffron-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}

.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;letter-spacing:.02em}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.blue{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.gold{background:var(--saffron);border-color:var(--saffron);color:var(--saffron-ink)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{border:2px solid var(--rule);background:var(--card);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.field input:focus,.field select:focus{border-color:var(--cobalt);outline:none}
.notice{border:2px dashed var(--rule);border-radius:12px;padding:14px 16px;background:var(--card)}
.notice.bad{border-color:var(--red);background:var(--red-soft)}

/* Lobby */
.lobby{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:start}
@media (max-width:860px){.lobby{grid-template-columns:1fr}}
.hero{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:grid;gap:18px}
.hero h2{font-size:clamp(34px,6vw,58px);font-weight:900;text-transform:uppercase;line-height:.92}
.hero h2 em{font-style:normal;color:var(--red)}
.hero p{margin:0;max-width:60ch}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
@media (max-width:620px){.formrow{grid-template-columns:1fr}}
.list{display:grid;gap:10px}
.gamecard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);flex-wrap:wrap}
.gamecard .code{font-family:var(--dot);font-size:20px;letter-spacing:.12em}
.gamecard .vs{font-weight:700;min-width:0}
.rules{background:var(--card);border-radius:14px;padding:4px 16px;box-shadow:var(--shadow)}
.rules summary{cursor:pointer;font-weight:700;padding:12px 0}
.rules ul{margin:0 0 14px;padding-left:18px;display:grid;gap:5px}
.dicetable{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin-bottom:14px}

/* Dice (d10) */
.die{width:46px;height:46px;flex:none;display:block}
.die.sm{width:30px;height:30px}
.die .face{fill:var(--card);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.die .edge{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:.45}
.die text{font-family:var(--display),Impact,sans-serif;font-weight:900;font-size:17px;fill:var(--ink)}
.die.gold .face{fill:var(--saffron);stroke:var(--saffron-ink)}
.die.gold text{fill:var(--saffron-ink)} .die.gold .edge{stroke:var(--saffron-ink)}
.die.roll{animation:roll .7s cubic-bezier(.3,1.5,.6,1)}
@keyframes roll{0%{transform:rotate(-200deg) scale(.4)}100%{transform:none}}

/* Game header: category board */
.board{display:grid;grid-template-columns:1fr auto;gap:16px;background:var(--ink);color:var(--paper);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.board .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.board .cat{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.2vw,44px);line-height:1;margin:10px 0 6px;text-wrap:balance}
.board .hint{opacity:.75;font-size:14px;max-width:70ch}
.board .dicefx{display:flex;gap:12px;align-items:center;margin-top:12px;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;width:fit-content;max-width:100%}
.board .dicefx b{font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.board .die .face{fill:var(--paper);stroke:var(--paper)}
.board .die text{fill:var(--ink)} .board .die .edge{stroke:var(--ink)}
.board .die.gold .face{fill:var(--saffron);stroke:var(--saffron)}
.board .die.gold text{fill:var(--saffron-ink)}
.timer{width:118px;height:118px;position:relative;flex:none;align-self:center}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--dot);font-size:34px}
.timer .t small{display:block;font-size:11px;font-family:var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-top:-26px}
.timer.low .t{color:var(--saffron)}
@media (max-width:620px){.board{grid-template-columns:1fr}.timer{width:92px;height:92px;justify-self:end;margin-top:-6px}.timer .t{font-size:26px}}

/* Arena */
.arena{display:grid;grid-template-columns:1fr minmax(280px,360px) 1fr;gap:16px;margin-top:16px;align-items:start}
@media (max-width:1060px){.arena{grid-template-columns:1fr 1fr}.arena .panel{grid-column:1/-1;order:-1}}
@media (max-width:700px){.arena{grid-template-columns:1fr}}
.team{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:grid;gap:12px;min-width:0}
.team header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.team h3{font-size:26px;text-transform:uppercase;font-weight:900}
.team.a h3{color:var(--teamA)} .team.b h3{color:var(--teamB)}
.team .sub{font-size:12px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1.5px solid var(--rule);border-radius:8px;padding:4px 8px;max-width:100%;min-width:0;overflow-wrap:anywhere}
.chip b{font-weight:700}
.chip.none{border-style:dashed;color:var(--muted)}

/* Mini pitch with stickers */
.pitchbox{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(0deg,var(--pitch) 0 10%,var(--pitch-2) 10% 20%)}
.pitchbox svg.lines{position:absolute;inset:0;width:100%;height:100%}
.sticker{position:absolute;transform:translate(-50%,-50%);width:23%;max-width:96px;min-height:48px;background:var(--card);color:var(--ink);border-radius:7px;padding:4px 4px 3px;text-align:center;box-shadow:0 3px 8px -3px rgba(0,0,0,.6);display:grid;gap:1px;line-height:1.05}
.sticker .pos{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.sticker .nm{font-family:var(--display);font-weight:800;font-size:15px;text-transform:uppercase;overflow-wrap:anywhere}
.sticker .nat{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sticker .rt{position:absolute;top:-7px;right:-6px;background:var(--ink);color:var(--paper);font-family:var(--dot);font-size:11px;border-radius:6px;padding:1px 4px}
.sticker.open{background:rgba(255,255,255,.12);border:2px dashed var(--chalk);color:#fff;box-shadow:none}
.sticker.open .pos{color:#fff}
.sticker.empty{background:rgba(0,0,0,.28);border:2px dashed var(--red);color:#fff;box-shadow:none}
.sticker.empty .pos,.sticker.empty .nat{color:#ffd2cf}
.sticker.gold{background:linear-gradient(135deg,#fff4c2 0%,#f2b705 35%,#fff3b8 55%,#d99a00 80%,#fff1a8 100%);color:#2a1f00;background-size:200% 200%;animation:foil 5s ease-in-out infinite}
.sticker.gold .pos,.sticker.gold .nat{color:#5b4300}
@keyframes foil{50%{background-position:100% 100%}}
.sticker.meme{background:repeating-linear-gradient(45deg,var(--card) 0 6px,var(--paper-2) 6px 12px)}
.sticker .tagm{font-size:8px;font-weight:800;letter-spacing:.12em;color:var(--red)}
.sticker.cap::after{content:"C";position:absolute;top:-7px;left:-6px;background:var(--saffron);color:var(--saffron-ink);font-weight:800;font-size:10px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center}
.sticker.pickable{cursor:pointer;outline:2px solid var(--saffron);outline-offset:1px}
.sticker.pickable.sel{background:var(--saffron);color:var(--saffron-ink);border-style:solid}
.bench{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bench .sticker{position:relative;transform:none;width:auto;max-width:none;left:auto;top:auto}
.bench .sticker.open{background:var(--paper-2);border-color:var(--rule);color:var(--muted)}
.bench .sticker.open .pos{color:var(--muted)}
.chem{font-size:12px;color:var(--muted)}

/* Action panel */
.panel{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:grid;gap:14px;border-top:6px solid var(--ink)}
.panel.mine{border-top-color:var(--saffron)}
.panel h4{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:0;font-weight:800}
.ruling{border-radius:12px;padding:12px;display:grid;gap:6px}
.ruling.yes{background:var(--ok-soft)} .ruling.no{background:var(--red-soft)} .ruling.unk{background:var(--paper-2)}
.ruling .verdict{font-family:var(--display);font-size:26px;font-weight:900;text-transform:uppercase}
.ruling.yes .verdict{color:var(--ok)} .ruling.no .verdict{color:var(--red)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.spin{width:22px;height:22px;border:3px solid var(--rule);border-top-color:var(--cobalt);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.log{max-height:260px;overflow:auto;display:grid;gap:6px;font-size:13px;padding-right:4px}
.log div{border-left:3px solid var(--rule);padding-left:8px}
.log div.a{border-color:var(--teamA)} .log div.b{border-color:var(--teamB)}
.slotgrid{display:flex;flex-wrap:wrap;gap:6px}
.slotbtn{border:2px solid var(--rule);background:var(--paper);border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px}
.slotbtn.sel{background:var(--saffron);border-color:var(--saffron);color:var(--saffron-ink)}

/* Match */
.matchtop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--ink);color:var(--paper);border-radius:16px;padding:12px 16px}
.matchtop .tn{font-family:var(--display);font-weight:900;font-size:clamp(18px,3vw,30px);text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.matchtop .tn.r{text-align:right}
.score{font-family:var(--dot);font-size:clamp(34px,6vw,54px);display:flex;gap:10px;align-items:center;justify-content:center}
.score .clk{font-size:14px;background:var(--saffron);color:var(--saffron-ink);border-radius:6px;padding:2px 8px}
.pitchwrap{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.pitchwrap svg{display:block;width:100%;height:auto}
.goalbanner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.goalbanner div{font-family:var(--display);font-weight:900;font-size:clamp(48px,11vw,130px);color:#fff;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 6px 0 rgba(0,0,0,.35);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.goalbanner div small{display:block;font-size:.26em;text-align:center;letter-spacing:.08em}
@keyframes pop{from{transform:scale(.3) rotate(-6deg);opacity:0}}
.matchgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px;align-items:start}
@media (max-width:860px){.matchgrid{grid-template-columns:1fr}}
.feed{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:grid;gap:8px;max-height:460px;overflow:auto}
.feed .ev{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:14px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.feed .ev .m{font-family:var(--dot);color:var(--muted)}
.feed .ev.goal{background:var(--saffron);color:var(--saffron-ink);border-radius:10px;padding:8px;border:0}
.feed .ev.goal .m{color:var(--saffron-ink)}
.feed .ev.red .m{color:var(--red)}
.dossier{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:grid;gap:10px}
.dossier h4{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:0}
.dossier p{margin:0;max-width:68ch}
.rolls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.roll{background:var(--paper);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:13px}
.statt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.statt td{padding:6px 4px;border-bottom:1px solid var(--rule);text-align:center}
.statt td:first-child,.statt td:last-child{font-weight:700;width:30%}
.pens{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pens i{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid var(--ink)}
.pens i.y{background:var(--ok);border-color:var(--ok)} .pens i.n{background:var(--red);border-color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.poss{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--rule)}
.poss i{display:block;height:100%;transition:width .6s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
</style>
</head>

    <div class="who" id="who"></div>
  </div>
  <main id="view"></main>
</div>

<script type="module">
/* ============================================================

const FIREBASE_CONFIG = {

const API_URL = "/api/claude";

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, doc as fdoc, getDoc, setDoc, onSnapshot as fsnap, collection as fcol, query as fquery, orderBy as forder, limit as flimit, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Firestore adapter with the same shape the game already uses */
function makeDb(){
  const app = initializeApp(FIREBASE_CONFIG);
  const fs = initializeFirestore(app, {ignoreUndefinedProperties:true});
  const wrap = s => ({id:s.id, exists:s.exists(), data:()=>s.data()});
  const docRef = path => { const r = fdoc(fs, path); return {
    id:r.id, path,
    get: async () => wrap(await getDoc(r)),
    set: d => setDoc(r, JSON.parse(JSON.stringify(d))),
    onSnapshot: (next, err) => fsnap(r, s => next(wrap(s)), err),
    acquire: async ({holder, ttlMs=30000}) => {
      const lr = fdoc(fs, "locks/" + path.replace(/\//g, "_"));
      return runTransaction(fs, async tx => {
        const s = await tx.get(lr), now = Date.now();
        if (s.exists() && s.data().expiresAt > now && s.data().holder !== holder) return {acquired:false};
        tx.set(lr, {holder, expiresAt: now + ttlMs});
        return {acquired:true};
      });
    }
  };};
  const colRef = (path, q=[]) => ({
    path,
    doc: id => docRef(path + "/" + id),
    orderBy: (f, d) => colRef(path, [...q, forder(f, d)]),
    limit: n => colRef(path, [...q, flimit(n)]),
    onSnapshot: (next, err) => fsnap(fquery(fcol(fs, path), ...q), s => next({docs:s.docs.map(wrap), size:s.size, empty:s.empty}), err)
  });
  return {doc:docRef, collection:p => colRef(p)};
}
/* Claude adapter: calls your own server function, which holds the API key */
function parseLooseJSON(t){
  try { return JSON.parse(t); } catch(e) {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch(e) {} }
  const i = Math.min(...["{","["].map(c => { const k = t.indexOf(c); return k < 0 ? 1e9 : k; }));
  const j = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (i < j) { try { return JSON.parse(t.slice(i, j + 1)); } catch(e) {} }
  throw {code:"invalid_json", text:t};
}
function makeSample(){
  const call = async (prompt, opts={}) => {

function drawCat(st, bank){
  st.used = st.used||{};
  const list = bank==="manager"?MANAGER_CATS:bank==="stadium"?STADIUM_CATS:AURA_CATS;
  let pool = list.map((c,i)=>i).filter(i=>!(st.used[bank]||[]).includes(i));
  if(!pool.length){ pool = list.map((c,i)=>i); st.used[bank]=[]; }
  const i = rand(pool); st.used[bank]=[...(st.used[bank]||[]), i];

}
function catFits(c, dice){ return !(dice===1&&c.cur) && !(dice===3&&c.old) && !(dice===4&&c.nat); }
function drawPlayerCat(st, dice){
  if(dice===9) return {t:"Wildcard: any player you like", h:"No category this round. The usual rules still apply.", bank:"player", wild:true, id:"wild"};
  st.usedIds = st.usedIds||[];
  const used = new Set(st.usedIds);
  const ok = c => !used.has(c.id) && catFits(c, dice);
  let buckets = [[SPECIAL_CATS.filter(ok),.55],[CLUB_CATS.filter(ok),.25],[NAT_CATS.filter(ok),.20]].filter(b=>b[0].length);
  if(!buckets.length){ st.usedIds=[]; buckets=[[SPECIAL_CATS.filter(c=>catFits(c,dice)),1]]; }
  let r = Math.random()*buckets.reduce((s,b)=>s+b[1],0), pool=buckets[0][0];
  for(const b of buckets){ r-=b[1]; if(r<=0){ pool=b[0]; break; } }
  const c = rand(pool); st.usedIds.push(c.id);
  return {...c, bank:"player"};
}

  st.squads = {A:emptySquad(st.players.A.formation), B:emptySquad(st.players.B.formation)};

function bonusTurns(st){
  const turns=[]; const used=new Set();

    if(v && v.empty && !v.bonusTried){ let place, n=0; do{ place=rand(NICHE_PLACES); n++; }while(used.has(place) && n<40); used.add(place);
      turns.push({p, slot:sl.k, cat:{t:`Has played for a club in ${place}`, h:`Niche bonus round for your empty ${sl.label.toLowerCase()} slot.`, bank:"bonus"}}); }
  }

}
function nextRound(st){
  st.stage++;

    const kind = STAGES[st.stage];
    const base = st.stage%2===0 ? st.coin : other(st.coin);
    if(kind==="bonus"){
      const turns = bonusTurns(st);
      if(!turns.length){ st.stage++; continue; }
      st.round = {stage:st.stage, kind, dice:null, cat:null, turns, ti:0, attempt:0, step:"pick", pending:null};
    } else {
      const dice = (kind==="starter"||kind==="sub") ? 1+Math.floor(Math.random()*10) : null;
      let first = base; if(dice===2) first = other(first);
      const cat = kind==="captain" ? {t:"Name your captain",h:"Pick one of your starters. The captain takes your first penalty.",bank:"captain"}
        : (kind==="starter"||kind==="sub") ? drawPlayerCat(st, dice) : drawCat(st, kind);
      st.round = {stage:st.stage, kind, dice, cat, turns:[{p:first},{p:other(first)}], ti:0, attempt:0, step:"pick", pending:null};
    }

  // aura early storm
  for(const p of ["A","B"]){ const a=aura(p); if(a && a.trigger==="early_storm"){ events.push({m:1,type:"aura",t:p,who:a.name}); auraState[p].used=true; } }
  for(let si=0; si<segs.length; si++){
    const [a,b]=segs[si]; const end = si===5 ? 90+stoppage : b;
    if(a===45){
      events.push({m:45,type:"ht"});
      for(const p of ["A","B"]){ const au=aura(p); if(au && !auraState[p].used && au.trigger==="halftime_surge" && score[p]<score[other(p)]){ auraState[p].used=true; auraState[p].surge=si; events.push({m:46,type:"aura",t:p,who:au.name}); } }
    }
    if(a===60){
      for(const p of ["A","B"]){
        for(let k=0;k<2 && T[p].bench.length;k++){
          const outfield = T[p].xi.map((x,i)=>({x,i})).filter(o=>o.x && o.x.g!=="GK" && !o.x.sent);
          if(!outfield.length) break;
          outfield.sort((u,v)=>u.x.rating-v.x.rating);
          const o=outfield[0]; const inn=T[p].bench.shift();
          T[p].xi[o.i] = {...inn, slot:o.x.slot, g:o.x.g, x:o.x.x, y:o.x.y};
          events.push({m:63+k*3+Math.floor(R()*3), type:"sub", t:p, who:inn.name, out:o.x.name, slot:o.x.slot});
        }
      }
    }
    if(a===75){ for(const p of ["A","B"]){ const au=aura(p); if(au && !auraState[p].used && au.trigger==="comeback_late" && score[p]<score[other(p)]){ auraState[p].used=true; auraState[p].late=true; events.push({m:76,type:"aura",t:p,who:au.name}); } } }
    for(const p of ["A","B"]){
      const o=other(p);
      // red cards
      const fiery = T[p].xi.filter(x=>x&&x.fiery&&!x.sent).length;
      let redP = (refType==="Strict"?.02:refType==="Average"?.008:.003)*(1+fiery*.35);
      const oa=aura(o); if(oa && oa.trigger==="chaos") redP*=2.2;
      if(reds[p]===0 && R()<redP){
        const cands=T[p].xi.filter(x=>x&&x.g!=="GK"&&!x.sent); if(cands.length){
          const fierce=cands.filter(x=>x.fiery); const v=pickR(fierce.length?fierce:cands); v.sent=true; reds[p]++;
          events.push({m:a+1+Math.floor(R()*(end-a-1)), type:"red", t:p, who:v.name, slot:v.slot}); }
      }
    }
    for(const p of ["A","B"]){
      const o=other(p); const sp=strength(T[p]), so=strength(T[o]);
      const ratio = sp.att/Math.max(30,so.def);
      let lam = 1.42*Math.pow(ratio,2.1)*(1+Math.min(links[p],14)*.007)*mgr(p)*(1+(sp.mid-so.mid)/400);
      const menP = T[p].xi.filter(x=>x&&!x.sent).length, menO=T[o].xi.filter(x=>x&&!x.sent).length;
      lam *= 1 - .08*(11-menP) + .05*(11-menO);
      if(hostTeam===p){ lam*=1+(stadium.atmosphere||6)/120; }
      if(hostTeam===o && (stadium.altitudeMeters||0)>1500 && a>=60) lam*=.86;
      if(weather==="Heavy rain") lam*=.93; if(weather==="Fog") lam*=.95;
      const au=aura(p);
      if(au && auraState[p].surge===si) lam*=1.8;
      if(au && auraState[p].late && a>=75) lam*=1.7;
      if(au && au.trigger==="early_storm" && a===0) lam*=1.9;
      if(au && au.trigger==="momentum_after_goal" && auraState[p].momentum===si) lam*=1.6;
      if(au && au.trigger==="opponent_collapse" && auraState[p].collapse===si) lam*=1.9;
      // penalty
      const penP = refType==="Strict"?.045:refType==="Average"?.028:.016;
      const evs=[];
      if(R()<penP) evs.push("pen");
      // poisson
      let L=Math.exp(-lam), k=0, prod=1; while(true){ k++; prod*=R(); if(prod<=L) break; } k--;
      for(let i=0;i<k;i++) evs.push("chance");
      for(const kind of evs){
        const m = a+1+Math.floor(R()*(end-a-1));
        const on = T[p].xi.filter(x=>x&&!x.sent&&x.g!=="GK");
        if(!on.length) continue;
        const w = on.map(x=>{ const G2=GROUP(x.g); return (G2==="FWD"?5:G2==="MID"?2:.6)*Math.pow(x.attack/70,2); });
        let rr=R()*w.reduce((s,v)=>s+v,0), shooter=on[0]; for(let i=0;i<on.length;i++){ rr-=w[i]; if(rr<=0){shooter=on[i];break;} }
        let q, finishing;
        if(kind==="pen"){ const best=[...on].sort((u,v)=>v.attack-u.attack)[0]; const cap=on.find(x=>x.name===T[p].sq.captain); shooter = cap||best; q=.78; finishing = .7+shooter.attack/400; }
        else { q = Math.min(.85, -Math.log(1-R())*.12*Math.pow(ratio,.5)); finishing = (.72+shooter.attack/220)*(shooter.golden?1.12:1); if(weather==="Strong wind") q*=.92; }
        const keeper=gk(o); const kr = keeper? keeper.rating : 35;
        let pGoal = Math.min(.93, q*finishing*(1.12-(kr-70)/220));
        if(au && auraState[p].late && a>=75) pGoal*=1.12;
        const oau=aura(o);
        let outcome;
        if(oau && oau.trigger==="keeper_miracle" && !keeperMiracle[o] && q>=.28){ keeperMiracle[o]=true; outcome="miracle"; }
        else outcome = R()<pGoal ? "goal" : (R()<.5?"saved":R()<.5?"wide":"blocked");
        stats[p].shots++; stats[p].xg+=q; if(outcome==="goal"||outcome==="saved"||outcome==="miracle") stats[p].onT++;
        events.push({m, type: kind==="pen"?"pen":"chance", t:p, who:shooter.name, slot:shooter.slot, xg:+q.toFixed(2), outcome, keeper: keeper?keeper.name:null});
        if(outcome==="goal"){
          score[p]++;
          if(au && au.trigger==="momentum_after_goal"){ auraState[p].momentum=si+1; if(!auraState[p].used){auraState[p].used=true; events.push({m:m,type:"aura",t:p,who:au.name});} }
          if(au && au.trigger==="opponent_collapse" && !auraState[p].used){ auraState[p].used=true; auraState[p].collapse=si+1; events.push({m:m,type:"aura",t:p,who:au.name}); }
        }
      }
    }
  }
  // stoppage-time aura
  for(const p of ["A","B"]){ const au=aura(p); if(au && !auraState[p].used && au.trigger==="stoppage_time" && score[p]<=score[other(p)]){
    auraState[p].used=true; const on=T[p].xi.filter(x=>x&&!x.sent&&x.g!=="GK"); if(!on.length) continue;
    const header=[...on].sort((u,v)=>(GROUP(v.g)==="DEF"?10:0)+v.rating-((GROUP(u.g)==="DEF"?10:0)+u.rating))[0];
    events.push({m:90+stoppage,type:"aura",t:p,who:au.name});
    const out = R()<.38?"goal":"saved"; if(out==="goal") score[p]++; stats[p].shots++; stats[p].xg+=.38; stats[p].onT++;
    events.push({m:90+stoppage, type:"chance", t:p, who:header.name, slot:header.slot, xg:.38, outcome:out, setpiece:true}); } }
  events.sort((u,v)=>u.m-v.m || (u.type==="aura"?-1:0));
  events.push({m:90+stoppage, type:"ft"});
  // penalties
  let pens=null;
  if(score.A===score.B){
    const takers = p=>{ const on=T[p].xi.filter(x=>x&&!x.sent&&x.g!=="GK").sort((u,v)=>v.attack-u.attack); const cap=on.find(x=>x.name===T[p].sq.captain); return cap?[cap,...on.filter(x=>x!==cap)]:on; };
    const tA=takers("A"), tB=takers("B"); const log=[]; let a=0,b=0;
    for(let i=0;i<14;i++){
      const pa=tA[i%Math.max(1,tA.length)], pb=tB[i%Math.max(1,tB.length)];
      const kb=gk("B"), ka=gk("A");
      const sa = R() < .74 + ((pa?.attack||60)-75)/300 - ((kb?.rating||40)-75)/300;
      const sb = R() < .74 + ((pb?.attack||60)-75)/300 - ((ka?.rating||40)-75)/300;
      a+=sa; b+=sb; log.push({A:pa?.name||"?", a:sa, B:pb?.name||"?", b:sb});
      if(i<5){ const rem=4-i; if(a>b+rem||b>a+rem) break; } else if(a!==b) break;
    }
    pens={A:a,B:b,log};
  }
  const pos = clamp(50+ (strength(T.A).mid-strength(T.B).mid)*.6, 34, 66);
  stats.A.xg=+stats.A.xg.toFixed(2); stats.B.xg=+stats.B.xg.toFixed(2);
  const winner = score.A>score.B?"A":score.B>score.A?"B":pens?(pens.A>pens.B?"A":"B"):null;
  return {seed, rolls, events, final:{...score}, stats, possession:{A:Math.round(pos),B:100-Math.round(pos)}, pens, winner, lineups, stoppage, links};
}

/* Templated commentary (fallback when Claude isn't available) */
function templLine(ev, st){
  const tn = p => st.players[p].team;
  switch(ev.type){
    case "ht": return "Half-time.";
    case "ft": return "Full-time.";
    case "sub": return `${tn(ev.t)} change: ${ev.who} on for ${ev.out}.`;
    case "red": return `Red card! ${ev.who} is sent off and ${tn(ev.t)} are down a man.`;
    case "aura": return `Aura: ${ev.who}. Something shifts for ${tn(ev.t)}.`;
    case "pen": return ev.outcome==="goal" ? `Penalty to ${tn(ev.t)}. ${ev.who} sends the keeper the wrong way.` : `Penalty to ${tn(ev.t)}... ${ev.who} misses!`;
    case "chance":
      if(ev.outcome==="goal") return ev.xg<.1 ? `Out of nothing! ${ev.who} scores a worldie for ${tn(ev.t)}.` : ev.xg>.4 ? `${ev.who} can't miss, and doesn't. Goal for ${tn(ev.t)}.` : `GOAL! ${ev.who} finishes it for ${tn(ev.t)}.`;
      if(ev.outcome==="miracle") return `Huge chance for ${ev.who}... and a miracle save from ${ev.keeper||"the keeper"}!`;
      if(ev.outcome==="saved") return `${ev.who} forces a save${ev.keeper?" from "+ev.keeper:""}.`;
      if(ev.outcome==="wide") return `${ev.who} drags it wide.`;
      return `${ev.who}'s shot is blocked.`;
  }
  return "";
}

/* Claude-written dossier + commentary */
async function writeReport(st, sim){
  if(!sample) return null;
  const team = p => { const sq=st.squads[p]; return {
    name: st.players[p].team, formation: sq.formation, manager: sq.manager?.name||"none", stadium: sq.stadium?.name||"none", aura: sq.aura?.name? `${sq.aura.name} (${sq.aura.effect})`:"none", captain: sq.captain,
    xi: slotsOf(sq.formation).map(s=>{ const v=sq.slots[s.k]; return `${s.k}: ${v&&v.name?v.name+(v.isMeme?" [timeout meme pick]":"")+(v.golden?" [golden form]":"")+` (${v.rating||"?"})`:"EMPTY"}`; }),
    bench: sq.subs.map(v=>v&&v.name?v.name:"empty"), chemistry: chemLinks(sq).slice(0,8).map(l=>`${l.a.k}-${l.b.k} (${l.why.join(", ")})`) }; };
  const evs = sim.events.map((e,i)=>({i, m:e.m, team:e.t?st.players[e.t].team:"", type:e.type, who:e.who, out:e.out, xg:e.xg, outcome:e.outcome, keeper:e.keeper}));
  const prompt = `Write the match material for a simulated football match in a draft game between two friends. Players appear in their prime. Be vivid, specific and knowledgeable about the real players, but brief.

PRE-MATCH ROLLS: ${JSON.stringify(sim.rolls)}
TEAM A: ${JSON.stringify(team("A"))}
TEAM B: ${JSON.stringify(team("B"))}
MATCH EVENTS (already decided by dice; do not change them): ${JSON.stringify(evs)}
FINAL: ${st.players.A.team} ${sim.final.A}-${sim.final.B} ${st.players.B.team}${sim.pens?` (penalties ${sim.pens.A}-${sim.pens.B})`:""}

Reply with only JSON:
{"headline":"A pre-match headline that does NOT reveal the result","dossier":["3 short paragraphs of pre-match scouting: tactics of each manager, the key strengths and weak spots (empty slots, meme picks, golden players, chemistry), the conditions. Must NOT hint at the result."],"keyBattles":["3 one-sentence matchups"],"lines":{"0":"one commentary sentence for event 0","1":"..."},"verdict":"2-3 sentences explaining why the match went the way it did","motm":"Player name"}
Write a line for EVERY event index. Keep each line under 28 words.`;
  try{
    const res = await sample.json(prompt, {modelTier:"default", cache:false});
    if(res && typeof res==="object") return res;
  }catch(e){ console.warn("report", e); }
  return null;
}

// Which seat runs the match + commentary: one whose device can reach Claude.
function simRunner(){ const ok=G.refOk||{}; if(ok.A!==false) return "A"; if(ok.B!==false) return "B"; return "A"; }

function afterState(prev){
  if(!G) return;
  if(G.phase==="draft" && G.round?.step==="judging" && G.round.pending?.judge===mySeat) runJudge();
  if(G.phase==="prematch" && mySeat){
    const delay = mySeat===simRunner() ? 1200 : 15000;
    const k="sim"+G.id+G.seq; if(!fired[k]){ fired[k]=1; setTimeout(()=>{ if(G && G.phase==="prematch") runMatch(); }, delay); }
  }
  if(G.phase==="match" && prev?.phase!=="match"){ matchOffset=0; PB=null; }
  if(G.phase==="match" && !raf) startPlayback();
}

function tick(){
  updateTimerUI();
  if(!G || !mySeat || !canWrite) return;
  const now=Date.now();
  if(G.phase==="draft" && G.round){
    const r=G.round, turn=r.turns[r.ti], mine=turn.p===mySeat;
    if(r.step==="pick" && now > r.deadline + (mine?300:5000)){ const k="to"+r.key; if(!fired[k]){ fired[k]=1; commit(M.timeout(r.key)); } }
    if(r.step==="review" && now > r.reviewDeadline + (mine?5000:300)){ const k="rv"+r.key; if(!fired[k]){ fired[k]=1; commit(M.resolve(r.key,"accept",other(turn.p))); } }
    if(r.step==="judging" && r.pending && now - r.pending.at > 75000){ const k="un"+r.key+(r.pending.tried||[]).length; if(!fired[k]){ fired[k]=1; commit(M.handoff(r.key, r.pending.judge, "timeout")); } }
  }
  if(G.phase==="report" && G.reportStartedAt && now-G.reportStartedAt>150000){ const k="rp"+G.reportStartedAt; if(!fired[k]){ fired[k]=1; commit(st=>{ if(st.phase!=="report"||Date.now()-st.reportStartedAt<150000) return false; st.phase="prematch"; pushLog(st,"The match host dropped out. Restarting kick-off."); }); } }
}

async function submitPick(){
  if(!G||!G.round) return;
  const r=G.round, turn=r.turns[r.ti]; if(turn.p!==mySeat||r.step!=="pick") return;
  const name = ($("#pick")?.value||"").trim();
  const err = $("#pickerr"); const say = t=>{ if(err) err.textContent=t; };
  if(!name){ say("Type a name first."); return; }
  let slot = null;
  if(r.kind==="starter"){ slot=uiSel.slot; if(!slot){ say("Choose which slot he plays in."); return; } if(G.squads[mySeat].slots[slot]!==null){ say("That slot is already filled. Choose an open one."); return; } }
  if(r.kind==="bonus") slot=turn.slot;
  await commit(M.beginJudging(r.key, mySeat, name, slot));
}
async function submitCaptain(name){ if(!G?.round) return; await commit(M.captain(G.round.key, mySeat, name)); }
async function review(action){ if(!G?.round) return; await commit(M.resolve(G.round.key, action, mySeat)); }

async function runMatch(){
  if(!G || G.phase!=="prematch") return;
  try{ const l = await gameRef.acquire({holder:me.id, ttlMs:180000}); if(!l.acquired) return; }catch(e){}
  const fresh = structuredClone((await gameRef.get()).data()); if(!fresh || fresh.phase!=="prematch") return;
  const ok0 = await commit(st=>{ if(st.phase!=="prematch") return false; st.phase="report"; st.reportStartedAt=Date.now(); pushLog(st,"Checking ratings and writing the scouting dossier."); });
  if(!ok0) return;
  const fixed = await backfillRatings(fresh);
  const sim = simulate(fresh, Math.floor(Math.random()*2**31));
  const report = await writeReport(fresh, sim);
  await commit(st=>{ if(st.phase!=="report") return false;
    if(fixed) st.squads = fresh.squads;
    st.match = {...sim, report}; st.phase="match"; st.match.kickoffAt=Date.now()+(report?20000:6000); });
}
async function rematch(){
  await commit(st=>{
    if(st.phase!=="match" && st.phase!=="done") return false;
    const keep={A:st.players.A, B:st.players.B};
    st.history=[...(st.history||[]), {final:st.match?.final, pens:st.match?.pens?{A:st.match.pens.A,B:st.match.pens.B}:null, winner:st.match?.winner}].slice(-10);
    delete st.match; st.usedIds=[]; st.used={}; st.players=keep; st.log=[]; pushLog(st,"Rematch! New draft, new dice.");
    startDraft(st);
  });
  matchOffset=0; PB=null; if(raf) cancelAnimationFrame(raf); raf=null;
}

function restoreInputs(c){ for(const id in c.o){ const el=document.getElementById(id); if(el && el.type!=="hidden") el.value=c.o[id]; } if(c.focus){ const el=document.getElementById(c.focus); if(el){ el.focus(); if(c.sel&&el.setSelectionRange) try{el.setSelectionRange(c.sel[0],c.sel[1]);}catch(e){} } } }

/* ============================================================
   Match view + playback
   The ball follows a pre-built timeline of passes, dribbles, tackles
   and shots (seeded, identical on both devices). Players hold their
   formation shape and the whole block slides with the ball.
   ============================================================ */
const PW=1050, PH=680, BASE_MS=1000, SLOW=2.6, HT_MS=2500, PASS_SPEED=480;
let PB=null, dots={}, lastFeedCount=-1, lastGoalShown=null, lastFrameT=0;

function playerXY(team, s){ // base formation position on the big pitch
  const depth = 55 + s.y/100*430;
  if(team==="A") return [depth, 70 + s.x/100*540];
  return [PW-depth, 70 + (100-s.x)/100*540];
}
function shapePos(p, s, bx, by, pt){
  // u = how far up the pitch the ball is from this team's point of view (0 own goal, 1 opponent goal)
  const u = clamp(p==="A" ? bx/PW : 1-bx/PW, 0, 1);
  const push = pt===p ? 40 : pt ? -30 : 0;
  const q = clamp((s.y-7)/80, 0, 1);                 // 0 = deepest outfielder, 1 = striker
  let depth;
  if(s.g==="GK") depth = 32 + u*55;
  else { const back = 85 + u*380 + push, front = 300 + u*600 + push; depth = back + q*(front-back); }
  depth = clamp(depth, 30, PW-60);
  const baseY = 70 + (p==="A" ? s.x : 100-s.x)/100*540;
  const width = pt===p ? 1 : .78;                    // defending teams narrow up
  let y = PH/2 + (baseY-PH/2)*width;
  y += (by - y) * (s.g==="GK" ? .18 : .22);
  return [p==="A" ? depth : PW-depth, clamp(y,30,PH-30)];
}
function lineupAt(t, m){
  const L={A:m.lineups.A.map(x=>x&&{...x}), B:m.lineups.B.map(x=>x&&{...x})};
  for(const e of m.events){ if(e.m>t) break;
    if(e.type==="red"){ const i=L[e.t].findIndex(x=>x&&x.name===e.who); if(i>=0) L[e.t][i]=null; }
    if(e.type==="sub"){ const i=L[e.t].findIndex(x=>x&&x.name===e.out); if(i>=0) L[e.t][i]={...L[e.t][i], name:e.who}; }
  }
  return L;
}

function buildBall(m){
  const R = mulberry(((m.seed*31)+7)>>>0), rr=(a,b)=>a+R()*(b-a);
  const endMin = 90+m.stoppage;
  const K=[], at=new Map();
  let t=0, pt="A", bx=PW/2, by=PH/2, hold=null;
  const key=(tt,x,y,h,p,kind)=>{ tt=Math.max(tt,t+0.02); K.push({t:tt,x,y,h,pt:p,kind}); t=tt; bx=x; by=y; hold=h; pt=p; };
  const alive=(p,time)=>lineupAt(time,m)[p].map((x,i)=>x?{...x,i}:null).filter(Boolean);
  const anchor=(p,i,ballTeam)=>{ const s=lineupAt(t,m)[p][i]; if(!s) return [bx,by]; let [x,y]=playerXY(p,s); for(let k=0;k<3;k++) [x,y]=shapePos(p,s,x,y,ballTeam); return [x,y]; };
  const dirOf=p=>p==="A"?1:-1;
  const choose=(p,exclude,fwd)=>{
    const c=alive(p,t).filter(x=>x.i!==exclude && x.g!=="GK"); if(!c.length) return null;
    const w=c.map(x=>{ const [ax,ay]=anchor(p,x.i,p); const prog=(ax-bx)*dirOf(p); const d=Math.hypot(ax-bx,ay-by);
      return Math.exp(prog/(fwd?140:260)) * (d>460?.25:1) * (d<60?.3:1); });
    let r=R()*w.reduce((s,v)=>s+v,0); for(let k=0;k<c.length;k++){ r-=w[k]; if(r<=0) return c[k].i; } return c[c.length-1].i; };
  const pass=(p,i,dribble=true)=>{ if(i==null) return;
    const [x,y]=anchor(p,i,p); const d=Math.hypot(x-bx,y-by);
    key(t+clamp(d/PASS_SPEED,.12,.9), x, y, {p,i}, p, "pass");
    if(dribble){ const fx=clamp(bx+dirOf(p)*rr(8,45),40,PW-40), fy=clamp(by+rr(-25,25),40,PH-40); key(t+rr(.06,.2), fx, fy, {p,i}, p, "dribble"); } };
  const turnover=()=>{ const o=other(pt); const c=alive(o,t).filter(x=>x.g!=="GK"); if(!c.length) return;
    let best=null, bd=1e9; for(const x of c){ const [ax,ay]=anchor(o,x.i,o); const d=Math.hypot(ax-bx,ay-by); if(d<bd){bd=d;best={x:ax,y:ay,i:x.i};} }
    const tx=bx+(best.x-bx)*.7, ty=by+(best.y-by)*.7;
    key(t+clamp(bd/PASS_SPEED,.1,.5), tx, ty, {p:o,i:best.i}, o, "tackle"); };
  const kickoff=(p,time)=>{ const c=alive(p,time).filter(x=>x.g!=="GK").sort((u,v)=>v.y-u.y); const s=c[0];
    t=Math.max(t,time-0.02); key(time, PW/2, PH/2, s?{p,i:s.i}:null, p, "kickoff"); };
  const shotIdx = m.events.map((e,i)=>i).filter(i=>m.events[i].type==="chance"||m.events[i].type==="pen");
  let si=0, half2=false;
  kickoff("A",0.02);
  let guard=0;
  while(t<endMin && guard++<5000){
    const ni=shotIdx[si], ne = ni!=null ? m.events[ni] : null;
    if(!half2 && (!ne || ne.m>=45) && t>=44.3){ half2=true; key(45, PW/2, PH/2, null, pt, "ht"); kickoff("B",45.02); continue; }
    if(ne && ne.m - t <= 1.25){
      const P=ne.t, T=Math.max(ne.m, t+0.6);
      at.set(ni, T);
      if(pt!==P) turnover();
      const L=lineupAt(T,m)[P]; let shooter=L.findIndex(x=>x&&x.name===ne.who); if(shooter<0) shooter=choose(P,-1,true);
      if(shooter==null){ si++; continue; }
      if(ne.type==="pen"){
        key(Math.max(t+0.25,T-0.5), P==="A"?PW-125:125, PH/2, {p:P,i:shooter}, P, "pen");
      } else {
        let n=0; while(T-0.2-t > 0.5 && n<4){ const nx=choose(P, hold?hold.i:-1, true); if(nx==null||nx===shooter) break; pass(P,nx,true); n++; }
        let [sx,sy]=anchor(P,shooter,P);
        sx = P==="A" ? Math.max(sx, PW-310) : Math.min(sx, 310); sy = clamp(sy, PH/2-190, PH/2+190);
        if(ne.setpiece){ sx = P==="A"?PW-110:110; sy=PH/2+rr(-30,30); }
        key(Math.max(t+0.12, T-0.14), sx, sy, {p:P,i:shooter}, P, "pass");
      }
      const o=other(P), gy=PH/2+rr(-26,26), gk=alive(o,T).find(x=>x.g==="GK");
      const out=ne.outcome;
      if(out==="goal"){ key(T, P==="A"?PW-12:12, gy, null, P, "goal"); key(T+0.9, P==="A"?PW-12:12, gy, null, P, "net"); kickoff(o, T+0.95); }
      else if(out==="saved"||out==="miracle"){ const kx=P==="A"?PW-55:55; key(T, kx, gy, gk?{p:o,i:gk.i}:null, o, "save"); key(T+0.35, kx, gy, gk?{p:o,i:gk.i}:null, o, "hold"); }
      else if(out==="wide"){ key(T, P==="A"?PW-6:6, PH/2+(R()<.5?-1:1)*rr(70,150), null, P, "wide"); key(T+0.45, P==="A"?PW-80:80, PH/2+rr(-40,40), gk?{p:o,i:gk.i}:null, o, "goalkick"); }
      else { key(T, bx+(P==="A"?40:-40), by+rr(-20,20), null, P, "blocked"); turnover(); }
      si++; continue;
    }
    // open play
    const limit = Math.min(ne ? ne.m-1.25 : endMin, half2 ? endMin : 45, t+rr(1.3,3.4));
    if(limit - t < .3){ key(t+.15, clamp(bx+dirOf(pt)*12,40,PW-40), by, hold, pt, "dribble"); continue; }
    while(t < limit-.25){ const nx=choose(pt, hold?hold.i:-1, false); if(nx==null) break; pass(pt,nx,R()<.6); }
    if(t < endMin-.4) turnover();
  }
  key(endMin+0.6, bx, by, hold, pt, "end");
  return {K, at};
}
function buildPlayback(m){
  const {K, at} = buildBall(m);
  const endMin = 90+m.stoppage;
  const wins=[];
  for(const [i,T] of [...at.entries()].sort((a,b)=>a[1]-b[1])){ const a=T-1.15, b=T+0.45;
    if(wins.length && a<=wins[wins.length-1][1]) wins[wins.length-1][1]=Math.max(b,wins[wins.length-1][1]); else wins.push([a,b]); }
  const segs=[]; let g=0, r=0, htReal=null;
  const run=(g1,rate)=>{ if(g1<=g) return; if(g<45 && g1>=45){ segs.push({g0:g,g1:45,r0:r,r1:r+(45-g)*rate}); r+=(45-g)*rate; g=45; htReal=r; segs.push({g0:45,g1:45,r0:r,r1:r+HT_MS}); r+=HT_MS; }
    if(g1>g){ segs.push({g0:g,g1,r0:r,r1:r+(g1-g)*rate}); r+=(g1-g)*rate; g=g1; } };
  for(const [a,b] of wins){ run(Math.max(0,a), BASE_MS); run(Math.min(b,endMin+0.6), BASE_MS*SLOW); }
  run(endMin+0.6, BASE_MS);
  return {K, at, segs, total:r, htReal, endMin};
}
function realToGame(pb, ms){
  if(ms<=0) return ms/BASE_MS;
  for(const s of pb.segs){ if(ms<=s.r1){ return s.g1===s.g0 ? s.g0 : s.g0 + (ms-s.r0)*(s.g1-s.g0)/(s.r1-s.r0); } }
  return pb.endMin+0.6 + (ms-pb.total)/BASE_MS;
}
function getPB(){ const m=G.match; const k=m.seed+":"+m.kickoffAt; if(PB && PB.k===k) return PB; PB=buildPlayback(m); PB.k=k; dots={}; lastFeedCount=-1; lastGoalShown=null; return PB; }

function matchHTML(){
  const m=G.match; const rep=m.report;
  const A=G.players.A.team, B=G.players.B.team;
  const ro=m.rolls;
  const rollChip=(label,val,roll)=>`<div class="roll">${roll?`<span class="pill">${roll}/6</span>`:""}<div style="min-width:0"><div class="eyebrow">${label}</div><div>${esc(val)}</div></div></div>`;
  return `<div class="matchtop"><div class="tn" style="color:var(--cobalt-soft)">${esc(A)}</div><div><div class="score num"><span id="scA">0</span><span class="clk" id="clock">0'</span><span id="scB">0</span></div><div class="poss" aria-label="Possession"><i id="possA" style="width:50%;background:var(--cobalt)"></i><i id="possB" style="width:50%;background:var(--red)"></i></div></div><div class="tn r" style="color:var(--red-soft)">${esc(B)}</div></div>
   <div class="pitchwrap"><svg id="pitch" viewBox="0 0 ${PW} ${PH}" role="img" aria-label="Live match pitch">${pitchSVG()}</svg><div class="goalbanner" id="goalbanner"></div></div>
   <div class="btnrow" style="margin-top:10px;justify-content:space-between"><div class="btnrow"><button class="btn ghost sm" id="skip">Skip to full time</button>${mySeat?`<button class="btn gold sm" id="rematch" hidden>Rematch</button>`:""}<button class="btn ghost sm" id="toLobby">Back to lobby</button></div><span class="muted" id="kick" style="font-size:13px"></span></div>
   <div class="matchgrid">
     <div style="display:grid;gap:16px">
       <div class="feed" id="feed" aria-live="polite"><div class="muted">Kick-off is coming up. Read the dossier while you wait.</div></div>
       <div class="dossier" id="result" hidden></div>
     </div>
     <div class="dossier">
       <div class="eyebrow">Scouting dossier</div>
       <h4>${esc(rep?.headline || `${A} vs ${B}`)}</h4>
       <div class="rolls">
         ${rollChip("Venue", ro.venue.name+(ro.venue.host?` (${G.players[ro.venue.host].team} at home)`:""), ro.venue.roll)}
         ${rollChip("Weather", ro.weather.name, ro.weather.roll)}
         ${rollChip("Referee", ro.ref.name, ro.ref.roll)}
         ${["A","B"].map(p=>{ const i=ro["injury"+p]; if(!i) return ""; return rollChip(`Injury check · ${G.players[p].team}`, i.roll===1?`${i.who} OUT${i.replacedBy?", "+i.replacedBy+" starts":""}`:`${i.who} fit`, i.roll); }).join("")}
       </div>
       ${(rep?.dossier||[]).map(p=>`<p>${esc(p)}</p>`).join("") || `<p class="muted">Claude's dossier isn't available for this match, so the game is using its own commentary.</p>`}
       ${rep?.keyBattles?.length?`<div class="eyebrow">Key battles</div><ul style="margin:0;padding-left:18px;display:grid;gap:4px">${rep.keyBattles.map(k=>`<li>${esc(k)}</li>`).join("")}</ul>`:""}
     </div>
   </div>
   <div class="arena" style="grid-template-columns:1fr 1fr">${teamHTML("A")}${teamHTML("B")}</div>`;
}
function pitchSVG(){
  let stripes=""; for(let i=0;i<10;i++) stripes+=`<rect x="${i*105}" y="0" width="105" height="${PH}" style="fill:${i%2?"var(--pitch-2)":"var(--pitch)"}"/>`;
  const L=`style="stroke:var(--chalk)" stroke-width="3" fill="none"`;
  return `${stripes}
   <rect x="25" y="25" width="${PW-50}" height="${PH-50}" ${L}/><line x1="${PW/2}" y1="25" x2="${PW/2}" y2="${PH-25}" ${L}/><circle cx="${PW/2}" cy="${PH/2}" r="80" ${L}/><circle cx="${PW/2}" cy="${PH/2}" r="4" style="fill:var(--chalk)"/>
   <rect x="25" y="${PH/2-165}" width="150" height="330" ${L}/><rect x="25" y="${PH/2-70}" width="52" height="140" ${L}/><circle cx="130" cy="${PH/2}" r="4" style="fill:var(--chalk)"/>
   <rect x="${PW-175}" y="${PH/2-165}" width="150" height="330" ${L}/><rect x="${PW-77}" y="${PH/2-70}" width="52" height="140" ${L}/><circle cx="${PW-130}" cy="${PH/2}" r="4" style="fill:var(--chalk)"/>
   <rect id="netA" x="5" y="${PH/2-40}" width="20" height="80" fill="rgba(255,255,255,.18)" style="stroke:var(--chalk)" stroke-width="3"/>
   <rect id="netB" x="${PW-25}" y="${PH/2-40}" width="20" height="80" fill="rgba(255,255,255,.18)" style="stroke:var(--chalk)" stroke-width="3"/>
   <line id="trail" x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10" opacity="0"/>
   <g id="dotsA"></g><g id="dotsB"></g>
   <ellipse id="ballshadow" cx="${PW/2}" cy="${PH/2+6}" rx="9" ry="4" fill="rgba(0,0,0,.35)"/>
   <circle id="ball" cx="${PW/2}" cy="${PH/2}" r="9" fill="#fff" stroke="#111" stroke-width="2.5"/>`;
}
function startPlayback(){ const loop=(ts)=>{ frame(false, ts); raf=requestAnimationFrame(loop); }; raf=requestAnimationFrame(loop); }
function frame(force, ts){
  if(!G||G.phase!=="match"||!G.match||!$("#pitch")) return;
  const m=G.match, pb=getPB();
  const realMs = Date.now()+matchOffset-(m.kickoffAt||0);
  const g = realToGame(pb, realMs);
  const kick=$("#kick"); if(kick) kick.textContent = g<0 ? `Kick-off in ${Math.ceil(-realMs/1000)}s` : "";
  const dt = Math.min(.1, ((ts||performance.now()) - (lastFrameT||0))/1000); lastFrameT = ts||performance.now();
  const gg = clamp(g, 0, pb.endMin+0.6);
  // ball from keyframes
  const K=pb.K; let lo=0, hi=K.length-1;
  while(lo<hi){ const mid=(lo+hi+1)>>1; if(K[mid].t<=gg) lo=mid; else hi=mid-1; }
  const a=K[lo], b=K[Math.min(lo+1,K.length-1)];
  const f = b.t>a.t ? clamp((gg-a.t)/(b.t-a.t),0,1) : 1;
  const fly = b.kind==="pass"||b.kind==="goal"||b.kind==="save"||b.kind==="wide"||b.kind==="tackle";
  const e = fly ? f : f*f*(3-2*f);
  const bx = a.x+(b.x-a.x)*e, by = a.y+(b.y-a.y)*e;
  const dist = Math.hypot(b.x-a.x,b.y-a.y);
  const lift = (b.kind==="pass" && dist>260) ? Math.sin(Math.PI*f)*Math.min(14,dist/40) : 0;
  const ball=$("#ball"); ball.setAttribute("cx",bx.toFixed(1)); ball.setAttribute("cy",(by-lift).toFixed(1)); ball.setAttribute("r",(9+lift*.25).toFixed(1));
  const sh=$("#ballshadow"); sh.setAttribute("cx",bx.toFixed(1)); sh.setAttribute("cy",(by+6).toFixed(1));
  const isShot = b.kind==="goal"||b.kind==="save"||b.kind==="wide"||b.kind==="blocked";
  const tr=$("#trail");
  if(isShot && f<1){ tr.setAttribute("x1",a.x); tr.setAttribute("y1",a.y); tr.setAttribute("x2",bx); tr.setAttribute("y2",by); tr.setAttribute("opacity",".8"); } else tr.setAttribute("opacity","0");
  const pt = (fly && b.kind!=="tackle") ? a.pt : (b.kind==="tackle" && f>.6 ? b.pt : a.pt);
  // players
  const L=lineupAt(gg, m);
  const same=(h,p,i)=>h && h.p===p && h.i===i;
  for(const p of ["A","B"]){
    const grp=$("#dots"+p); if(!grp) continue;
    const col = p==="A"?"var(--cobalt)":"var(--red)";
    let html="";
    L[p].forEach((s,i)=>{ if(!s) return;
      let [tx,ty] = shapePos(p, s, bx, by, pt);
      const k=p+i; let speed=4;
      if(same(a.h,p,i) && same(b.h,p,i)){ tx=bx; ty=by; speed=40; }          // dribbling
      else if(same(b.h,p,i) && b.kind!=="kickoff"){ tx=b.x; ty=b.y; speed=7; } // running onto the ball
      else if(same(a.h,p,i) && f<.25){ tx=a.x; ty=a.y; speed=10; }           // just played it
      if(g<0 || !dots[k]) dots[k]={x:tx,y:ty};
      const d=dots[k]; const kk=1-Math.exp(-dt*speed); d.x+=(tx-d.x)*kk; d.y+=(ty-d.y)*kk;
      const gk = s.g==="GK", holder = same(a.h,p,i)&&same(b.h,p,i);
      html+=`<g transform="translate(${d.x.toFixed(1)},${d.y.toFixed(1)})">${holder?`<circle r="21" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/>`:""}<circle r="14" style="fill:${gk?"var(--saffron)":col}" stroke="#fff" stroke-width="2.5"/><text y="30" text-anchor="middle" font-family="Archivo,sans-serif" font-size="14" font-weight="700" fill="#fff" stroke="rgba(0,0,0,.5)" stroke-width="3" paint-order="stroke">${esc(surname(s.name).slice(0,11))}</text></g>`;
    });
    grp.innerHTML=html;
  }
  // events, score, clock
  const atOf = (ev,idx) => pb.at.has(idx) ? pb.at.get(idx) : ev.m;
  const revealed = m.events.map((ev,idx)=>({ev,idx,at:atOf(ev,idx)})).filter(o=>o.at<=gg || g>pb.endMin+0.5).sort((u,v)=>u.at-v.at);
  const sc={A:0,B:0}; revealed.forEach(({ev})=>{ if((ev.type==="chance"||ev.type==="pen")&&ev.outcome==="goal") sc[ev.t]++; });
  $("#scA").textContent=sc.A; $("#scB").textContent=sc.B;
  const inHT = pb.htReal!=null && realMs>=pb.htReal && realMs<pb.htReal+HT_MS;
  $("#clock").textContent = g<0?"0'": g>pb.endMin+0.5 ? (m.pens?"PENS":"FT") : inHT?"HT" : gg>90?`90+${Math.max(1,Math.ceil(gg-90))}'`:`${Math.floor(gg)+1}'`;
  const pa=$("#possA"), pbb=$("#possB"); if(pa){ pa.style.width=m.possession.A+"%"; pbb.style.width=m.possession.B+"%"; }
  const lastGoal=[...revealed].reverse().find(o=>(o.ev.type==="chance"||o.ev.type==="pen")&&o.ev.outcome==="goal");
  const gb=$("#goalbanner");
  if(lastGoal && gg-lastGoal.at<0.95 && g<=pb.endMin+0.5){ const k=lastGoal.idx; if(lastGoalShown!==k){ lastGoalShown=k; const ev=lastGoal.ev;
      gb.innerHTML=`<div style="color:${ev.t==="A"?"#dfe5fb":"#fbe1df"}">Goal!<small>${esc(ev.who)}</small></div>`;
      const net=$("#net"+(ev.t==="A"?"B":"A")); if(net){ net.setAttribute("fill","rgba(242,183,5,.65)"); setTimeout(()=>net&&net.setAttribute("fill","rgba(255,255,255,.18)"),1400);} } }
  else if(gb.innerHTML){ gb.innerHTML=""; }
  if(revealed.length!==lastFeedCount || force){
    lastFeedCount=revealed.length;
    const lines=m.report?.lines||{};
    const feed=$("#feed");
    if(revealed.length){
      feed.innerHTML = revealed.map(({ev,idx})=>{ const txt = lines[idx] || lines[String(idx)] || templLine(ev,G);
        const isGoal=(ev.type==="chance"||ev.type==="pen")&&ev.outcome==="goal";
        const lab = ev.type==="ht"?"HT":ev.type==="ft"?"FT":ev.m>90?`90+${ev.m-90}'`:`${ev.m}'`;
        return `<div class="ev ${isGoal?"goal":""} ${ev.type==="red"?"red":""}"><span class="m">${lab}</span><span>${ev.t&&!isGoal?`<b style="color:${ev.t==="A"?"var(--cobalt)":"var(--red)"}">${esc(G.players[ev.t].team)}</b> · `:""}${esc(txt)}</span></div>`; }).reverse().join("");
    }
  }
  const res=$("#result");
  if(g>pb.endMin+0.5 && res && res.hidden){
    res.hidden=false; const rm=$("#rematch"); if(rm) rm.hidden=false;
    const s=m.stats, A=G.players.A.team, B=G.players.B.team;
    const pens = m.pens ? `<div class="eyebrow">Penalty shootout</div>${["A","B"].map(p=>`<div class="pens"><b style="min-width:110px">${esc(G.players[p].team)}</b>${m.pens.log.map(l=>`<i class="${(p==="A"?l.a:l.b)?"y":"n"}" title="${esc(p==="A"?l.A:l.B)}"></i>`).join("")} <span class="num">${m.pens[p]}</span></div>`).join("")}` : "";
    const wn = m.winner ? G.players[m.winner].team : null;
    res.innerHTML = `<div class="eyebrow">Full time</div><h4>${wn?esc(wn)+" win":"It's a draw"} · ${m.final.A}–${m.final.B}${m.pens?` (${m.pens.A}–${m.pens.B} pens)`:""}</h4>
      ${m.report?.verdict?`<p>${esc(m.report.verdict)}</p>`:""}${m.report?.motm?`<p><span class="pill gold">Player of the match</span> <b>${esc(m.report.motm)}</b></p>`:""}
      <table class="statt"><tr><td style="color:var(--cobalt)">${esc(A)}</td><td class="eyebrow"></td><td style="color:var(--red)">${esc(B)}</td></tr>
      <tr><td>${s.A.shots}</td><td>Shots</td><td>${s.B.shots}</td></tr><tr><td>${s.A.onT}</td><td>On target</td><td>${s.B.onT}</td></tr>
      <tr><td>${s.A.xg.toFixed(2)}</td><td>xG</td><td>${s.B.xg.toFixed(2)}</td></tr><tr><td>${m.possession.A}%</td><td>Possession</td><td>${m.possession.B}%</td></tr>
      <tr><td>${m.links.A}</td><td>Chemistry links</td><td>${m.links.B}</td></tr></table>${pens}
      ${(G.history||[]).length?`<div class="eyebrow">Earlier games</div><div class="muted" style="font-size:13px">${G.history.map(h=>h.final?`${h.final.A}–${h.final.B}${h.pens?` (${h.pens.A}–${h.pens.B} p)`:""}`:"").join(" · ")}</div>`:""}`;
  }
}

function bind(){
  const on=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn));
  on("#create","click",createGame);
  on("#acode","input",e=>{ lsSet("dn_code", e.currentTarget.value.trim()); accessProblem=false; });
  on("[data-join]","click",e=>joinGame(e.currentTarget.dataset.join));
  on("[data-open]","click",e=>openGame(e.currentTarget.dataset.open));
  on("#leave","click",leaveGame); on("#toLobby","click",leaveGame);
  on("#pickform","submit",e=>{ e.preventDefault(); submitPick(); });
  on("[data-slot]","click",e=>{ uiSel.slot=e.currentTarget.dataset.slot; render(); const i=$("#pick"); if(i) i.focus(); });
  on("[data-slot]","keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); uiSel.slot=e.currentTarget.dataset.slot; render(); } });
  on("[data-cap]","click",e=>submitCaptain(e.currentTarget.dataset.cap));
  on("[data-rv]","click",e=>review(e.currentTarget.dataset.rv));
  on("#runsim","click",runMatch);
  on("#skip","click",()=>{ if(!G?.match) return; const pb=getPB(); matchOffset = (G.match.kickoffAt + pb.total + 500) - Date.now(); frame(true); });
  on("#rematch","click",rematch);
}
