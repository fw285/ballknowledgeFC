<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Draft Night FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700&family=DotGothic16&display=swap">
<style>
/* Layout: sticker-album matchday program. Category card + timer up top, two team "album pages" (pitches with sticker cards) side by side, action panel between. */
:root{
  --paper:#e9edf4; --paper-2:#dde3ee; --card:#ffffff; --ink:#111a2f; --muted:#5a6479; --rule:#c6cedd;
  --cobalt:#1d3fc4; --cobalt-soft:#dfe5fb; --saffron:#f2b705; --saffron-ink:#5b4300; --red:#d22f2a; --red-soft:#fbe1df;
  --ok:#147a3e; --ok-soft:#dcf1e3; --warn:#a85c00;
  --pitch:#2d7a47; --pitch-2:#286f40; --chalk:rgba(255,255,255,.72);
  --shadow:0 1px 0 rgba(17,26,47,.06),0 6px 18px -10px rgba(17,26,47,.35);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --dot:"DotGothic16",ui-monospace,"Courier New",monospace;
  --teamA:var(--cobalt); --teamB:var(--red);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0c1222; --paper-2:#121a2e; --card:#18223b; --ink:#e7ebf5; --muted:#9aa5bd; --rule:#2a3655;
  --cobalt:#7d96ff; --cobalt-soft:#1c2a5c; --saffron:#f6c437; --saffron-ink:#2a1f00; --red:#ff6a63; --red-soft:#4a1d1c;
  --ok:#4fd185; --ok-soft:#163a26; --warn:#ffb050;
  --pitch:#1f5e37; --pitch-2:#1b5531; --chalk:rgba(255,255,255,.55);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c1222; --paper-2:#121a2e; --card:#18223b; --ink:#e7ebf5; --muted:#9aa5bd; --rule:#2a3655;
  --cobalt:#7d96ff; --cobalt-soft:#1c2a5c; --saffron:#f6c437; --saffron-ink:#2a1f00; --red:#ff6a63; --red-soft:#4a1d1c;
  --ok:#4fd185; --ok-soft:#163a26; --warn:#ffb050;
  --pitch:#1f5e37; --pitch-2:#1b5531; --chalk:rgba(255,255,255,.55);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding:0 16px 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px;border-bottom:2px solid var(--ink);margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:34px;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
.brand h1 span{color:var(--cobalt)}
.brand .tag{font-family:var(--dot);font-size:13px;color:var(--muted)}
.mast .who{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--paper-2);color:var(--ink)}
.pill.a{background:var(--cobalt-soft);color:var(--cobalt)}
.pill.b{background:var(--red-soft);color:var(--red)}
.pill.gold{background:var(--saffron);color:var(--saffron-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}

.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;letter-spacing:.02em}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.blue{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.gold{background:var(--saffron);border-color:var(--saffron);color:var(--saffron-ink)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{border:2px solid var(--rule);background:var(--card);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.field input:focus,.field select:focus{border-color:var(--cobalt);outline:none}
.notice{border:2px dashed var(--rule);border-radius:12px;padding:14px 16px;background:var(--card)}
.notice.bad{border-color:var(--red);background:var(--red-soft)}

/* Lobby */
.lobby{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:start}
@media (max-width:860px){.lobby{grid-template-columns:1fr}}
.hero{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:grid;gap:18px}
.hero h2{font-size:clamp(34px,6vw,58px);font-weight:900;text-transform:uppercase;line-height:.92}
.hero h2 em{font-style:normal;color:var(--red)}
.hero p{margin:0;max-width:60ch}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
@media (max-width:620px){.formrow{grid-template-columns:1fr}}
.list{display:grid;gap:10px}
.gamecard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);flex-wrap:wrap}
.gamecard .code{font-family:var(--dot);font-size:20px;letter-spacing:.12em}
.gamecard .vs{font-weight:700;min-width:0}
.rules{background:var(--card);border-radius:14px;padding:4px 16px;box-shadow:var(--shadow)}
.rules summary{cursor:pointer;font-weight:700;padding:12px 0}
.rules ul{margin:0 0 14px;padding-left:18px;display:grid;gap:5px}
.dicetable{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin-bottom:14px}

/* Dice (d10) */
.die{width:46px;height:46px;flex:none;display:block}
.die.sm{width:30px;height:30px}
.die .face{fill:var(--card);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.die .edge{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:.45}
.die text{font-family:var(--display),Impact,sans-serif;font-weight:900;font-size:17px;fill:var(--ink)}
.die.gold .face{fill:var(--saffron);stroke:var(--saffron-ink)}
.die.gold text{fill:var(--saffron-ink)} .die.gold .edge{stroke:var(--saffron-ink)}
.die.roll{animation:roll .7s cubic-bezier(.3,1.5,.6,1)}
@keyframes roll{0%{transform:rotate(-200deg) scale(.4)}100%{transform:none}}

/* Game header: category board */
.board{display:grid;grid-template-columns:1fr auto;gap:16px;background:var(--ink);color:var(--paper);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.board .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.board .cat{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.2vw,44px);line-height:1;margin:10px 0 6px;text-wrap:balance}
.board .hint{opacity:.75;font-size:14px;max-width:70ch}
.board .dicefx{display:flex;gap:12px;align-items:center;margin-top:12px;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;width:fit-content;max-width:100%}
.board .dicefx b{font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.board .die .face{fill:var(--paper);stroke:var(--paper)}
.board .die text{fill:var(--ink)} .board .die .edge{stroke:var(--ink)}
.board .die.gold .face{fill:var(--saffron);stroke:var(--saffron)}
.board .die.gold text{fill:var(--saffron-ink)}
.timer{width:118px;height:118px;position:relative;flex:none;align-self:center}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--dot);font-size:34px}
.timer .t small{display:block;font-size:11px;font-family:var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-top:-26px}
.timer.low .t{color:var(--saffron)}
@media (max-width:620px){.board{grid-template-columns:1fr}.timer{width:92px;height:92px;justify-self:end;margin-top:-6px}.timer .t{font-size:26px}}

/* Arena */
.arena{display:grid;grid-template-columns:1fr minmax(280px,360px) 1fr;gap:16px;margin-top:16px;align-items:start}
@media (max-width:1060px){.arena{grid-template-columns:1fr 1fr}.arena .panel{grid-column:1/-1;order:-1}}
@media (max-width:700px){.arena{grid-template-columns:1fr}}
.team{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:grid;gap:12px;min-width:0}
.team header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.team h3{font-size:26px;text-transform:uppercase;font-weight:900}
.team.a h3{color:var(--teamA)} .team.b h3{color:var(--teamB)}
.team .sub{font-size:12px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1.5px solid var(--rule);border-radius:8px;padding:4px 8px;max-width:100%;min-width:0;overflow-wrap:anywhere}
.chip b{font-weight:700}
.chip.none{border-style:dashed;color:var(--muted)}

/* Mini pitch with stickers */
.pitchbox{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(0deg,var(--pitch) 0 10%,var(--pitch-2) 10% 20%)}
.pitchbox svg.lines{position:absolute;inset:0;width:100%;height:100%}
.sticker{position:absolute;transform:translate(-50%,-50%);width:23%;max-width:96px;min-height:48px;background:var(--card);color:var(--ink);border-radius:7px;padding:4px 4px 3px;text-align:center;box-shadow:0 3px 8px -3px rgba(0,0,0,.6);display:grid;gap:1px;line-height:1.05}
.sticker .pos{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.sticker .nm{font-family:var(--display);font-weight:800;font-size:15px;text-transform:uppercase;overflow-wrap:anywhere}
.sticker .nat{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sticker .rt{position:absolute;top:-7px;right:-6px;background:var(--ink);color:var(--paper);font-family:var(--dot);font-size:11px;border-radius:6px;padding:1px 4px}
.sticker.open{background:rgba(255,255,255,.12);border:2px dashed var(--chalk);color:#fff;box-shadow:none}
.sticker.open .pos{color:#fff}
.sticker.empty{background:rgba(0,0,0,.28);border:2px dashed var(--red);color:#fff;box-shadow:none}
.sticker.empty .pos,.sticker.empty .nat{color:#ffd2cf}
.sticker.gold{background:linear-gradient(135deg,#fff4c2 0%,#f2b705 35%,#fff3b8 55%,#d99a00 80%,#fff1a8 100%);color:#2a1f00;background-size:200% 200%;animation:foil 5s ease-in-out infinite}
.sticker.gold .pos,.sticker.gold .nat{color:#5b4300}
@keyframes foil{50%{background-position:100% 100%}}
.sticker.meme{background:repeating-linear-gradient(45deg,var(--card) 0 6px,var(--paper-2) 6px 12px)}
.sticker .tagm{font-size:8px;font-weight:800;letter-spacing:.12em;color:var(--red)}
.sticker.cap::after{content:"C";position:absolute;top:-7px;left:-6px;background:var(--saffron);color:var(--saffron-ink);font-weight:800;font-size:10px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center}
.sticker.pickable{cursor:pointer;outline:2px solid var(--saffron);outline-offset:1px}
.sticker.pickable.sel{background:var(--saffron);color:var(--saffron-ink);border-style:solid}
.bench{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bench .sticker{position:relative;transform:none;width:auto;max-width:none;left:auto;top:auto}
.bench .sticker.open{background:var(--paper-2);border-color:var(--rule);color:var(--muted)}
.bench .sticker.open .pos{color:var(--muted)}
.chem{font-size:12px;color:var(--muted)}

/* Action panel */
.panel{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:grid;gap:14px;border-top:6px solid var(--ink)}
.panel.mine{border-top-color:var(--saffron)}
.panel h4{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:0;font-weight:800}
.ruling{border-radius:12px;padding:12px;display:grid;gap:6px}
.ruling.yes{background:var(--ok-soft)} .ruling.no{background:var(--red-soft)} .ruling.unk{background:var(--paper-2)}
.ruling .verdict{font-family:var(--display);font-size:26px;font-weight:900;text-transform:uppercase}
.ruling.yes .verdict{color:var(--ok)} .ruling.no .verdict{color:var(--red)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.spin{width:22px;height:22px;border:3px solid var(--rule);border-top-color:var(--cobalt);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.log{max-height:260px;overflow:auto;display:grid;gap:6px;font-size:13px;padding-right:4px}
.log div{border-left:3px solid var(--rule);padding-left:8px}
.log div.a{border-color:var(--teamA)} .log div.b{border-color:var(--teamB)}
.slotgrid{display:flex;flex-wrap:wrap;gap:6px}
.slotbtn{border:2px solid var(--rule);background:var(--paper);border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px}
.slotbtn.sel{background:var(--saffron);border-color:var(--saffron);color:var(--saffron-ink)}

/* Match */
.matchtop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--ink);color:var(--paper);border-radius:16px;padding:12px 16px}
.matchtop .tn{font-family:var(--display);font-weight:900;font-size:clamp(18px,3vw,30px);text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.matchtop .tn.r{text-align:right}
.score{font-family:var(--dot);font-size:clamp(34px,6vw,54px);display:flex;gap:10px;align-items:center;justify-content:center}
.score .clk{font-size:14px;background:var(--saffron);color:var(--saffron-ink);border-radius:6px;padding:2px 8px}
.pitchwrap{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.pitchwrap svg{display:block;width:100%;height:auto}
.goalbanner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.goalbanner div{font-family:var(--display);font-weight:900;font-size:clamp(48px,11vw,130px);color:#fff;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 6px 0 rgba(0,0,0,.35);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.goalbanner div small{display:block;font-size:.26em;text-align:center;letter-spacing:.08em}
.goalbanner .bn{font-size:clamp(30px,6vw,70px)}
.goalbanner .redcard{display:inline-block;width:.5em;height:.7em;background:#e0261f;border-radius:4px;margin-right:.25em;vertical-align:-.05em;box-shadow:0 3px 0 rgba(0,0,0,.35);transform:rotate(-8deg)}
.subboard{display:grid;gap:8px;background:#111;border:3px solid #333;border-radius:10px;padding:10px 14px;font-family:var(--dot);text-shadow:none;text-transform:none;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.goalbanner .subboard{font-size:clamp(14px,2.4vw,22px);font-weight:700;letter-spacing:.02em}
.subboard .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.subboard .tm{color:#fff;border-radius:6px;padding:2px 8px;font-family:var(--sans,inherit);font-size:.75em}
.goalbanner .subboard div{font-size:inherit;text-transform:none;text-shadow:none;animation:none;color:inherit;letter-spacing:inherit}
.subboard .in{color:#5ee37a}.subboard .out{color:#ff6a63}
.feed .ev.sub .m{color:var(--cobalt)}
@keyframes pop{from{transform:scale(.3) rotate(-6deg);opacity:0}}
.matchgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px;align-items:start}
@media (max-width:860px){.matchgrid{grid-template-columns:1fr}}
.feed{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:grid;gap:8px;max-height:460px;overflow:auto}
.feed .ev{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:14px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.feed .ev .m{font-family:var(--dot);color:var(--muted)}
.feed .ev.goal{background:var(--saffron);color:var(--saffron-ink);border-radius:10px;padding:8px;border:0}
.feed .ev.goal .m{color:var(--saffron-ink)}
.feed .ev.red .m{color:var(--red)}
.dossier{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:grid;gap:10px}
.dossier h4{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:0}
.dossier p{margin:0;max-width:68ch}
.rolls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.roll{background:var(--paper);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:13px}
.statt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.statt td{padding:6px 4px;border-bottom:1px solid var(--rule);text-align:center}
.statt td:first-child,.statt td:last-child{font-weight:700;width:30%}
.pens{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pens i{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid var(--ink)}
.pens i.y{background:var(--ok);border-color:var(--ok)} .pens i.n{background:var(--red);border-color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.poss{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--rule)}
.poss i{display:block;height:100%;transition:width .6s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
</style>
</head>
<body>

<div class="wrap">
  <div class="mast">
    <div class="brand"><h1>Draft Night <span>FC</span></h1><span class="tag">1v1 · d10 · 60s per pick</span></div>
    <div class="who" id="who"></div>
  </div>
  <main id="view"></main>
</div>

<script type="module">
/* ============================================================
   SETUP: paste your Firebase web config here (see README.md, step 1)
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA3qR-otLJXhxYE51LLQK_HwQHL6bpzKOQ",
  authDomain: "draft-night-fc.firebaseapp.com",
  projectId: "draft-night-fc",
  storageBucket: "draft-night-fc.firebasestorage.app",
  messagingSenderId: "342009120885",
  appId: "1:342009120885:web:6f2da63f4fe224ee2b903c",
  measurementId: "G-8C95S137BZ"
};
const API_URL = "/api/claude";

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, doc as fdoc, getDoc, setDoc, onSnapshot as fsnap, collection as fcol, query as fquery, orderBy as forder, limit as flimit, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Firestore adapter with the same shape the game already uses */
function makeDb(){
  const app = initializeApp(FIREBASE_CONFIG);
  const fs = initializeFirestore(app, {ignoreUndefinedProperties:true});
  const wrap = s => ({id:s.id, exists:s.exists(), data:()=>s.data()});
  const docRef = path => { const r = fdoc(fs, path); return {
    id:r.id, path,
    get: async () => wrap(await getDoc(r)),
    set: d => setDoc(r, JSON.parse(JSON.stringify(d))),
    onSnapshot: (next, err) => fsnap(r, s => next(wrap(s)), err),
    acquire: async ({holder, ttlMs=30000}) => {
      const lr = fdoc(fs, "locks/" + path.replace(/\//g, "_"));
      return runTransaction(fs, async tx => {
        const s = await tx.get(lr), now = Date.now();
        if (s.exists() && s.data().expiresAt > now && s.data().holder !== holder) return {acquired:false};
        tx.set(lr, {holder, expiresAt: now + ttlMs});
        return {acquired:true};
      });
    }
  };};
  const colRef = (path, q=[]) => ({
    path,
    doc: id => docRef(path + "/" + id),
    orderBy: (f, d) => colRef(path, [...q, forder(f, d)]),
    limit: n => colRef(path, [...q, flimit(n)]),

let writeChain = Promise.resolve();

function commit(mut){
  const job = writeChain.then(async ()=>{
    if(!gameRef) return false;
    const snap = await gameRef.get();
    if(!snap.exists) return false;
    const st = structuredClone(snap.data());
    const prevPhase = st.phase;
    if(mut(st)===false) return false;
    st.seq = (st.seq||0)+1; st.updatedAt = Date.now();
    try { await gameRef.set(st); }
    catch(e){ if(e && e.code==="invalid_argument"){ canWrite=false; render(); } console.warn(e); return false; }
    if(prevPhase!==st.phase || st.seq<=2) syncLobby(st);
    return true;
  }).catch(e=>{ console.warn(e); return false; });
  writeChain = job.then(()=>{},()=>{});
  return job;
}
function syncLobby(st){

  db.collection("lobby").doc(st.id).set({id:st.id, a:st.players.A?.team||"", b:st.players.B?.team||"", phase:st.phase, result, createdAt:st.createdAt, updatedAt:Date.now()}).catch(()=>{});
}

function emptySquad(form){ const s={formation:form, slots:{}, subs:[null,null,null], manager:null, stadium:null, aura:null, captain:null, vetoUsed:false, rerollUsed:false}; slotsOf(form).forEach(x=>s.slots[x.k]=null); return s; }
function drawCat(st, bank){
  st.used = st.used||{};

  let pool = list.map((c,i)=>i).filter(i=>!(st.used[bank]||[]).includes(i));
  if(!pool.length){ pool = list.map((c,i)=>i); st.used[bank]=[]; }
  const i = rand(pool); st.used[bank]=[...(st.used[bank]||[]), i];
  return {...list[i], bank};
}
function catFits(c, dice){ return !(dice===1&&c.cur) && !(dice===3&&c.old) && !(dice===4&&c.nat); }
function drawPlayerCat(st, dice){
  if(dice===9) return {t:"Wildcard: any player you like", h:"No category this round. The usual rules still apply.", bank:"player", wild:true, id:"wild"};
  st.usedIds = st.usedIds||[];
  const used = new Set(st.usedIds);
  const ok = c => !used.has(c.id) && catFits(c, dice);
  let buckets = [[SPECIAL_CATS.filter(ok),.52],[PAIR_CATS.filter(ok),.16],[CLUB_CATS.filter(ok),.16],[NAT_CATS.filter(ok),.16]].filter(b=>b[0].length);
  if(!buckets.length){ st.usedIds=[]; buckets=[[SPECIAL_CATS.filter(c=>catFits(c,dice)),1]]; }
  let r = Math.random()*buckets.reduce((s,b)=>s+b[1],0), pool=buckets[0][0];
  for(const b of buckets){ r-=b[1]; if(r<=0){ pool=b[0]; break; } }
  const c = rand(pool); st.usedIds.push(c.id);
  return {...c, bank:"player"};
}
function startDraft(st){
  st.phase="draft"; st.seq0 = Date.now(); st.coin = Math.random()<.5?"A":"B"; st.stage=-1; st.banned=[]; st.refOk = st.refOk||{};
  st.squads = {A:emptySquad(st.players.A.formation), B:emptySquad(st.players.B.formation)};
  pushLog(st, `Coin toss: ${st.players[st.coin].team} picks first.`);
  nextRound(st);
}
function bonusTurns(st){
  const turns=[]; const used=new Set();
  for(const p of ["A","B"]) for(const sl of slotsOf(st.squads[p].formation)){
    const v = st.squads[p].slots[sl.k];
    if(v && v.empty && !v.bonusTried){ let place, n=0; do{ place=rand(NICHE_PLACES); n++; }while(used.has(place) && n<40); used.add(place);
      turns.push({p, slot:sl.k, cat:{t:`Has played for a club in ${place}`, h:`Niche bonus round for your empty ${sl.label.toLowerCase()} slot.`, bank:"bonus"}}); }
  }

}
function nextRound(st){
  st.stage++;
  while(st.stage<STAGES.length){
    const kind = STAGES[st.stage];
    const base = st.stage%2===0 ? st.coin : other(st.coin);
    if(kind==="bonus"){
      const turns = bonusTurns(st);
      if(!turns.length){ st.stage++; continue; }
      st.round = {stage:st.stage, kind, dice:null, cat:null, turns, ti:0, attempt:0, step:"pick", pending:null};
    } else {
      const dice = (kind==="starter"||kind==="sub") ? 1+Math.floor(Math.random()*10) : null;
      let first = base; if(dice===2) first = other(first);
      const cat = kind==="captain" ? {t:"Name your captain",h:"Pick one of your starters. The captain takes your first penalty.",bank:"captain"}
        : (kind==="starter"||kind==="sub") ? drawPlayerCat(st, dice) : drawCat(st, kind);
      st.round = {stage:st.stage, kind, dice, cat, turns:[{p:first},{p:other(first)}], ti:0, attempt:0, step:"pick", pending:null};
    }
    st.round.deadline = Date.now()+pickMs(st.round);
    st.round.key = `${st.stage}.0.0`;
    return;
  }
  st.phase="prematch"; st.round=null;
  pushLog(st, "The draft is complete. Time to play.");
}
function turnCat(r){ const t=r.turns[r.ti]; return t.cat||r.cat; }
function canReroll(r){ return r && r.kind!=="captain" && !(r.dice===9 && (r.kind==="starter"||r.kind==="sub")); }
function advanceTurn(st){
  const r=st.round; r.ti++;
  if(r.ti>=r.turns.length){ nextRound(st); return; }
  r.step="pick"; r.pending=null; r.attempt=0; r.deadline=Date.now()+pickMs(r); r.key=`${r.stage}.${r.ti}.0`;
}
function repick(st, msg){ const r=st.round; r.attempt++; r.step="pick"; r.pending=null; r.deadline=Date.now()+pickMs(r); r.key=`${r.stage}.${r.ti}.${r.attempt}`; if(msg) pushLog(st,msg,r.turns[r.ti].p); }
function openStarterSlots(sq){ return slotsOf(sq.formation).filter(s=>sq.slots[s.k]===null); }
function slotInfo(sq, key){ return slotsOf(sq.formation).find(s=>s.k===key); }
function allDrafted(st){
  const out=[];
  for(const p of ["A","B"]){ const sq=st.squads?.[p]; if(!sq) continue;
    Object.values(sq.slots).forEach(v=>{ if(v && v.name) out.push(v.name); });
    sq.subs.forEach(v=>{ if(v && v.name) out.push(v.name); });
    if(sq.manager?.name) out.push(sq.manager.name); if(sq.stadium?.name) out.push(sq.stadium.name); if(sq.aura?.name) out.push(sq.aura.name);
  }
  return out.concat(st.banned||[]);
}
function squadPlayers(sq){ return [...Object.values(sq.slots), ...sq.subs].filter(v=>v && v.name && !v.isMeme); }
function defaultAttrs(g){ const G2=GROUP(g); return {rating:75, attack:G2==="FWD"?78:G2==="MID"?68:G2==="DEF"?45:20, defense:G2==="DEF"?78:G2==="MID"?65:G2==="GK"?78:35, pace:70}; }
function memePlayer(st, g){
  const used = new Set(allDrafted(st).map(norm));
  const pool = (MEMES[g]||MEMES.CM).filter(n=>!used.has(norm(n)));
  const name = pool.length?rand(pool):rand(MEMES[g]||MEMES.CM);
  const G2=GROUP(g);
  return {name, isMeme:true, nationality:"", nationalTeam:"", clubs:[], retired:true, rating:58, attack:G2==="FWD"?60:G2==="MID"?52:30, defense:G2==="DEF"?58:G2==="GK"?56:40, pace:55, fiery:false};
}
function placeResult(st, p, turn, kind, final, ruling, pending){
  const sq = st.squads[p], team = st.players[p].team, r=st.round;
  const ai = !!(ruling && ruling.ai && ruling.rating);
  if(kind==="starter"||kind==="sub"||kind==="bonus"){
    const g = kind==="sub" ? "CM" : slotInfo(sq, pending.slot).g;
    if(final){
      const attrs = ai ? {rating:ruling.rating, attack:ruling.attack, defense:ruling.defense, pace:ruling.pace} : defaultAttrs(g);
      const pl = {name: ruling?.canonicalName || pending.name, nationality: ruling?.nationality||"", nationalTeam: ruling?.nationalTeam||ruling?.nationality||"", clubs: ruling?.clubs||[], positions: ruling?.positions||[], retired: !!ruling?.retired, fiery: !!ruling?.fiery, golden: r.dice===6, noAI: !ai, ...attrs};
      if(kind==="sub") sq.subs[sq.subs.indexOf(null)] = pl; else sq.slots[pending.slot] = pl;
      pushLog(st, `${team}: ${pl.name}${kind==="sub"?" to the bench":" at "+pending.slot}${pl.golden?" (golden)":""}.`, p);
    } else {
      if(kind==="sub"){ sq.subs[sq.subs.indexOf(null)] = {empty:true, tried:pending.name}; }
      else sq.slots[pending.slot] = {empty:true, tried:pending.name, bonusTried: kind==="bonus"};
      pushLog(st, `${team}: ${pending.name} ruled out. ${kind==="sub"?"Bench spot":pending.slot} left empty.`, p);
    }
  } else if(kind==="manager"){
    sq.manager = final ? {name:ruling?.canonicalName||pending.name, rating:ruling?.rating||78, style:ruling?.style||"pragmatic", clubs:ruling?.clubs||[]} : {none:true, tried:pending.name};
    pushLog(st, final?`${team} appoint ${sq.manager.name}.`:`${team}: ${pending.name} ruled out. No manager.`, p);
  } else if(kind==="stadium"){
    sq.stadium = final ? {name:ruling?.canonicalName||pending.name, atmosphere:ruling?.atmosphere||7, altitudeMeters:ruling?.altitudeMeters||0, city:ruling?.city||""} : {none:true, tried:pending.name};
    pushLog(st, final?`${team} choose ${sq.stadium.name}.`:`${team}: ${pending.name} ruled out. No home ground.`, p);
  } else if(kind==="aura"){
    const trig = ruling && AURA_TRIGGERS[ruling.trigger] ? ruling.trigger : rand(Object.keys(AURA_TRIGGERS));
    sq.aura = final ? {name:ruling?.canonicalName||pending.name, trigger:trig, effect: ruling?.effectText || AURA_TRIGGERS[trig]} : {none:true, tried:pending.name};
    pushLog(st, final?`${team} take the aura: ${sq.aura.name}.`:`${team}: aura ruled out.`, p);
  }
}
// Who runs Claude for a pick: the picker if their device can, otherwise the opponent.
function chooseJudge(st, prefer, exclude){
  const ok = st.refOk||{};
  for(const s of [prefer, other(prefer)]) if(s!==exclude && ok[s]!==false) return s;
  return null;
}
const PERMANENT = new Set(["unavailable","not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"]);

/* Mutators */
const M = {
  beginJudging(key, seat, name, slot){ return st=>{
    const r=st.round; if(!r||r.key!==key||r.step!=="pick"||r.turns[r.ti].p!==seat) return false;
    const judge = chooseJudge(st, seat, null);
    r.pending={p:seat,name,slot,at:Date.now(),judge};
    if(!judge){ r.pending.ruling=null; r.step="review"; r.reviewDeadline=Date.now()+REVIEW_MS; }
    else r.step="judging";
  };},
  handoff(key, failedSeat, code, msg){ return st=>{
    const r=st.round; if(!r||r.key!==key||r.step!=="judging") return false;
    r.pending.err = (code||"") + (msg ? ": "+String(msg).slice(0,200) : "");
    st.refOk = st.refOk||{};
    if(PERMANENT.has(code)) st.refOk[failedSeat]=false;
    const tried = r.pending.tried||[]; tried.push(failedSeat); r.pending.tried=tried;
    const next = ["A","B"].find(s=>!tried.includes(s) && st.refOk[s]!==false);
    if(next){ r.pending.judge=next; r.pending.at=Date.now(); pushLog(st, `Ref handed to ${st.players[next].team}'s device.`); }
    else { r.pending.ruling=null; r.step="review"; r.reviewDeadline=Date.now()+REVIEW_MS; }
  };},
  setRuling(key, ruling, bySeat){ return st=>{
    const r=st.round; if(!r||r.key!==key||r.step!=="judging") return false;
    st.refOk = st.refOk||{}; if(bySeat) st.refOk[bySeat]=true;
    const p=r.pending.p, kind=r.kind, team=st.players[p].team;
    if(ruling && ruling.ai && ruling.duplicate){ repick(st, `${team}: ${r.pending.name} is already taken or banned. Free re-pick.`); return; }
    if(ruling && ruling.ai && ruling.recognized!==false && ruling.fitsCategory && ruling.fitsDice && ruling.fitsPosition===false && (kind==="starter"||kind==="bonus")){
      repick(st, `${team}: ${ruling.canonicalName||r.pending.name} fits the category but not the ${r.pending.slot} slot. Free re-pick.`); return; }
    r.pending.ruling = ruling; r.step="review"; r.reviewDeadline=Date.now()+REVIEW_MS;
  };},
  resolve(key, action, bySeat){ return st=>{

    }

  };},
  timeout(key){ return st=>{
    const r=st.round; if(!r||r.key!==key||r.step!=="pick"||Date.now()<r.deadline) return false;
    const turn=r.turns[r.ti], p=turn.p, sq=st.squads[p], team=st.players[p].team;

  };},
  captain(key, seat, name){ return st=>{

};

Rules:

async function runJudge(){
  const r=G?.round; if(!r||r.step!=="judging"||r.pending?.judge!==mySeat) return;
  const ik = r.key+":"+(r.pending.tried||[]).length;
  if(inflight[ik]) return; inflight[ik]=1;
  const key=r.key, pend=r.pending;
  const ruling = await judge(G, pend.p, pend.name, pend.slot);
  if(ruling && ruling.fail){ await commit(M.handoff(key, mySeat, ruling.fail, ruling.msg)); return; }

/* Fill in ratings for any player Claude never rated (one batched call) */

/* ============================================================
   Chemistry
   ============================================================ */
function chemLinks(sq){
  const xi = slotsOf(sq.formation).map(s=>({s, p:sq.slots[s.k]})).filter(o=>o.p && o.p.name && !o.p.isMeme);
  const links=[];
  for(let i=0;i<xi.length;i++) for(let j=i+1;j<xi.length;j++){
    const a=xi[i].p, b=xi[j].p; const why=[];
    const ca=(a.clubs||[]).map(norm), cb=(b.clubs||[]).map(norm);
    const shared = ca.filter(c=>c && cb.includes(c)); if(shared.length) why.push((a.clubs||[])[ca.indexOf(shared[0])]);
    if(a.nationalTeam && norm(a.nationalTeam)===norm(b.nationalTeam)) why.push(a.nationalTeam);
    if(why.length) links.push({a:xi[i].s, b:xi[j].s, why});
  }
  return links;
}
/* ============================================================
   Match simulation (seeded)

  for(const p of ["A","B"]){
    const sq=st.squads[p];
    const xi = slotsOf(sq.formation).map(s=>{ const v=sq.slots[s.k]; return (v&&v.name)?{...v, slot:s.k, g:s.g, x:s.x, y:s.y}:null; });
    const bench = sq.subs.filter(v=>v&&v.name).map(v=>({...v}));
    T[p] = {p, xi, bench, team:st.players[p].team, sq};
  }
  // injury roulette
  for(const p of ["A","B"]){
    const on = T[p].xi.filter(Boolean); if(!on.length) continue;
    const victim = pickR(on), roll=d6();
    rolls["injury"+p] = {who:victim.name, roll};
    if(roll===1){
      const idx=T[p].xi.indexOf(victim);
      const repl = T[p].bench.shift();
      T[p].xi[idx] = repl ? {...repl, slot:victim.slot, g:victim.g, x:victim.x, y:victim.y} : null;
      rolls["injury"+p].replacedBy = repl ? repl.name : null;
    }
  }
  // venue, weather, referee
  const vRoll=d6(); let host = vRoll<=3?"A":"B";
  if(!T[host].sq.stadium || T[host].sq.stadium.none) host = other(host);
  const stadium = (T[host].sq.stadium && !T[host].sq.stadium.none) ? T[host].sq.stadium : null;
  const hostTeam = stadium ? host : null;
  rolls.venue={roll:vRoll, host:hostTeam, name: stadium?stadium.name:"A neutral ground"};
  const wR=d6(); const weather = ["Clear","Light rain","Heavy rain","Strong wind","Cold and clear","Fog"][wR-1]; rolls.weather={roll:wR, name:weather};
  const rR=d6(); const refType = rR<=2?"Strict":rR<=4?"Average":"Lenient"; rolls.ref={roll:rR, name:refType};

  const strength = (t)=>{
    let aw=0,as=0,dw=0,ds=0,mw=0,ms=0, men=0;
    t.xi.forEach((pl,i)=>{
      const g = pl? GROUP(pl.g) : null; const slotG = GROUP(slotsOf(t.sq.formation)[i].g);
      const att = pl?pl.attack:25, def = pl?pl.defense:25, rat = pl?pl.rating:30;
      const G2 = g||slotG;

      const wd = G2==="GK"?1.3:G2==="DEF"?1:G2==="MID"?.45:.1; dw+=wd*(G2==="GK"?rat:def); ds+=wd;

  const links = {A:chemLinks(st.squads.A).length, B:chemLinks(st.squads.B).length};
  const mgr = p => { const m=T[p].sq.manager; return m && !m.none ? 1+(clamp(m.rating||75,40,99)-75)/350 : .93; };
  const score={A:0,B:0}, stats={A:{shots:0,xg:0,onT:0},B:{shots:0,xg:0,onT:0}}, events=[], reds={A:0,B:0};
  const auraState={A:{used:false,momentum:-1},B:{used:false,momentum:-1}};
  const aura = p => T[p].sq.aura && !T[p].sq.aura.none ? T[p].sq.aura : null;
  const gk = p => T[p].xi.find(x=>x&&x.g==="GK");
  const snap1 = x => x?{name:x.name,slot:x.slot,x:x.x,y:x.y,g:x.g,pace:x.pace||70}:null;

  const keeperMiracle = {A:false,B:false};
  const segs=[[0,15],[15,30],[30,45],[45,60],[60,75],[75,90]];
  const stoppage = 1+Math.floor(R()*5);

  for(const p of ["A","B"]){ const a=aura(p); if(a && a.trigger==="early_storm"){ events.push({m:1,type:"aura",t:p,who:a.name}); auraState[p].used=true; } }
  for(let si=0; si<segs.length; si++){
    const [a,b]=segs[si]; const end = si===5 ? 90+stoppage : b;
    if(a===45){

    }
    if(a===60 || a===75){

      for(const p of ["A","B"]){
        if(!T[p].bench.length) continue;
        const outfield = T[p].xi.map((x,i)=>({x,i})).filter(o=>o.x && o.x.g!=="GK" && !o.x.sent);
        if(!outfield.length) continue;
        outfield.sort((u,v)=>u.x.rating-v.x.rating);
        const o=outfield[0]; const inn=T[p].bench.shift();
        T[p].xi[o.i] = {...inn, slot:o.x.slot, g:o.x.g, x:o.x.x, y:o.x.y};
        events.push({m:a, type:"sub", t:p, who:inn.name, out:o.x.name, slot:o.x.slot, pace:inn.pace||70});
      }
    }
    if(a===75){ for(const p of ["A","B"]){ const au=aura(p); if(au && !auraState[p].used && au.trigger==="comeback_late" && score[p]<score[other(p)]){ auraState[p].used=true; auraState[p].late=true; events.push({m:76,type:"aura",t:p,who:au.name}); } } }
    for(const p of ["A","B"]){
      const o=other(p);
      // red cards
      const fiery = T[p].xi.filter(x=>x&&x.fiery&&!x.sent).length;
      let redP = (refType==="Strict"?.02:refType==="Average"?.008:.003)*(1+fiery*.35);
      const oa=aura(o); if(oa && oa.trigger==="chaos") redP*=2.2;

          const fierce=cands.filter(x=>x.fiery); const v=pickR(fierce.length?fierce:cands); v.sent=true; reds[p]++;
          events.push({m:a+1+Math.floor(R()*(end-a-1)), type:"red", t:p, who:v.name, slot:v.slot}); }
      }
    }
    for(const p of ["A","B"]){
      const o=other(p); const sp=strength(T[p]), so=strength(T[o]);
      const ratio = sp.att/Math.max(30,so.def);
      let lam = 1.42*Math.pow(ratio,2.1)*(1+Math.min(links[p],14)*.007)*mgr(p)*(1+(sp.mid-so.mid)/400);
      const menP = T[p].xi.filter(x=>x&&!x.sent).length, menO=T[o].xi.filter(x=>x&&!x.sent).length;

      const au=aura(p);

      if(au && auraState[p].late && a>=75) lam*=1.7;
      if(au && au.trigger==="early_storm" && a===0) lam*=1.9;
      if(au && au.trigger==="momentum_after_goal" && auraState[p].momentum===si) lam*=1.6;
      if(au && au.trigger==="opponent_collapse" && auraState[p].collapse===si) lam*=1.9;

      const evs=[];

        if(!on.length) continue;
        const w = on.map(x=>{ const G2=GROUP(x.g); return (G2==="FWD"?5:G2==="MID"?2:.6)*Math.pow(x.attack/70,2); });
        let rr=R()*w.reduce((s,v)=>s+v,0), shooter=on[0]; for(let i=0;i<on.length;i++){ rr-=w[i]; if(rr<=0){shooter=on[i];break;} }

}

/* Templated commentary (fallback when Claude isn't available) */
function templLine(ev, st){
  const tn = p => st.players[p].team;
  switch(ev.type){
    case "ht": return "Half-time.";
    case "ft": return "Full-time.";
    case "sub": return `Substitution: ${ev.who} on for ${ev.out}.`;
    case "red": return `Red card! ${ev.who} is sent off and they're down to ten.`;
    case "aura": return `Aura: ${ev.who}. Something shifts for ${tn(ev.t)}.`;
    case "pen": return ev.outcome==="goal" ? `Penalty to ${tn(ev.t)}. ${ev.who} sends the keeper the wrong way.` : `Penalty to ${tn(ev.t)}... ${ev.who} misses!`;
    case "chance":
      if(ev.outcome==="goal") return ev.xg<.1 ? `Out of nothing! ${ev.who} scores a worldie for ${tn(ev.t)}.` : ev.xg>.4 ? `${ev.who} can't miss, and doesn't. Goal for ${tn(ev.t)}.` : `GOAL! ${ev.who} finishes it for ${tn(ev.t)}.`;
      if(ev.outcome==="miracle") return `Huge chance for ${ev.who}... and a miracle save from ${ev.keeper||"the keeper"}!`;
      if(ev.outcome==="saved") return `${ev.who} forces a save${ev.keeper?" from "+ev.keeper:""}.`;
      if(ev.outcome==="wide") return `${ev.who} drags it wide.`;
      return `${ev.who}'s shot is blocked.`;
  }
  return "";
}

    startDraft(st);
  });
}

// Which seat runs the match + commentary: one whose device can reach Claude.
function simRunner(){ const ok=G.refOk||{}; if(ok.A!==false) return "A"; if(ok.B!==false) return "B"; return "A"; }

function afterState(prev){
  if(!G) return;
  if(G.phase==="draft" && G.round?.step==="judging" && G.round.pending?.judge===mySeat) runJudge();
  if(G.phase==="prematch" && mySeat){
    const delay = mySeat===simRunner() ? 1200 : 15000;
    const k="sim"+G.id+G.seq; if(!fired[k]){ fired[k]=1; setTimeout(()=>{ if(G && G.phase==="prematch") runMatch(); }, delay); }
  }
  if(G.phase==="match" && prev?.phase!=="match"){ matchOffset=0; PB=null; }
  if(G.phase==="match" && !raf) startPlayback();
}

function tick(){
  updateTimerUI();
  if(!G || !mySeat || !canWrite) return;
  const now=Date.now();
  if(G.phase==="draft" && G.round){
    const r=G.round, turn=r.turns[r.ti], mine=turn.p===mySeat;
    if(r.step==="pick" && now > r.deadline + (mine?300:5000)){ const k="to"+r.key; if(!fired[k]){ fired[k]=1; commit(M.timeout(r.key)); } }
    if(r.step==="review" && now > r.reviewDeadline + (mine?5000:300)){ const k="rv"+r.key; if(!fired[k]){ fired[k]=1; commit(M.resolve(r.key,"accept",other(turn.p))); } }
    if(r.step==="judging" && r.pending && now - r.pending.at > 75000){ const k="un"+r.key+(r.pending.tried||[]).length; if(!fired[k]){ fired[k]=1; commit(M.handoff(r.key, r.pending.judge, "timeout")); } }
  }
  if(G.phase==="report" && G.reportStartedAt && now-G.reportStartedAt>150000){ const k="rp"+G.reportStartedAt; if(!fired[k]){ fired[k]=1; commit(st=>{ if(st.phase!=="report"||Date.now()-st.reportStartedAt<150000) return false; st.phase="prematch"; pushLog(st,"The match host dropped out. Restarting kick-off."); }); } }
}

async function submitPick(){
  if(!G||!G.round) return;
  const r=G.round, turn=r.turns[r.ti]; if(turn.p!==mySeat||r.step!=="pick") return;
  const name = ($("#pick")?.value||"").trim();
  const err = $("#pickerr"); const say = t=>{ if(err) err.textContent=t; };
  if(!name){ say("Type a name first."); return; }
  let slot = null;
  if(r.kind==="starter"){ slot=uiSel.slot; if(!slot){ say("Choose which slot he plays in."); return; } if(G.squads[mySeat].slots[slot]!==null){ say("That slot is already filled. Choose an open one."); return; } }
  if(r.kind==="bonus") slot=turn.slot;
  await commit(M.beginJudging(r.key, mySeat, name, slot));
}
async function submitCaptain(name){ if(!G?.round) return; await commit(M.captain(G.round.key, mySeat, name)); }
async function review(action){ if(!G?.round) return; await commit(M.resolve(G.round.key, action, mySeat)); }

async function runMatch(){
  if(!G || G.phase!=="prematch") return;
  try{ const l = await gameRef.acquire({holder:me.id, ttlMs:180000}); if(!l.acquired) return; }catch(e){}
  const fresh = structuredClone((await gameRef.get()).data()); if(!fresh || fresh.phase!=="prematch") return;
  const ok0 = await commit(st=>{ if(st.phase!=="prematch") return false; st.phase="report"; st.reportStartedAt=Date.now(); pushLog(st,"Checking ratings and writing the scouting dossier."); });
  if(!ok0) return;
  const fixed = await backfillRatings(fresh);
  const sim = simulate(fresh, Math.floor(Math.random()*2**31));
  const report = await writeReport(fresh, sim);
  await commit(st=>{ if(st.phase!=="report") return false;
    if(fixed) st.squads = fresh.squads;
    st.match = {...sim, report}; st.phase="match"; st.match.kickoffAt=Date.now()+(report?20000:6000); });
}
async function rematch(){
  await commit(st=>{
    if(st.phase!=="match" && st.phase!=="done") return false;
    const keep={A:st.players.A, B:st.players.B};
    st.history=[...(st.history||[]), {final:st.match?.final, pens:st.match?.pens?{A:st.match.pens.A,B:st.match.pens.B}:null, winner:st.match?.winner}].slice(-10);
    delete st.match; st.usedIds=[]; st.used={}; st.players=keep; st.log=[]; pushLog(st,"Rematch! New draft, new dice.");
    startDraft(st);
  });
  matchOffset=0; PB=null; if(raf) cancelAnimationFrame(raf); raf=null;
}

function restoreInputs(c){ for(const id in c.o){ const el=document.getElementById(id); if(el && el.type!=="hidden") el.value=c.o[id]; } if(c.focus){ const el=document.getElementById(c.focus); if(el){ el.focus(); if(c.sel&&el.setSelectionRange) try{el.setSelectionRange(c.sel[0],c.sel[1]);}catch(e){} } } }

  const r=G.round; const now=Date.now();
  let left, total, label;
  if(r.step==="pick"){ left=r.deadline-now; total=pickMs(r); label="pick"; }
  else if(r.step==="review"){ left=r.reviewDeadline-now; total=REVIEW_MS; label="review"; }
  else { left=total=1; label="ref"; }
  left=clamp(left,0,total);
  const s = r.step==="judging" ? "··" : Math.ceil(left/1000);
  $("#tnum").textContent=s; $("#tlabel").textContent=label;
  $("#tarc").setAttribute("stroke-dashoffset", String(276.5*(1-left/total)));
  el.classList.toggle("low", r.step!=="judging" && left<10000);
}

function prematchHTML(){
  const writing = G.phase==="report";
  return `<section class="board"><div style="min-width:0"><div class="meta"><span>Full time on the draft</span></div>
    <div class="cat">${writing?"Claude is writing the scouting dossier":"Rolling injuries, weather and the referee"}</div>
    <div class="hint"><span class="spin"></span>&nbsp; Kick-off follows in a moment. ${!mySeat?"":G.phase==="prematch"?`<button class="btn gold sm" id="runsim" style="margin-left:8px">Kick off now</button>`:""}</div></div></section>
    <div class="arena" style="grid-template-columns:1fr 1fr">${teamHTML(mySeat||"A")}${teamHTML(other(mySeat||"A"))}</div>`;

/* ============================================================
   Match view + playback
   A seeded director turns the dice-decided events into football:
   build-up play, runs in behind, crosses, cut-backs, saves, restarts,
   substitutions and red cards. Players move at real football speeds;
   only the match clock is compressed. The whole match is precomputed
   at 20 frames per second, so both devices show the same game and
   anyone can join halfway through.
   ============================================================ */
const PW=1050, PH=680, FX0=25, FX1=1025, FY0=25, FY1=655, CY=340, FL=1000, DT=0.05, FILL_PER_MIN=0.4;
let PB=null, lastFeedCount=-1, lastBanner="", entEls=null;
let pbClock={rate:1, wall:null, pos:0};   // local playback speed (2x) and skip; kick-off time is shared
function playMs(m){ return pbClock.wall==null ? Date.now()+matchOffset-(m.kickoffAt||0) : pbClock.pos+(Date.now()-pbClock.wall)*pbClock.rate; }

// Team-relative coordinates: d = distance from your own goal line, w = across the pitch (your left is negative).
// Teams swap ends at half-time: PB_FLIP is true while the director plays the second half.
let PB_FLIP=false;
const leftSide=p=>(p==="A")!==PB_FLIP;
const dX=(p,d)=> leftSide(p) ? FX0+d : FX1-d;
const dY=(p,w)=> leftSide(p) ? CY+w : CY-w;
const tD=(p,x)=> leftSide(p) ? x-FX0 : FX1-x;
const tW=(p,y)=> leftSide(p) ? y-CY : CY-y;
const pt2=(p,d,w)=>({x:dX(p,d), y:dY(p,w)});
const inF=(o,m=12)=>({x:clamp(o.x,FX0+m,FX1-m), y:clamp(o.y,FY0+m,FY1-m)});
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const unit=(x,y)=>{ const l=Math.hypot(x,y)||1; return {x:x/l,y:y/l}; };

function lineupAt(t, m){
  const L={A:m.lineups.A.map(x=>x&&{...x}), B:m.lineups.B.map(x=>x&&{...x})};
  for(const e of m.events){ if(e.m>t) break;
    if(e.type==="red"){ const i=L[e.t].findIndex(x=>x&&x.name===e.who); if(i>=0) L[e.t][i]=null; }
    if(e.type==="sub"){ const i=L[e.t].findIndex(x=>x&&x.name===e.out); if(i>=0) L[e.t][i]={...L[e.t][i], name:e.who}; }
  }
  return L;
}

/* ---- Layer 1: the schedule. Decided from the events alone, so it's identical on every device. ---- */
function planMatch(m){
  const R=mulberry(((m.seed*7919)+13)>>>0), rr=(a,b)=>a+R()*(b-a), sgn=()=>R()<.5?-1:1;
  const endMin=90+m.stoppage;
  const phases=[], knots=[[0,0]], reveal={}, overlays=[];
  let t=0, cm=0, half2=false, htT=null;
  const add=o=>{ o.t0=t; o.t1=t+o.d; t=o.t1; phases.push(o); return o; };
  const knot=min=>{ cm=Math.max(cm,min); knots.push([t,cm]); };
  const nCh=m.events.filter(e=>e.type==="chance"||e.type==="pen").length, perMin=FILL_PER_MIN*(nCh>18?.75:1);
  const fill=toMin=>{ const gap=toMin-cm; if(gap<=0.04) return; add({type:"fill", d:clamp(gap*perMin,.9,8)}); knot(toMin); };
  const idx=type=>m.events.findIndex(e=>e.type===type);
  const groupOf=(p,name,min)=>{ const s=lineupAt(min,m)[p].find(x=>x&&x.name===name); return s?GROUP(s.g):"FWD"; };

  function scriptFor(e){
    const P=e.t, x=e.xg||.1, pt=(d,w)=>({d,w}); let side=sgn();
    let type;
    if(e.type==="pen") type="pen";
    else if(e.setpiece) type="corner";
    else { const g=groupOf(P,e.who,e.m), r=R();
      if(g==="DEF") type = r<.6 ? "corner" : x>.12 ? "cross" : "long";
      else if(x>=.35) type = r<.4?"cutback":r<.8?"through":"cross";
      else if(x>=.15) type = r<.35?"through":r<.62?(g==="FWD"?"cross":"cutback"):r<.8?"cutback":"solo";
      else if(x>=.07) type = r<.5?"edge":r<.75?(g==="FWD"?"cross":"edge"):"solo";
      else type = r<.7?"long":"edge"; }
    const b=[{k:"win",d:1.0}]; let from, wide=false, speed=245, H=0, touch=.08;
    const slot=lineupAt(e.m,m)[P].find(q=>q&&q.name===e.who), lat=slot&&e.type!=="pen"?(slot.x-50):0;   // shooter's lane, -50 left .. 50 right
    const zone=(lim)=>clamp(lat*3.2+rr(-45,45),-lim,lim);
    if(["cross","corner"].includes(type) && Math.abs(lat)>15) side=lat>0?-1:1;
    switch(type){
      case "through": { const a=pt(rr(560,650),rr(-90,90)); from=pt(FL-rr(95,135),zone(80)); const recv=pt(from.d-rr(40,55),from.w*.6);
        b.push({k:"pass",d:1.5,to:"as",at:a},{k:"pass",d:1.35,to:"sh",at:recv,through:true},{k:"carry",d:.5,who:"sh",at:from}); touch=.12; break; }
      case "cross": { wide=true; const wd=pt(FL-rr(170,230),side*rr(235,268)), c=pt(wd.d+rr(45,75),side*rr(232,262)); from=pt(FL-rr(55,95),-side*rr(0,60));
        b.push({k:"pass",d:1.6,to:"as",at:wd},{k:"carry",d:.7,who:"as",at:c},{k:"pass",d:1.6,to:"sh",at:from,H:46,cross:true}); speed=170; touch=.04; break; }
      case "cutback": { wide=true; const wd=pt(FL-rr(200,240),side*rr(200,250)), by=pt(FL-rr(24,34),side*rr(140,185)); from=pt(FL-rr(95,125),side*rr(0,45));
        b.push({k:"pass",d:1.5,to:"as",at:wd},{k:"carry",d:1.0,who:"as",at:by},{k:"pass",d:.95,to:"sh",at:from}); touch=.05; break; }
      case "long": { const a=pt(rr(560,640),rr(-100,100)); from=pt(FL-rr(215,265),zone(120)); const recv=pt(from.d-rr(15,25),from.w);
        b.push({k:"pass",d:1.4,to:"as",at:a},{k:"pass",d:1.4,to:"sh",at:recv},{k:"carry",d:.4,who:"sh",at:from}); speed=255; H=12; touch=.12; break; }
      case "edge": { from=pt(FL-rr(165,200),zone(95)); const a=pt(FL-rr(230,280),from.w>0?-rr(40,140):rr(40,140));
        b.push({k:"pass",d:1.5,to:"as",at:a},{k:"pass",d:1.1,to:"sh",at:from}); touch=.1; break; }
      case "solo": { if(Math.abs(lat)>15) side=lat>0?1:-1; const recv=pt(FL-rr(235,265),side*rr(170,215)); from=pt(FL-rr(120,150),side*rr(50,100));
        b.push({k:"pass",d:1.6,to:"sh",at:recv},{k:"carry",d:1.7,who:"sh",at:from,dribble:true}); touch=.1; break; }
      case "corner": { wide=true; const wd=pt(FL-rr(170,220),side*rr(220,260)), out=pt(FL+14,side*rr(150,230)), flag=pt(FL-3,side*312); from=pt(FL-rr(55,90),rr(-60,60));
        b.push({k:"pass",d:1.5,to:"as",at:wd},{k:"out",d:.9,at:out},{k:"corner",d:2.3,flag,at:from},{k:"pass",d:1.4,to:"sh",at:from,H:60,cross:true}); speed=165; touch=.04; break; }
      case "pen": { const recv=pt(FL-rr(200,230),side*rr(30,90)), into=pt(FL-rr(128,148),side*rr(20,60)); from=pt(FL-110,0);
        b.push({k:"pass",d:1.4,to:"sh",at:recv},{k:"carry",d:.8,who:"sh",at:into,dribble:true},{k:"foul",d:.3},{k:"penset",d:3.0},{k:"runup",d:.6}); speed=240; touch=.02; break; }
    }
    // where the shot ends up
    const out = e.type==="pen" && e.outcome==="blocked" ? "saved" : e.outcome;
    let to;
    if(out==="goal") to=pt(FL+3, sgn()*rr(12,33));
    else if(out==="saved"||out==="miracle") to=pt(FL-9, rr(-26,26));
    else if(out==="wide"){ if(R()<.6) to=pt(FL+16, sgn()*rr(50,95)); else { to=pt(FL+22, rr(-30,30)); H=Math.max(H,30); } }
    else { const v=unit(FL-from.d, -from.w), k=rr(38,62); to=pt(from.d+v.x*k, from.w+v.y*k); }
    // Give the shooter time to get there: estimate where he starts from his role, and add a spell of
    // possession if he needs longer (a centre-back coming up for a corner, a winger drifting inside...).
    if(slot){ const r0={ST:.82,W:.78,AM:.68,CM:.6,DM:.5,FB:.55,CB:.36,GK:.05}[slot.g]||.6, est={d:FL*r0, w:(slot.x-50)*5.5};
      const first=b.find(q=>q.to==="sh"||q.who==="sh")||null, aim=first&&first.at?first.at:from;
      let avail=0; for(const q of b){ if(q===first){ avail+=q.d*.9; break; } avail+=q.d; }
      const need=Math.hypot(aim.d-est.d, aim.w-est.w)/70;
      if(need>avail) b.splice(1,0,{k:"keep", d:Math.min(4, Math.max(1.2, need-avail))}); }
    const len=Math.hypot(to.d-from.d, to.w-from.w);
    const shotD = touch + Math.max(.25, (len+60)/280);
    b.push({k:"shot",d:shotD,from,to,H,speed,touch});
    const B=b.reduce((s,x)=>s+x.d,0);
    const A = out==="goal" ? 5.4 : out==="wide" ? 3.6 : out==="blocked" ? 2.6 : 2.6;
    let foulAt=null; if(type==="pen"){ foulAt=0; for(const x of b){ foulAt+=x.d; if(x.k==="foul") break; } }
    return {type, side, wide, beats:b, B, A, out, foulAt};
  }

  add({type:"kickoff", p:"A", d:2.0, first:true}); knot(0);
  const secondHalf=()=>{ fill(45); const h=add({type:"ht", d:3.6}); htT=h.t0; reveal[idx("ht")]=h.t0; overlays.push({t0:h.t0,t1:h.t1,kind:"ht",title:"Half-time"}); knot(45); add({type:"kickoff",p:"B",d:2.0}); knot(45); half2=true; };
  const evs=m.events.map((e,i)=>({...e,i}));
  for(let j=0;j<evs.length;j++){
    const e=evs[j];
    if(e.type==="ht"||e.type==="ft") continue;
    if(!half2 && e.m>45) secondHalf();
    if(e.type==="chance"||e.type==="pen"){
      const spec=scriptFor(e);
      fill(e.m - (e.type==="pen"?.3:.35));
      const ph=add({type:"chance", e, spec, d:spec.B+spec.A});
      const hit=ph.t0+spec.B; reveal[e.i]=hit;
      knots.push([hit, Math.max(cm,e.m)]); cm=Math.max(cm,e.m); knots.push([ph.t1, cm+.12]); cm+=.12;
      if(spec.foulAt!=null) overlays.push({t0:ph.t0+spec.foulAt, t1:ph.t0+spec.foulAt+1.8, kind:"pen", team:e.t, title:"Penalty!"});
      if(e.outcome==="goal"){ overlays.push({t0:hit, t1:hit+2.8, kind:"goal", team:e.t, half2, title:"Goal!", sub:e.who}); add({type:"kickoff", p:other(e.t), d:2.0}); knot(cm); }
      else if(e.outcome==="miracle") overlays.push({t0:hit, t1:hit+1.8, kind:"save", team:other(e.t), title:"What a save!", sub:e.keeper||""});
      continue;
    }
    if(e.type==="sub"){
      const group=[e]; while(evs[j+1] && evs[j+1].type==="sub" && evs[j+1].m===e.m) group.push(evs[++j]);
      fill(e.m);
      const ph=add({type:"sub", subs:group, d:4.4});
      group.forEach(g=>reveal[g.i]=ph.t0+.5);
      overlays.push({t0:ph.t0+.5, t1:ph.t0+3.5, kind:"sub", subs:group});
      knot(e.m+.1); continue;
    }
    if(e.type==="red"){
      fill(e.m);
      const ph=add({type:"red", e, d:3.9}); reveal[e.i]=ph.t0+.8;
      overlays.push({t0:ph.t0+.8, t1:ph.t0+3.0, kind:"red", team:e.t, title:"Red card", sub:e.who});
      knot(e.m+.1); continue;
    }
    if(e.type==="aura"){
      fill(e.m); reveal[e.i]=t;
      overlays.push({t0:t, t1:t+2.8, kind:"aura", team:e.t, title:"Aura", sub:e.who});
    }
  }
  if(!half2) secondHalf();
  fill(endMin);
  const ft=add({type:"ft", d:4}); reveal[idx("ft")]=ft.t0; knot(endMin);
  overlays.push({t0:ft.t0, t1:1e9, kind:"ft", title:"Full-time"});
  return {phases, knots, reveal, overlays, T:t, ftT:ft.t0, htT, endMin};
}

/* ---- Layer 2: the director plays each phase out on the pitch. ---- */
function directMatch(m, plan){
  const R=mulberry(((m.seed*104729)+77)>>>0), rr=(a,b)=>a+R()*(b-a);
  const N=Math.ceil(plan.T/DT)+4; PB_FLIP=false;
  const ents=[], team={A:[],B:[]};
  const mkEnt=(p,s,name,pace,ghost)=>{ const e={id:ents.length,p,s:{x:s.x,y:s.y,g:s.g},name,ghost:!!ghost,spd:.93+clamp(pace||70,40,99)/700,
      x:0,y:0,vx:0,vy:0,fx:leftSide(p)?1:-1,fy:0,on:true,X:new Float32Array(N),Y:new Float32Array(N),Al:new Float32Array(N),nm:[[0,name]]}; ents.push(e); return e; };
  for(const p of ["A","B"]) m.lineups[p].forEach(s=>{ if(s) team[p].push(mkEnt(p,s,s.name,s.pace)); });
  const S={t:0, nt:0, k:0, pt:"A", calm:true, chance:false, ov:new Map(), ball:{x:PW/2,y:CY,h:0,mode:"dead",hold:null,fl:null,place:null}};
  const BX=new Float32Array(N), BY=new Float32Array(N), BH=new Float32Array(N), HOLD=new Int16Array(N), PT=new Uint8Array(N);
  const shots=[], lastLine={A:150,B:150};
  const live=p=>team[p].filter(e=>e.on);
  const both=()=>[...live("A"),...live("B")];
  const gkOf=p=>team[p].find(e=>e.on&&e.s.g==="GK")||null;
  const byName=(p,n)=>team[p].find(e=>e.on&&e.name===n)||null;
  const nearest=(p,o,f=()=>true)=>{ let best=null,bd=1e9; for(const e of team[p]) if(e.on&&f(e)){ const d=Math.hypot(e.x-o.x,e.y-o.y); if(d<bd){bd=d;best=e;} } return best; };
  const setOv=(e,o)=>{ if(e) S.ov.set(e,o); };
  const clearOv=e=>{ if(e) S.ov.delete(e); };
  const hold=e=>{ if(!e) return; S.ball.mode="held"; S.ball.hold=e; S.ball.fl=null; S.ball.place=null; S.pt=e.p; };
  const launches=[];
  const launch=(D,t0,t1,H=0,kind="pass")=>{ launches.push({t0,t1,len:Math.hypot(D.x-S.ball.x,D.y-S.ball.y),kind,H}); S.ball.mode="fly"; S.ball.hold=null; S.ball.place=null; S.ball.fl={x0:S.ball.x,y0:S.ball.y,x1:D.x,y1:D.y,t0,t1:Math.max(t1,t0+.01),H,kind}; };
  const dead=place=>{ S.ball.mode="dead"; S.ball.hold=null; S.ball.fl=null; S.ball.place=place||null; };
  const needCap=(e,D,d)=>clamp(Math.hypot(D.x-e.x,D.y-e.y)/Math.max(.3,d)*1.3, 26, 98);
  const beat=(d,start,end,tick)=>({d, start(t0){ this.t1=t0+d; start&&start(t0); }, end(t){ end&&end(t); }, tick});
  const goalC=p=>pt2(p,0,0);

  // Where a player wants to be: the team's shape slides with the ball.
  function shape(e, ptOverride){
    const p=e.p, s=e.s, own=(ptOverride||S.pt)===p, bd=tD(p,S.ball.x), bw=tW(p,S.ball.y), u=clamp(bd/FL,0,1);
    if(s.g==="GK"){ const d = own ? 16+64*u : 12+20*clamp((u-.3)/.4,0,1); return pt2(p, d, clamp(bw*.22,-55,55)); }
    const q=clamp((s.y-19)/67,0,1), w0=(s.x-50)*5.5;
    let d, w;
    if(own){
      const def=FL*(.11+.40*u), span=FL*(.40+.06*u);
      d=def+q*span;
      if(s.g==="FB" && u>.4) d+=FL*.09;
      d=Math.min(d, FL-lastLine[other(p)]-6, FL*.93);
      w=w0*((s.g==="W"||s.g==="FB")?1.05:.95)+bw*.12;
    } else {
      const def=FL*(.06+.33*u), span=FL*.31;
      d=def+q*span; w=w0*.7+bw*.33;

  }
  const predict=e=>shape(e, e.p);
  function carryPt(h, dur){
    const p=h.p, d0=tD(p,h.x); let w=tW(p,h.y);
    const opp=nearest(other(p),h); if(opp && dist(opp,h)<90) w += (tW(p,opp.y)>w ? -1 : 1)*30;
    const d=Math.min(d0+clamp(dur,0,2)*45, S.chance ? FL-25 : Math.max(d0, FL*.74));

    const out=new Map();
    const holder=S.ball.mode==="held"?S.ball.hold:null;
    let presser=null, cover=null, sup=[];

      const dp=other(S.pt), ball={x:S.ball.x,y:S.ball.y};
      const c=team[dp].filter(e=>e.on&&e.s.g!=="GK"&&!S.ov.has(e)).sort((a,b)=>dist(a,ball)-dist(b,ball));
      presser=c[0]; cover=c[1];
      if(holder) sup=team[S.pt].filter(e=>e.on&&e!==holder&&e.s.g!=="GK"&&!S.ov.has(e)).sort((a,b)=>dist(a,holder)-dist(b,holder)).slice(0,2);
    }
    for(const e of ents){ if(!e.on) continue;
      let o=S.ov.get(e);
      if(o && o.until!=null && t>o.until){ S.ov.delete(e); o=null; }
      if(o){ const q=o.fn?o.fn(t):o; out.set(e,{x:q.x,y:q.y,cap:o.cap||60,acc:o.acc||170}); continue; }
      if(e.ghost) continue;

      else if(e===cover && dist(e,S.ball)<330){ const g=goalC(e.p), v=unit(g.x-S.ball.x,g.y-S.ball.y); T={x:S.ball.x+v.x*95,y:S.ball.y+v.y*95}; cap=60; }
      else if(holder && sup.includes(e)){ const v=unit(T.x-holder.x,T.y-holder.y), dd=clamp(Math.hypot(T.x-holder.x,T.y-holder.y),110,190); T={x:holder.x+v.x*dd,y:holder.y+v.y*dd}; cap=56; }
      T={x:T.x+Math.sin(t*.9+e.id*1.7)*5, y:T.y+Math.cos(t*.7+e.id*2.3)*5};   // nobody stands perfectly still
      out.set(e,{...inF(T,12),cap,acc:150});
    }
    return out;
  }
  function move(targets){
    const act=ents.filter(e=>e.on&&!e.ghost), bh=S.ball.mode==="held"?S.ball.hold:null;
    for(const e of ents){ if(!e.on) continue; const T=targets.get(e); if(!T) continue;
      const dx=T.x-e.x, dy=T.y-e.y, d=Math.hypot(dx,dy);
      const want=Math.min(T.cap*e.spd, d*2.6); let tvx=d>.01?dx/d*want:0, tvy=d>.01?dy/d*want:0;
      // personal space: players drift apart instead of stacking (except when challenging the ball carrier)
      if(!e.ghost && !S.calmStack) for(const o of act){ if(o===e) continue; if((e===bh||o===bh) && o.p!==e.p) continue;
        const sx=e.x-o.x, sy=e.y-o.y, sd=Math.hypot(sx,sy); if(sd<26 && sd>.01){ const k=(26-sd)*3.2; tvx+=sx/sd*k; tvy+=sy/sd*k; } }
      let ax=tvx-e.vx, ay=tvy-e.vy; const a=Math.hypot(ax,ay), lim=(T.acc||160)*DT; if(a>lim){ ax*=lim/a; ay*=lim/a; }
      e.vx+=ax; e.vy+=ay; e.x+=e.vx*DT; e.y+=e.vy*DT;
      const sp=Math.hypot(e.vx,e.vy);
      if(sp>12){ e.fx=e.vx/sp; e.fy=e.vy/sp; } else { e.fx+=((leftSide(e.p)?1:-1)-e.fx)*.06; e.fy*=.94; }
    }
  }
  function ballStep(t){

        const isGoal=(ev.type==="chance"||ev.type==="pen")&&ev.outcome==="goal";
        const lab = ev.type==="ht"?"HT":ev.type==="ft"?"FT":ev.m>90?`90+${ev.m-90}'`:`${ev.m}'`;
        return `<div class="ev ${isGoal?"goal":""} ${ev.type==="red"?"red":""} ${ev.type==="sub"?"sub":""}"><span class="m">${lab}</span><span>${ev.t&&!isGoal?`<b style="color:${ev.t==="A"?"var(--cobalt)":"var(--red)"}">${esc(G.players[ev.t].team)}</b> · `:""}${esc(txt)}</span></div>`; }).reverse().join("");
  }
  const res=$("#result");
  if(tt>=pb.ftT+.5 && res && res.hidden){
    res.hidden=false; const rm=$("#rematch"); if(rm) rm.hidden=false;
    const s=m.stats, A=G.players.A.team, B=G.players.B.team;
    const pens = m.pens ? `<div class="eyebrow">Penalty shootout</div>${["A","B"].map(p=>`<div class="pens"><b style="min-width:110px">${esc(G.players[p].team)}</b>${m.pens.log.map(l=>`<i class="${(p==="A"?l.a:l.b)?"y":"n"}" title="${esc(p==="A"?l.A:l.B)}"></i>`).join("")} <span class="num">${m.pens[p]}</span></div>`).join("")}` : "";
    const wn = m.winner ? G.players[m.winner].team : null;
    const share = Math.round(100*pb.cumA[pb.N-1]/pb.N);
    res.innerHTML = `<div class="eyebrow">Full time</div><h4>${wn?esc(wn)+" win":"It's a draw"} · ${m.final.A}–${m.final.B}${m.pens?` (${m.pens.A}–${m.pens.B} pens)`:""}</h4>
      ${m.report?.verdict?`<p>${esc(m.report.verdict)}</p>`:""}${m.report?.motm?`<p><span class="pill gold">Player of the match</span> <b>${esc(m.report.motm)}</b></p>`:""}
      <table class="statt"><tr><td style="color:var(--cobalt)">${esc(A)}</td><td class="eyebrow"></td><td style="color:var(--red)">${esc(B)}</td></tr>
      <tr><td>${s.A.shots}</td><td>Shots</td><td>${s.B.shots}</td></tr><tr><td>${s.A.onT}</td><td>On target</td><td>${s.B.onT}</td></tr>
      <tr><td>${s.A.xg.toFixed(2)}</td><td>xG</td><td>${s.B.xg.toFixed(2)}</td></tr><tr><td>${share}%</td><td>Possession</td><td>${100-share}%</td></tr>
      <tr><td>${m.links.A}</td><td>Chemistry links</td><td>${m.links.B}</td></tr></table>${pens}
      ${(G.history||[]).length?`<div class="eyebrow">Earlier games</div><div class="muted" style="font-size:13px">${G.history.map(h=>h.final?`${h.final.A}–${h.final.B}${h.pens?` (${h.pens.A}–${h.pens.B} p)`:""}`:"").join(" · ")}</div>`:""}`;
  }
}

/* ============================================================
   Event binding
   ============================================================ */
function bind(){
  const on=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn));
  on("#create","click",createGame);
  on("#acode","input",e=>{ lsSet("dn_code", e.currentTarget.value.trim()); accessProblem=false; });
  on("[data-join]","click",e=>joinGame(e.currentTarget.dataset.join));
  on("[data-open]","click",e=>openGame(e.currentTarget.dataset.open));
  on("#leave","click",leaveGame); on("#toLobby","click",leaveGame);
  on("#pickform","submit",e=>{ e.preventDefault(); submitPick(); });
  on("[data-slot]","click",e=>{ uiSel.slot=e.currentTarget.dataset.slot; render(); const i=$("#pick"); if(i) i.focus(); });
  on("[data-slot]","keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); uiSel.slot=e.currentTarget.dataset.slot; render(); } });
  on("[data-cap]","click",e=>submitCaptain(e.currentTarget.dataset.cap));
  on("#reroll","click",()=>{ if(G?.round) commit(M.reroll(G.round.key, mySeat)); });
  on("[data-rv]","click",e=>review(e.currentTarget.dataset.rv));
  on("#runsim","click",runMatch);
  on("#skip","click",()=>{ if(!G?.match) return; const pb=getPB(); pbClock={rate:1, wall:Date.now(), pos:pb.total+500}; const sb=$("#speed"); if(sb) sb.textContent="2× speed"; frame(true); });
  on("#speed","click",e=>{ if(!G?.match) return; getPB(); const pos=playMs(G.match), rate=pbClock.rate===1?2:1; pbClock={rate, wall:Date.now(), pos}; e.currentTarget.textContent = rate===2 ? "Normal speed" : "2× speed"; });
  on("#rematch","click",rematch);
}
/* Start up last, once every function and variable above exists. */
function boot(){
  setInterval(tick, 400);   // start the clock first, so nothing below can stop it
  render();
  me.id = lsGet("dn_id") || ("p_" + Math.random().toString(36).slice(2,12)); lsSet("dn_id", me.id);
  if (configured) { try { db = makeDb(); sample = makeSample(); } catch(e) { console.warn(e); db = null; } }
  platformReady = true;
  if(db){
    unsubLobby = db.collection("lobby").orderBy("updatedAt","desc").limit(20).onSnapshot(s=>{ lobby=s.docs.map(d=>d.data()); if(!G) render(); }, e=>{ console.warn(e); canWrite=false; render(); });
    const h = (location.hash||"").replace("#","").toUpperCase();
    if(/^[A-Z0-9]{5}$/.test(h)) openGame(h);
  }
  render();
}
boot();
</script>
