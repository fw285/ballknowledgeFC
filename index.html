<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Draft Night FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700&family=DotGothic16&display=swap">
<style>
/* Layout: sticker-album matchday program. Category card + timer up top, two team "album pages" (pitches with sticker cards) side by side, action panel between. */
:root{
  --paper:#e9edf4; --paper-2:#dde3ee; --card:#ffffff; --ink:#111a2f; --muted:#5a6479; --rule:#c6cedd;
  --cobalt:#1d3fc4; --cobalt-soft:#dfe5fb; --saffron:#f2b705; --saffron-ink:#5b4300; --red:#d22f2a; --red-soft:#fbe1df;
  --ok:#147a3e; --ok-soft:#dcf1e3; --warn:#a85c00;
  --pitch:#2d7a47; --pitch-2:#286f40; --chalk:rgba(255,255,255,.72);
  --shadow:0 1px 0 rgba(17,26,47,.06),0 6px 18px -10px rgba(17,26,47,.35);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --dot:"DotGothic16",ui-monospace,"Courier New",monospace;
  --teamA:var(--cobalt); --teamB:var(--red);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0c1222; --paper-2:#121a2e; --card:#18223b; --ink:#e7ebf5; --muted:#9aa5bd; --rule:#2a3655;
  --cobalt:#7d96ff; --cobalt-soft:#1c2a5c; --saffron:#f6c437; --saffron-ink:#2a1f00; --red:#ff6a63; --red-soft:#4a1d1c;
  --ok:#4fd185; --ok-soft:#163a26; --warn:#ffb050;
  --pitch:#1f5e37; --pitch-2:#1b5531; --chalk:rgba(255,255,255,.55);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c1222; --paper-2:#121a2e; --card:#18223b; --ink:#e7ebf5; --muted:#9aa5bd; --rule:#2a3655;
  --cobalt:#7d96ff; --cobalt-soft:#1c2a5c; --saffron:#f6c437; --saffron-ink:#2a1f00; --red:#ff6a63; --red-soft:#4a1d1c;
  --ok:#4fd185; --ok-soft:#163a26; --warn:#ffb050;
  --pitch:#1f5e37; --pitch-2:#1b5531; --chalk:rgba(255,255,255,.55);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding:0 16px 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px;border-bottom:2px solid var(--ink);margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:34px;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
.brand h1 span{color:var(--cobalt)}
.brand .tag{font-family:var(--dot);font-size:13px;color:var(--muted)}
.mast .who{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--paper-2);color:var(--ink)}
.pill.a{background:var(--cobalt-soft);color:var(--cobalt)}
.pill.b{background:var(--red-soft);color:var(--red)}
.pill.gold{background:var(--saffron);color:var(--saffron-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}

.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;letter-spacing:.02em}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.blue{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.gold{background:var(--saffron);border-color:var(--saffron);color:var(--saffron-ink)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{border:2px solid var(--rule);background:var(--card);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.field input:focus,.field select:focus{border-color:var(--cobalt);outline:none}
.notice{border:2px dashed var(--rule);border-radius:12px;padding:14px 16px;background:var(--card)}
.notice.bad{border-color:var(--red);background:var(--red-soft)}

/* Lobby */
.lobby{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:start}
@media (max-width:860px){.lobby{grid-template-columns:1fr}}
.hero{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:grid;gap:18px}
.hero h2{font-size:clamp(34px,6vw,58px);font-weight:900;text-transform:uppercase;line-height:.92}
.hero h2 em{font-style:normal;color:var(--red)}
.hero p{margin:0;max-width:60ch}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
@media (max-width:620px){.formrow{grid-template-columns:1fr}}
.list{display:grid;gap:10px}
.gamecard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);flex-wrap:wrap}
.gamecard .code{font-family:var(--dot);font-size:20px;letter-spacing:.12em}
.gamecard .vs{font-weight:700;min-width:0}
.rules{background:var(--card);border-radius:14px;padding:4px 16px;box-shadow:var(--shadow)}
.rules summary{cursor:pointer;font-weight:700;padding:12px 0}
.rules ul{margin:0 0 14px;padding-left:18px;display:grid;gap:5px}
.dicetable{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin-bottom:14px}

/* Dice (d10) */
.die{width:46px;height:46px;flex:none;display:block}
.die.sm{width:30px;height:30px}
.die .face{fill:var(--card);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.die .edge{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:.45}
.die text{font-family:var(--display),Impact,sans-serif;font-weight:900;font-size:17px;fill:var(--ink)}
.die.gold .face{fill:var(--saffron);stroke:var(--saffron-ink)}
.die.gold text{fill:var(--saffron-ink)} .die.gold .edge{stroke:var(--saffron-ink)}
.die.roll{animation:roll .7s cubic-bezier(.3,1.5,.6,1)}
@keyframes roll{0%{transform:rotate(-200deg) scale(.4)}100%{transform:none}}

/* Game header: category board */
.board{display:grid;grid-template-columns:1fr auto;gap:16px;background:var(--ink);color:var(--paper);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.board .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.board .cat{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.2vw,44px);line-height:1;margin:10px 0 6px;text-wrap:balance}
.board .hint{opacity:.75;font-size:14px;max-width:70ch}
.board .dicefx{display:flex;gap:12px;align-items:center;margin-top:12px;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;width:fit-content;max-width:100%}
.board .dicefx b{font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.board .die .face{fill:var(--paper);stroke:var(--paper)}
.board .die text{fill:var(--ink)} .board .die .edge{stroke:var(--ink)}
.board .die.gold .face{fill:var(--saffron);stroke:var(--saffron)}
.board .die.gold text{fill:var(--saffron-ink)}
.timer{width:118px;height:118px;position:relative;flex:none;align-self:center}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--dot);font-size:34px}
.timer .t small{display:block;font-size:11px;font-family:var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-top:-26px}
.timer.low .t{color:var(--saffron)}
@media (max-width:620px){.board{grid-template-columns:1fr}.timer{width:92px;height:92px;justify-self:end;margin-top:-6px}.timer .t{font-size:26px}}

/* Arena */
.arena{display:grid;grid-template-columns:1fr minmax(280px,360px) 1fr;gap:16px;margin-top:16px;align-items:start}
@media (max-width:1060px){.arena{grid-template-columns:1fr 1fr}.arena .panel{grid-column:1/-1;order:-1}}
@media (max-width:700px){.arena{grid-template-columns:1fr}}
.arena.two{grid-template-columns:1fr 1fr}
@media (max-width:700px){.arena.two{grid-template-columns:1fr}}
.team{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:grid;gap:12px;min-width:0}
.team header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.team h3{font-size:26px;text-transform:uppercase;font-weight:900}
.team.a h3{color:var(--teamA)} .team.b h3{color:var(--teamB)}
.team .sub{font-size:12px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1.5px solid var(--rule);border-radius:8px;padding:4px 8px;max-width:100%;min-width:0;overflow-wrap:anywhere}
.chip b{font-weight:700}
.chip.none{border-style:dashed;color:var(--muted)}

/* Mini pitch with stickers */
.pitchbox{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(0deg,var(--pitch) 0 10%,var(--pitch-2) 10% 20%)}
.pitchbox svg.lines{position:absolute;inset:0;width:100%;height:100%}
.sticker{position:absolute;transform:translate(-50%,-50%);width:23%;max-width:96px;min-height:48px;background:var(--card);color:var(--ink);border-radius:7px;padding:4px 4px 3px;text-align:center;box-shadow:0 3px 8px -3px rgba(0,0,0,.6);display:grid;gap:1px;line-height:1.05}
.sticker .pos{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.sticker .nm{font-family:var(--display);font-weight:800;font-size:15px;text-transform:uppercase;overflow-wrap:anywhere}
.sticker .nat{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sticker .rt{position:absolute;top:-7px;right:-6px;background:var(--ink);color:var(--paper);font-family:var(--dot);font-size:11px;border-radius:6px;padding:1px 4px}
.sticker.open{background:rgba(255,255,255,.12);border:2px dashed var(--chalk);color:#fff;box-shadow:none}
.sticker.open .pos{color:#fff}
.sticker.empty{background:rgba(0,0,0,.28);border:2px dashed var(--red);color:#fff;box-shadow:none}
.sticker.empty .pos,.sticker.empty .nat{color:#ffd2cf}
.sticker.gold{background:linear-gradient(135deg,#fff4c2 0%,#f2b705 35%,#fff3b8 55%,#d99a00 80%,#fff1a8 100%);color:#2a1f00;background-size:200% 200%;animation:foil 5s ease-in-out infinite}
.sticker.gold .pos,.sticker.gold .nat{color:#5b4300}
@keyframes foil{50%{background-position:100% 100%}}
.sticker.wheelslot{background:repeating-linear-gradient(45deg,#2a1f00 0 6px,#3b2c00 6px 12px);color:var(--saffron);border:2px dashed var(--saffron);box-shadow:none}
.sticker.wheelslot .pos,.sticker.wheelslot .nat{color:#ffe08a}
.sticker.wheel{box-shadow:0 0 0 2px var(--saffron),0 3px 8px -3px rgba(0,0,0,.6)}
.sticker.meme{background:repeating-linear-gradient(45deg,var(--card) 0 6px,var(--paper-2) 6px 12px)}
.sticker .tagm{font-size:8px;font-weight:800;letter-spacing:.12em;color:var(--red)}
.sticker.cap::after{content:"C";position:absolute;top:-7px;left:-6px;background:var(--saffron);color:var(--saffron-ink);font-weight:800;font-size:10px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center}
.sticker.pickable{cursor:pointer;outline:2px solid var(--saffron);outline-offset:1px}
.sticker.pickable.sel{background:var(--saffron);color:var(--saffron-ink);border-style:solid}
.bench{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bench .sticker{position:relative;transform:none;width:auto;max-width:none;left:auto;top:auto}
.bench .sticker.open{background:var(--paper-2);border-color:var(--rule);color:var(--muted)}
.bench .sticker.open .pos{color:var(--muted)}
.chem{font-size:12px;color:var(--muted)}

/* Action panel */
.panel{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:grid;gap:14px;border-top:6px solid var(--ink)}
.panel.mine{border-top-color:var(--saffron)}
.panel h4{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:0;font-weight:800}
.ruling{border-radius:12px;padding:12px;display:grid;gap:6px}
.ruling.yes{background:var(--ok-soft)} .ruling.no{background:var(--red-soft)} .ruling.unk{background:var(--paper-2)}
.ruling .verdict{font-family:var(--display);font-size:26px;font-weight:900;text-transform:uppercase}
.ruling.yes .verdict{color:var(--ok)} .ruling.no .verdict{color:var(--red)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.spin{width:22px;height:22px;border:3px solid var(--rule);border-top-color:var(--cobalt);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.log{max-height:260px;overflow:auto;display:grid;gap:6px;font-size:13px;padding-right:4px}
.log div{border-left:3px solid var(--rule);padding-left:8px}
.log div.a{border-color:var(--teamA)} .log div.b{border-color:var(--teamB)}
.slotgrid{display:flex;flex-wrap:wrap;gap:6px}
.slotbtn{border:2px solid var(--rule);background:var(--paper);border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px}
.slotbtn.sel{background:var(--saffron);border-color:var(--saffron);color:var(--saffron-ink)}

/* Match */
.matchtop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--ink);color:var(--paper);border-radius:16px;padding:12px 16px}
.matchtop .tn{font-family:var(--display);font-weight:900;font-size:clamp(18px,3vw,30px);text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.matchtop .tn.r{text-align:right}
.score{font-family:var(--dot);font-size:clamp(34px,6vw,54px);display:flex;gap:10px;align-items:center;justify-content:center}
.score .clk{font-size:14px;background:var(--saffron);color:var(--saffron-ink);border-radius:6px;padding:2px 8px}
.pitchwrap{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.pitchwrap svg{display:block;width:100%;height:auto}
.goalbanner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.goalbanner div{font-family:var(--display);font-weight:900;font-size:clamp(48px,11vw,130px);color:#fff;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 6px 0 rgba(0,0,0,.35);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.goalbanner div small{display:block;font-size:.26em;text-align:center;letter-spacing:.08em}
.goalbanner .bn{font-size:clamp(30px,6vw,70px)}
.goalbanner .redcard{display:inline-block;width:.5em;height:.7em;background:#e0261f;border-radius:4px;margin-right:.25em;vertical-align:-.05em;box-shadow:0 3px 0 rgba(0,0,0,.35);transform:rotate(-8deg)}
.subboard{display:grid;gap:8px;background:#111;border:3px solid #333;border-radius:10px;padding:10px 14px;font-family:var(--dot);text-shadow:none;text-transform:none;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.goalbanner .subboard{font-size:clamp(14px,2.4vw,22px);font-weight:700;letter-spacing:.02em}
.subboard .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.subboard .tm{color:#fff;border-radius:6px;padding:2px 8px;font-family:var(--sans,inherit);font-size:.75em}
.goalbanner .subboard div{font-size:inherit;text-transform:none;text-shadow:none;animation:none;color:inherit;letter-spacing:inherit}
.subboard .in{color:#5ee37a}.subboard .out{color:#ff6a63}
.feed .ev.sub .m{color:var(--cobalt)}
@keyframes pop{from{transform:scale(.3) rotate(-6deg);opacity:0}}
.matchgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px;align-items:start}
@media (max-width:860px){.matchgrid{grid-template-columns:1fr}}
.feed{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:grid;gap:8px;max-height:460px;overflow:auto}
.feed .ev{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:14px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.feed .ev .m{font-family:var(--dot);color:var(--muted)}
.feed .ev.goal{background:var(--saffron);color:var(--saffron-ink);border-radius:10px;padding:8px;border:0}
.feed .ev.goal .m{color:var(--saffron-ink)}
.feed .ev.red .m{color:var(--red)}
.dossier{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:grid;gap:10px}
.dossier h4{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:0}
.dossier p{margin:0;max-width:68ch}
.rolls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.roll{background:var(--paper);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:13px}
.statt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.statt td{padding:6px 4px;border-bottom:1px solid var(--rule);text-align:center}
.statt td:first-child,.statt td:last-child{font-weight:700;width:30%}
.pens{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pens i{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid var(--ink)}
.pens i.y{background:var(--ok);border-color:var(--ok)} .pens i.n{background:var(--red);border-color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.poss{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--rule)}
.poss i{display:block;height:100%;transition:width .6s}
.board .startbox{display:grid;gap:6px;justify-items:center;align-self:center;text-align:center;font-size:12px;opacity:.95}
.btn.big{font-size:20px;padding:14px 26px;border-radius:12px;font-family:var(--display);text-transform:uppercase;letter-spacing:.04em}
/* Full-time report */
.ftreport{margin-top:16px;gap:14px}
.ftreport h4{font-size:30px}
.ftscorers{display:grid;gap:4px;font-size:14px}
.ftgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media (max-width:900px){.ftgrid{grid-template-columns:1fr}}
.ftmom{position:relative;margin-top:6px;padding-bottom:18px}
.ftmom svg{display:block;width:100%;height:110px;border-radius:6px}
.ftaxis{position:absolute;left:0;right:0;bottom:0;height:16px;font-size:11px;color:var(--muted)}
.ftaxis span{position:absolute;transform:translateX(-50%)}
.ftaxis span:first-child{transform:none}.ftaxis span:last-child{transform:translateX(-100%)}
.tablewrap{overflow-x:auto}
table.pt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.pt th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 3px;border-bottom:2px solid var(--rule)}
table.pt th:first-child,table.pt td:first-child{text-align:left}
table.pt td{padding:4px 3px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.pt tr.motm td{background:color-mix(in srgb,var(--saffron) 18%,transparent)}
table.pt .rv{font-family:var(--dot);font-size:12px;background:var(--paper-2);border-radius:5px;padding:1px 5px}
table.pt .rv.hi{background:var(--ok-soft);color:var(--ok)} table.pt .rv.lo{background:var(--red-soft);color:var(--red)}
table.pt .in{color:var(--ok);font-size:11px} table.pt .out{color:var(--red);font-size:11px}
.solo{display:grid;gap:10px;border-top:2px dashed var(--rule);padding-top:16px}
.hero .rules{box-shadow:none;border:2px solid var(--rule)}

async function runJudge(backup){

function backfillNeeds(st){

    Object.entries(sq.slots).forEach(([k,v])=>{ if(v&&v.name&&!v.isMeme&&(v.noAI||!v.attrs)) need.push({p,where:k,name:v.name,role:slotInfo(sq,k).label}); });

    if(sq.manager && sq.manager.name && !sq.manager.none && !sq.manager.isMeme && !sq.manager.tactics) mgrs.push({p,name:sq.manager.name});

async function backfillSquads(st){
  const all = backfillNeeds(st);
  if((!all.need.length && !all.mgrs.length) || !sample) return 0;
  // small batches run side by side, so no reply gets near the length limit; managers get their own batch
  const batches=[]; for(let i=0;i<all.need.length;i+=4) batches.push({need:all.need.slice(i,i+4), mgrs:[]});
  if(all.mgrs.length) batches.push({need:[], mgrs:all.mgrs});
  const counts = await Promise.all(batches.map(bt=>scoutBatch(st, bt.need, bt.mgrs)));

/* ============================================================
   Chemistry
   ============================================================ */
function chemLinks(sq){
  const xi = slotsOf(sq.formation).map(s=>({s, p:sq.slots[s.k]})).filter(o=>o.p && o.p.name && !o.p.isMeme);
  const links=[];
  for(let i=0;i<xi.length;i++) for(let j=i+1;j<xi.length;j++){
    const a=xi[i].p, b=xi[j].p; const why=[];
    const ca=(a.clubs||[]).map(norm), cb=(b.clubs||[]).map(norm);
    const shared = ca.filter(c=>c && cb.includes(c)); if(shared.length) why.push((a.clubs||[])[ca.indexOf(shared[0])]);
    if(a.nationalTeam && norm(a.nationalTeam)===norm(b.nationalTeam)) why.push(a.nationalTeam);
    if(why.length) links.push({a:xi[i].s, b:xi[j].s, why});
  }
  return links;
}

      bench: sq.subs.filter(v=>v && v.name),
      manager: sq.manager||null, stadium: sq.stadium||null, aura: sq.aura||null, captain: sq.captain||null,
      tactics: (tac && tac[p]) || teamTactics(st, p),

let engineWorker=null, engineJobs=0; const engineWaiters={};
function runEngine(input){
  return new Promise(resolve=>{
    const local = ()=>setTimeout(()=>{ try{ const r=simulateMatch(input); r.digest=digest(r); delete r.dbg; resolve(r); }catch(e){ console.warn("engine",e); resolve(null); } }, 30);
    try{
      if(!engineWorker){
        engineWorker = new Worker(new URL("./engine-worker.js", import.meta.url), {type:"module"});
        engineWorker.onmessage = e=>{ const w=engineWaiters[e.data.id]; if(!w) return; delete engineWaiters[e.data.id]; if(e.data.error){ console.warn(e.data.error); w.fallback(); } else w.resolve(e.data.res); };
        engineWorker.onerror = e=>{ console.warn("worker", e.message||e); const ws=Object.values(engineWaiters); for(const k in engineWaiters) delete engineWaiters[k]; engineWorker=null; ws.forEach(w=>w.fallback()); };
      }
      const id=++engineJobs; engineWaiters[id]={resolve, fallback:local};
      engineWorker.postMessage({id, input});
    }catch(e){ console.warn("no worker", e); local(); }
  });
}
const surnameOf = (sim, id) => id==null||!sim.ents[id] ? "" : surname(sim.ents[id].name);
const fullOf = (sim, id) => id==null||!sim.ents[id] ? "" : sim.ents[id].name;
const minLabel = (sim, e) => { const c=e.clock||0; if(e.type==="ht") return "HT"; if(e.type==="ft") return "FT"; if(e.type==="shootout") return "PEN";
  const m=Math.floor(c/60)+1; if(e.half===1 && c>=2700) return `45+${Math.floor((c-2700)/60)+1}'`; if(e.half===2 && c>=5400) return `90+${Math.floor((c-5400)/60)+1}'`; return `${m}'`; };
const SAVED = new Set(["saved","caught","parried","tipped"]);
// The moments worth a commentary line, in order.
function feedWorthy(e){
  if(e.type==="shot") return e.outcome!=="goal" && (e.big || SAVED.has(e.outcome) || e.outcome==="post" || e.outcome==="bar" || e.xg>=0.15);
  return ["goal","penalty","red","sub","aura","tactic","ht","ft","shootout","yellow"].includes(e.type) || (e.type==="kickoff" && e.tick===0);
}
function keyEventIdx(sim){ const out=[]; sim.events.forEach((e,i)=>{ if(feedWorthy(e) && e.type!=="yellow" && e.type!=="kickoff") out.push(i); }); return out.slice(0,45); }

// Before kick-off the host scouts any missing attributes while both managers set up.

async function prepSquads(){

    const n = await backfillSquads(fresh);

      // keep the scouting even if kick-off was pressed meanwhile: the match is built from it
      if(n && (st.phase==="prematch" || st.phase==="report")){ for(const p of ["A","B"]){ st.squads[p]=fresh.squads[p]; } }
      st.pre.prep="done"; });
  })().catch(e=>console.warn("prep",e)).finally(()=>{ prepRunning=null; });
  return prepRunning;
}


/* Templated commentary (used when Claude isn't available, and for minor moments) */
function templLine(e, sim){
  const tn = p => G?.players?.[p]?.team || p;
  const n = id => surnameOf(sim, id);
  const has = m => (e.method||[]).includes(m);
  switch(e.type){
    case "kickoff": return "We're under way.";
    case "ht": return `Half-time: ${tn("A")} ${e.score.A}–${e.score.B} ${tn("B")}.`;
    case "ft": return `Full-time: ${tn("A")} ${e.score.A}–${e.score.B} ${tn("B")}.`;
    case "sub": return `${n(e.p)} comes on for ${n(e.out)}${e.why==="tired"?", who's out on his feet":e.why==="poor"?" after a poor game":e.why==="booked"?", who's on a yellow":""}.${e.tactical?" An attacking change.":""}`;
    case "yellow": return e.second ? `Second yellow for ${n(e.p)}.` : `Yellow card for ${n(e.p)}.`;
    case "red": return e.second ? `${n(e.p)} picks up a second yellow and he's off!` : `Straight red! ${n(e.p)} is sent off.`;
    case "penalty": return `Penalty! ${n(e.victim)} is brought down by ${n(e.p)}.`;
    case "aura": return `Aura: ${e.name}. ${AURA_TRIGGERS[e.trigger]||""}.`;
    case "tactic": return e.kind==="protect" ? `${tn(e.team)} drop deeper to protect the lead.` : e.kind==="allout" ? `${tn(e.team)} throw everything forward.` : `${tn(e.team)} push more men forward, chasing the game.`;
    case "shootout": return `${n(e.p)} ${e.scored?"scores":"misses"}. Shootout: ${e.score.A}–${e.score.B}.`;
    case "goal": {
      const sc=n(e.p), as=n(e.assist), score=` (${e.score.A}–${e.score.B})`;
      if(e.og) return `Own goal! ${sc} turns it into his own net${score}.`;
      if(has("penalty")) return `${sc} sends the keeper the wrong way from the spot${score}.`;
      if(has("free kick")) return `${sc} curls the free kick into the net${score}!`;
      if(has("header")) return `${as?as+" delivers and ":""}${sc} heads it in${score}!`;
      if(has("counter")) return `A lightning counter-attack, finished by ${sc}${score}.`;
      if(has("through ball")) return `${as||"A defence-splitting pass"} slides ${sc} through, and he finishes${score}.`;
      if(has("cut-back")) return `${as} pulls it back and ${sc} sweeps it home${score}.`;
      if(has("cross")) return `${as} whips in a cross and ${sc} converts${score}.`;
      if(has("long range")) return `${sc} lets fly from distance and it flies in${score}!`;
      if(has("rebound")) return `${sc} pounces on the rebound${score}.`;
      if(has("one-on-one")) return `${sc} goes one-on-one and makes no mistake${score}.`;
      if(has("solo run")) return `${sc} beats his man and finishes${score}.`;
      return `GOAL! ${sc} scores${score}.`;
    }
    case "shot": {
      const p=n(e.p), k=n(e.keeper)||"the keeper";
      if(e.pen) return SAVED.has(e.outcome) ? `${k} saves ${p}'s penalty!` : `${p} misses the penalty!`;
      if(e.outcome==="post") return `${p} hits the post!`;
      if(e.outcome==="bar") return `${p} smashes it off the crossbar!`;
      if(SAVED.has(e.outcome)) return e.big ? `Huge chance for ${p}, but ${k} makes a brilliant save.` : e.outcome==="caught" ? `${k} gathers ${p}'s effort.` : `${p} forces a save from ${k}.`;
      if(e.outcome==="blocked") return `${p}'s shot is blocked.`;
      return e.big ? `${p} should score, but puts it ${e.outcome==="over"?"over":"wide"}.` : `${p} fires ${e.outcome==="over"?"over the bar":"wide"}.`;
    }
  }
  return "";
}

// Apply a game state from the live listener or a refresh, never going backwards.
function applyState(data){
  if(!data) return;
  if(G && data.id===G.id && (data.seq||0) < (G.seq||0)) return;
  if(G && data.id===G.id && (data.seq||0) === (G.seq||0) && data.updatedAt===G.updatedAt) return;
  const prev = G; G = data;
  mySeat = G.players.A?.uid===me.id ? "A" : G.players.B?.uid===me.id ? "B" : null;
  if(prev?.round?.key !== G.round?.key) uiSel={slot:null};
  render();

}

// Which seat runs the match + commentary: one whose device can reach Claude.
function simRunner(){ const ok=G.refOk||{}; if(ok.A!==false) return "A"; if(ok.B!==false) return "B"; return "A"; }

function afterState(prev){
  if(!G) return;
  if(G.phase==="draft" && G.round?.step==="judging" && G.round.pending?.judge===mySeat) runJudge();
  if(G.solo && mySeat==="A" && G.phase==="draft"){ botTurn(); botReview(); }
  if(G.phase==="prematch" && mySeat){
    if(!G.pre){ const k="pi"+G.id; if(!fired[k]){ fired[k]=1; commit(st=>{ if(st.phase!=="prematch"||st.pre) return false; fillEmpties(st); st.tac={A:{},B:{}}; st.pre={ready:{A:false,B:false}, level:"extended", levelBy:null, deadline:Date.now()+PREMATCH_MS, prep:"pending"}; }); } }
    else if(G.pre.prep!=="done" && mySeat===simRunner()){ const k="prep"+G.id+G.pre.deadline; if(!fired[k]){ fired[k]=1; prepSquads(); } }
  }
  if(G.phase==="match" && prev?.phase!=="match"){ matchOffset=0; PB=null; pbClock={rate:1,wall:null,pos:0}; }
  if(G.phase==="match" && !raf) startPlayback();
}

function tick(){
  updateTimerUI();
  if(gameRef && G && Date.now()-lastSnapAt > 12000 && document.visibilityState!=="hidden") refreshGame();
  if(!G || !mySeat || !canWrite) return;
  const now=Date.now();
  if(G.phase==="draft" && G.round && G.solo && mySeat==="A"){ botTurn(); botReview(); }
  if(G.phase==="draft" && G.round){
    const r=G.round, turn=r.turns[r.ti], mine=turn.p===mySeat;
    if(r.kind==="spin"){ if(now > r.deadline){ const k="sd"+r.key; if(!fired[k]){ fired[k]=1; commit(M.spinDone(r.key)); } } return; }
    if(r.step==="pick" && now > r.deadline + (mine?300:5000)){ const k="to"+r.key; if(!fired[k]){ fired[k]=1; commit(M.timeout(r.key)); } }
    if(r.step==="review" && now > r.reviewDeadline + (mine?5000:300)){ const k="rv"+r.key; if(!fired[k]){ fired[k]=1; commit(M.resolve(r.key,"accept",other(turn.p))); } }
    // if the judging device has gone quiet (a phone locked mid-ruling), the other device rules too; the first answer wins
    if(r.step==="judging" && r.pending && r.pending.judge!==mySeat && now - r.pending.at > 18000 && (G.refOk||{})[mySeat]!==false){ const k="bj"+r.key+(r.pending.tried||[]).length; if(!fired[k]){ fired[k]=1; runJudge(true); } }
    if(r.step==="judging" && r.pending && now - r.pending.at > 55000){ const k="un"+r.key+(r.pending.tried||[]).length; if(!fired[k]){ fired[k]=1; commit(M.handoff(r.key, r.pending.judge, "timeout")); } }
  }
  if(G.phase==="prematch" && G.pre){
    const both=G.pre.ready.A&&G.pre.ready.B, at = both ? Math.min(G.pre.readyAt||now, G.pre.deadline) : G.pre.deadline;
    const delay = mySeat===simRunner() ? (both?600:0) : 20000;
    if(now > at + delay){ const k="sim"+G.id+G.pre.deadline+":"+(G.pre.attempt||0); if(!fired[k]){ fired[k]=1; runMatch(); } }
  }
  if(G.phase==="report" && G.reportStartedAt && now-G.reportStartedAt>150000){ const k="rp"+G.reportStartedAt; if(!fired[k]){ fired[k]=1; commit(st=>{ if(st.phase!=="report"||Date.now()-st.reportStartedAt<150000) return false; st.phase="prematch"; if(st.pre){ st.pre.attempt=(st.pre.attempt||0)+1; st.pre.deadline=Date.now()+20000; } pushLog(st,"The match host dropped out. Restarting kick-off."); }); } }
}

async function runMatch(){
  if(!G || G.phase!=="prematch") return;
  try{ const l = await gameRef.acquire({holder:me.id, ttlMs:180000}); if(!l.acquired) return; }catch(e){}
  const ok0 = await commit(st=>{ if(st.phase!=="prematch") return false; st.phase="report"; st.reportStartedAt=Date.now(); pushLog(st, st.pre && st.pre.prep!=="done" ? "Finishing the scouting, then kick-off." : "The teams are out. Simulating the match."); });
  if(!ok0) return;
  // scouting decides how every player plays, so kick-off waits for it (it normally finishes during the team talk);
  // if it stalls, anyone still unscouted plays on stats estimated from his rating
  if(prepRunning) await Promise.race([prepRunning, new Promise(r=>setTimeout(r, 70000))]);
  let fresh = structuredClone((await gameRef.get()).data()); if(!fresh || fresh.phase!=="report") return;
  if(fresh.pre && fresh.pre.prep!=="done" && !prepRunning){ const n0=backfillNeeds(fresh); if(n0.need.length||n0.mgrs.length) await Promise.race([backfillSquads(fresh), new Promise(r=>setTimeout(r, 60000))]); }
  const seed = (Math.floor(Math.random()*2**31)>>>0) || 7;
  const tac = {A:teamTactics(fresh,"A"), B:teamTactics(fresh,"B")};
  const input = buildEngineInput(fresh, seed, tac);
  const sim = await runEngine(input);
  if(!sim){ await commit(st=>{ if(st.phase!=="report") return false; st.phase="prematch"; pushLog(st,"The match engine failed to start. Trying again."); }); return; }
  SIMCACHE = {key: G.id+":"+seed, sim};
  const ok1 = await commit(st=>{ if(st.phase!=="report") return false;
    st.squads = fresh.squads;
    st.match = {v:ENGINE_VERSION, seed, tac, level: fresh.pre?.level||"extended", digest: sim.digest,
      final: sim.final, pens: sim.pens?{A:sim.pens.A, B:sim.pens.B}:null, winner: sim.winner, stats: sim.stats,
      motm: sim.motm!=null ? sim.ents[sim.motm].name : null, rolls: sim.rolls, report:null, reportPending:!!sample && (!fresh.quick || fresh.quick.claude), kickoffAt: Date.now()+(sample && (!fresh.quick || fresh.quick.claude)?20000:(fresh.quick?4000:8000))};
    st.phase="match"; });
  if(!ok1 || !sample || (fresh.quick && !fresh.quick.claude)) return;
  // Claude writes the dossier (short, shown before kick-off) and the commentary (longer, used as the highlights play) at the same time.
  const save = part => commit(st=>{ if(st.phase!=="match" || !st.match || st.match.seed!==seed) return false; st.match.report = {...(st.match.report||{}), ...part}; if(part.lines) st.match.reportPending=false; });
  const dossier = writeDossier(fresh, input, sim).then(d=>{ if(d) return save(d); });
  const lines = writeLines(fresh, input, sim).then(l=>save(l || {lines:{}}));
  await Promise.allSettled([dossier, lines]);
}
async function rematch(){
  await commit(st=>{
    if(st.phase!=="match" && st.phase!=="done") return false;
    const keep={A:st.players.A, B:st.players.B};
    st.history=[...(st.history||[]), {final:st.match?.final, pens:st.match?.pens?{A:st.match.pens.A,B:st.match.pens.B}:null, winner:st.match?.winner}].slice(-10);
    delete st.match; delete st.tac; st.usedIds=[]; st.used={}; st.players=keep; st.log=[];
    if(st.quick){ st.players.B.formation=rand(Object.keys(FORMATIONS)); setUpQuick(st, st.quick.strength, st.players.A.formation); pushLog(st,"New quick match: fresh random squads. Claude is scouting them."); return; }
    delete st.pre; pushLog(st,"Rematch! New draft, new dice.");
    startDraft(st);
  });
  matchOffset=0; PB=null; SIMCACHE=null; if(raf) cancelAnimationFrame(raf); raf=null;
}

const TIER_COL = ["#6b7488","#1d3fc4","#7c3aed","#f2b705"];
function wheelSegs(){ let a=0; return WHEEL_ODDS.map((o,i)=>{ const size=360*o.chance/WHEEL_TOTAL, seg={i, a0:a, a1:a+size, label:o.label}; a+=size; return seg; }); }
function wheelSVG(){
  const pt=(a,r)=>[(Math.sin(a*Math.PI/180)*r).toFixed(2), (-Math.cos(a*Math.PI/180)*r).toFixed(2)];
  return `<svg class="wheel" viewBox="-110 -110 220 220" aria-hidden="true"><g id="wheelrot">${wheelSegs().map(sg=>{ const [x0,y0]=pt(sg.a0,100), [x1,y1]=pt(sg.a1,100), large=sg.a1-sg.a0>180?1:0, mid=(sg.a0+sg.a1)/2, [lx,ly]=pt(mid,sg.a1-sg.a0<25?84:64);
      return `<path d="M0 0 L${x0} ${y0} A100 100 0 ${large} 1 ${x1} ${y1} Z" fill="${TIER_COL[sg.i]}" stroke="#fff" stroke-width="2"/><text x="${lx}" y="${ly}" transform="rotate(${(mid>90&&mid<270?mid+180:mid).toFixed(1)} ${lx} ${ly})" text-anchor="middle" dominant-baseline="central" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="900" font-size="${sg.a1-sg.a0<25?11:17}" fill="${sg.i===3?"#2a1f00":"#fff"}">${esc(sg.label)}</text>`; }).join("")}
    <circle r="14" fill="#111a2f" stroke="#fff" stroke-width="3"/></g></svg>`;
}
function spinState(r, now){
  const segs=wheelSegs(); let rot=0, out=[];
  r.spins.forEach((x,i)=>{ const sg=segs[x.tier]||segs[0], a=sg.a0+(0.12+0.76*(x.roll||0.5))*(sg.a1-sg.a0), base=((rot%360)+360)%360;
    const final = rot + 360*5 + (((360 - a - base)%360)+360)%360; out.push({from:rot, to:final}); rot=final; });
  const i = clamp(Math.floor((now - r.start)/SPIN_MS), 0, r.spins.length-1), t = now - r.start - i*SPIN_MS;
  const k = clamp(t/SPIN_TURN, 0, 1), e = 1-Math.pow(1-k,3), angle = t<0 ? 0 : out[i].from + (out[i].to-out[i].from)*e;
  return {i, t, angle, revealed: t>=SPIN_TURN, done: now >= r.start + r.spins.length*SPIN_MS};
}
function wheelPanelHTML(r){

  return `<section class="panel spinpanel"><h4>The wheel</h4>

let spinRaf=null, spinShown=-1;

    if(res.dataset.k!==key){ res.dataset.k=key;
      const why = x.why==="timeout" ? "timed out" : x.why==="wrong" ? "wrong answer" : x.why==="gaveup" ? "gave up" : "open slot";
      res.className="spinres"+(S.revealed?" t"+x.tier:"");
      res.innerHTML = S.t<0 ? `<div class="muted">Get ready…</div>` : S.revealed
        ? `<div class="eyebrow">${esc(G.players[x.p].team)} · ${x.where.startsWith("sub")?"bench":x.where}</div><div class="sname">${esc(x.name)}</div><div class="srate num">${x.rating}</div><div class="eyebrow">${esc(WHEEL_ODDS[x.tier]?.label||"")}</div>`

}

/* ============================================================
   Match viewer
   Every device replays the engine's match from the shared seed and
   tactics, then plays a highlights cut of it in real time: build-up,
   chances, set pieces and goals at true speed, with "time skip"
   cards in between. The kick-off time is shared, so both managers
   watch the same moment; 2x/4x and skip are local.
   ============================================================ */
let SIMCACHE=null, simBusy=null, simFail=null, PB=null, lastFeedCount=-1, lastBanner="", lastCard="", lastStatsAt=-1, lastRatIdx=-1;
let pbClock={rate:1, wall:null, pos:0};
let bannerHold={key:"", kind:"", until:0};
const BANNER_MS = {goal:3800, save:2400, wood:2400, pen:2600, red:3000, aura:3000, sub:2800, so:2200};
const MX=4, MY=3, WW=105+2*MX, WH=68+2*MY, TDT=0.1;
const COL = {A:"#2f5bff", B:"#e8322b", gkA:"#f2b705", gkB:"#21c7b8"};
const matchKey = () => G.id+":"+G.match.seed;
function ensureSim(){
  const m=G.match; if(!m || m.seed==null) return null;
  const key=matchKey();
  if(SIMCACHE && SIMCACHE.key===key) return SIMCACHE.sim;
  if(simBusy===key || simFail===key) return null;
  simBusy=key;
  runEngine(buildEngineInput(G, m.seed, m.tac)).then(sim=>{
    if(simBusy===key) simBusy=null;
    if(sim){ SIMCACHE={key, sim}; } else simFail=key;
    if(G && G.match && matchKey()===key){ PB=null; render(); }
  });
  return null;
}
// Shared clock until someone changes speed; after that a local clock that runs at 2x/4x through the football
// but always at real speed through the cards (time skips, half-time, full-time), so nothing flashes past.
function playPos(){
  const m=G.match;
  if(pbClock.wall==null) return (Date.now()+matchOffset-(m.kickoffAt||0))/1000;
  const now=Date.now(), dt=(now-pbClock.wall)/1000; pbClock.wall=now;
  const pb=PB, inCard = pb && pbClock.pos>=0 ? !!locate(pb, pbClock.pos).card : true;
  const holding = now < bannerHold.until;   // a goal or save announcement is on screen: play it at real speed
  const next = pbClock.pos + dt * (inCard || pbClock.pos<0 || holding ? 1 : pbClock.rate);
  // and don't cut away to a time-skip card until the announcement has finished
  if(holding && pb && !inCard && pbClock.pos>=0 && next<pb.total && locate(pb, next).card) return pbClock.pos;
  pbClock.pos = next;
  return pbClock.pos;
}
function setRate(rate){ const pos=playPos(); pbClock={rate, wall:Date.now(), pos}; }

/* ---------- highlights cut ---------- */
function possStart(R, k, back){ const po=R.PO[k]; let j=k; const lim=Math.max(0,k-back); while(j>lim && R.PO[j-1]===po && R.MD[j-1]===0) j--; return j; }
function nextLive(R, k, n){ for(let j=k;j<Math.min(n,k+700);j++) if(R.MD[j]===0) return j; return -1; }
function buildTimeline(sim, level){
  const R=sim.rec, ft=sim.ftTick, ht=sim.htTick, N=sim.ticks, LV=LEVELS[level]||LEVELS.extended, lv=level==="key"?0:level==="full"?2:1;
  const C=[];
  const add=(a,b,pr,must)=>{ a=Math.max(0,Math.round(a)); b=Math.min(ft-1,Math.round(b));
    if(a<ht && b>=ht){ if(ht-1-a>=15) C.push({a,b:ht-1,pr,must}); if(b-ht>=15) C.push({a:ht,b,pr,must}); return; }
    if(b-a>=15) C.push({a,b,pr,must}); };
  add(0, [70,100,140][lv], 9, true);
  add(ht, ht+[30,50,80][lv], 3, true);
  sim.events.forEach(e=>{
    const k=e.tick;

/* ---------- per-moment helpers ---------- */

  }
  x.fillStyle="rgba(255,255,255,.8)"; x.beginPath(); x.arc(X(52.5),Y(34),Math.max(1.5,.22*s),0,Math.PI*2); x.fill();

}

/* ---------- overlays ---------- */
function overlayAt(pb, k){
  let o=null;
  for(const e of pb.sim.events){
    if(e.tick>k) break;
    const age=k-e.tick;
    if(e.type==="goal" && age<42) o={kind:"goal", team:e.team, e};
    else if(e.type==="shot" && age<22 && ((SAVED.has(e.outcome)&&(e.big||e.pen)) || e.outcome==="post" || e.outcome==="bar")) o={kind:SAVED.has(e.outcome)?"save":"wood", team:e.team, e};
    else if(e.type==="penalty" && age<26) o={kind:"pen", team:e.team, e};
    else if(e.type==="red" && age<32) o={kind:"red", team:e.team, e};
    else if(e.type==="aura" && age<32 && e.tick>5) o={kind:"aura", team:e.team, e};
    else if(e.type==="sub" && age<30) o={kind:"sub", team:e.team, e};

}

}

function startPlayback(){ const loop=()=>{ frame(false); raf=requestAnimationFrame(loop); }; raf=requestAnimationFrame(loop); }

  drawPitch(pb, k);

  const cardKey = L.pre ? "pre"+Math.ceil(-pos) : L.card && L.card.type!=="cut" ? L.card.type+L.card.t0 : "";
  if(cardKey!==lastCard && vc){ lastCard=cardKey;
    if(L.pre){ vc.hidden=false; vc.className="vcard"; vc.innerHTML=`<div class="vc"><div class="vk">Kick-off in ${Math.ceil(-pos)}</div><div class="vs" style="font-size:.5em">${esc(LEVELS[m.level]?.label||"Extended")} · about ${Math.round(pb.total/60)} min</div></div>`; }
    else if(L.card && L.card.type!=="cut"){ vc.hidden=false; vc.className="vcard"; vc.innerHTML=cardHTML(pb, L.card); }

  on("#rematch","click",rematch);
  // team talk
  on("[data-tac]","input",e=>{ const el=e.currentTarget, k=el.dataset.tac, v=+el.value; const lab=document.querySelector(`[data-tv="${k}"]`); if(lab) lab.textContent=v;
    const panel=el.closest(".tacpanel"); if(panel && mySeat){ const t={...teamTactics(G,mySeat), [k]:v}; const svg=panel.querySelector("svg.shape"); if(svg) svg.outerHTML=shapeSVG(G.squads[mySeat].formation, t, mySeat); } });
  on("[data-tac]","change",e=>{ if(mySeat) commit(M.setTac(mySeat, e.currentTarget.dataset.tac, +e.currentTarget.value)); });
  on("[data-tacset]","click",e=>{ if(mySeat) commit(M.setTac(mySeat, e.currentTarget.dataset.tacset, e.currentTarget.dataset.v)); });
  on("[data-tacchk]","change",e=>{ if(mySeat) commit(M.setTac(mySeat, e.currentTarget.dataset.tacchk, !!e.currentTarget.checked)); });
  on("#tacreset","click",()=>{ if(mySeat) commit(M.resetTac(mySeat)); });
  on("#ready","click",()=>{ if(mySeat) commit(M.ready(mySeat,true)); });
  on("#startmatch","click",e=>{ if(!mySeat||!G||G.phase!=="prematch") return; e.currentTarget.disabled=true; e.currentTarget.textContent="Kicking off…"; runMatch(); });
  on("#unready","click",()=>{ if(mySeat) commit(M.ready(mySeat,false)); });
  on("[data-level]","click",e=>{ if(mySeat) commit(M.level(mySeat, e.currentTarget.dataset.level)); });
}
/* Start up last, once every function and variable above exists. */
function boot(){
  setInterval(tick, 400);   // start the clock first, so nothing below can stop it
  render();
  me.id = lsGet("dn_id") || ("p_" + Math.random().toString(36).slice(2,12)); lsSet("dn_id", me.id);
  if (configured) { try { db = makeDb(); sample = makeSample(); } catch(e) { console.warn(e); db = null; } }
  platformReady = true;
  if(db){
    unsubLobby = db.collection("lobby").orderBy("updatedAt","desc").limit(10).onSnapshot(s=>{ lobby=s.docs.map(d=>d.data()); if(!G) render(); }, e=>{ console.warn(e); canWrite=false; render(); });
    const h = (location.hash||"").replace("#","").toUpperCase();
    if(/^[A-Z0-9]{5}$/.test(h)) openGame(h);
  }
  render();
}
boot();
</script>
