<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Draft Night FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700&family=DotGothic16&display=swap">
<style>
/* Layout: sticker-album matchday program. Category card + timer up top, two team "album pages" (pitches with sticker cards) side by side, action panel between. */
:root{
  --paper:#e9edf4; --paper-2:#dde3ee; --card:#ffffff; --ink:#111a2f; --muted:#5a6479; --rule:#c6cedd;
  --cobalt:#1d3fc4; --cobalt-soft:#dfe5fb; --saffron:#f2b705; --saffron-ink:#5b4300; --red:#d22f2a; --red-soft:#fbe1df;
  --ok:#147a3e; --ok-soft:#dcf1e3; --warn:#a85c00;
  --pitch:#2d7a47; --pitch-2:#286f40; --chalk:rgba(255,255,255,.72);
  --shadow:0 1px 0 rgba(17,26,47,.06),0 6px 18px -10px rgba(17,26,47,.35);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --dot:"DotGothic16",ui-monospace,"Courier New",monospace;
  --teamA:var(--cobalt); --teamB:var(--red);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0c1222; --paper-2:#121a2e; --card:#18223b; --ink:#e7ebf5; --muted:#9aa5bd; --rule:#2a3655;
  --cobalt:#7d96ff; --cobalt-soft:#1c2a5c; --saffron:#f6c437; --saffron-ink:#2a1f00; --red:#ff6a63; --red-soft:#4a1d1c;
  --ok:#4fd185; --ok-soft:#163a26; --warn:#ffb050;
  --pitch:#1f5e37; --pitch-2:#1b5531; --chalk:rgba(255,255,255,.55);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c1222; --paper-2:#121a2e; --card:#18223b; --ink:#e7ebf5; --muted:#9aa5bd; --rule:#2a3655;
  --cobalt:#7d96ff; --cobalt-soft:#1c2a5c; --saffron:#f6c437; --saffron-ink:#2a1f00; --red:#ff6a63; --red-soft:#4a1d1c;
  --ok:#4fd185; --ok-soft:#163a26; --warn:#ffb050;
  --pitch:#1f5e37; --pitch-2:#1b5531; --chalk:rgba(255,255,255,.55);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding:0 16px 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px;border-bottom:2px solid var(--ink);margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:34px;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
.brand h1 span{color:var(--cobalt)}
.brand .tag{font-family:var(--dot);font-size:13px;color:var(--muted)}
.mast .who{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--paper-2);color:var(--ink)}
.pill.a{background:var(--cobalt-soft);color:var(--cobalt)}
.pill.b{background:var(--red-soft);color:var(--red)}
.pill.gold{background:var(--saffron);color:var(--saffron-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}

.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;letter-spacing:.02em}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.blue{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.gold{background:var(--saffron);border-color:var(--saffron);color:var(--saffron-ink)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{border:2px solid var(--rule);background:var(--card);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.field input:focus,.field select:focus{border-color:var(--cobalt);outline:none}
.notice{border:2px dashed var(--rule);border-radius:12px;padding:14px 16px;background:var(--card)}
.notice.bad{border-color:var(--red);background:var(--red-soft)}

/* Lobby */
.lobby{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:start}
@media (max-width:860px){.lobby{grid-template-columns:1fr}}
.hero{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:grid;gap:18px}
.hero h2{font-size:clamp(34px,6vw,58px);font-weight:900;text-transform:uppercase;line-height:.92}
.hero h2 em{font-style:normal;color:var(--red)}
.hero p{margin:0;max-width:60ch}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
@media (max-width:620px){.formrow{grid-template-columns:1fr}}
.list{display:grid;gap:10px}
.gamecard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);flex-wrap:wrap}
.gamecard .code{font-family:var(--dot);font-size:20px;letter-spacing:.12em}
.gamecard .vs{font-weight:700;min-width:0}
.rules{background:var(--card);border-radius:14px;padding:4px 16px;box-shadow:var(--shadow)}
.rules summary{cursor:pointer;font-weight:700;padding:12px 0}
.rules ul{margin:0 0 14px;padding-left:18px;display:grid;gap:5px}
.dicetable{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin-bottom:14px}

/* Dice (d10) */
.die{width:46px;height:46px;flex:none;display:block}
.die.sm{width:30px;height:30px}
.die .face{fill:var(--card);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.die .edge{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:.45}
.die text{font-family:var(--display),Impact,sans-serif;font-weight:900;font-size:17px;fill:var(--ink)}
.die.gold .face{fill:var(--saffron);stroke:var(--saffron-ink)}
.die.gold text{fill:var(--saffron-ink)} .die.gold .edge{stroke:var(--saffron-ink)}
.die.roll{animation:roll .7s cubic-bezier(.3,1.5,.6,1)}
@keyframes roll{0%{transform:rotate(-200deg) scale(.4)}100%{transform:none}}

/* Game header: category board */
.board{display:grid;grid-template-columns:1fr auto;gap:16px;background:var(--ink);color:var(--paper);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.board .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.board .cat{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.2vw,44px);line-height:1;margin:10px 0 6px;text-wrap:balance}
.board .hint{opacity:.75;font-size:14px;max-width:70ch}
.board .dicefx{display:flex;gap:12px;align-items:center;margin-top:12px;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;width:fit-content;max-width:100%}
.board .dicefx b{font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.board .die .face{fill:var(--paper);stroke:var(--paper)}
.board .die text{fill:var(--ink)} .board .die .edge{stroke:var(--ink)}
.board .die.gold .face{fill:var(--saffron);stroke:var(--saffron)}
.board .die.gold text{fill:var(--saffron-ink)}
.timer{width:118px;height:118px;position:relative;flex:none;align-self:center}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--dot);font-size:34px}
.timer .t small{display:block;font-size:11px;font-family:var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-top:-26px}
.timer.low .t{color:var(--saffron)}
@media (max-width:620px){.board{grid-template-columns:1fr}.timer{width:92px;height:92px;justify-self:end;margin-top:-6px}.timer .t{font-size:26px}}

/* Arena */
.arena{display:grid;grid-template-columns:1fr minmax(280px,360px) 1fr;gap:16px;margin-top:16px;align-items:start}
@media (max-width:1060px){.arena{grid-template-columns:1fr 1fr}.arena .panel{grid-column:1/-1;order:-1}}
@media (max-width:700px){.arena{grid-template-columns:1fr}}
.arena.two{grid-template-columns:1fr 1fr}
@media (max-width:700px){.arena.two{grid-template-columns:1fr}}
.team{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:grid;gap:12px;min-width:0}
.team header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.team h3{font-size:26px;text-transform:uppercase;font-weight:900}
.team.a h3{color:var(--teamA)} .team.b h3{color:var(--teamB)}
.team .sub{font-size:12px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1.5px solid var(--rule);border-radius:8px;padding:4px 8px;max-width:100%;min-width:0;overflow-wrap:anywhere}
.chip b{font-weight:700}
.chip.none{border-style:dashed;color:var(--muted)}

/* Mini pitch with stickers */
.pitchbox{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(0deg,var(--pitch) 0 10%,var(--pitch-2) 10% 20%)}
.pitchbox svg.lines{position:absolute;inset:0;width:100%;height:100%}
.sticker{position:absolute;transform:translate(-50%,-50%);width:23%;max-width:96px;min-height:48px;background:var(--card);color:var(--ink);border-radius:7px;padding:4px 4px 3px;text-align:center;box-shadow:0 3px 8px -3px rgba(0,0,0,.6);display:grid;gap:1px;line-height:1.05}
.sticker .pos{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.sticker .nm{font-family:var(--display);font-weight:800;font-size:15px;text-transform:uppercase;overflow-wrap:anywhere}
.sticker .nat{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sticker .rt{position:absolute;top:-7px;right:-6px;background:var(--ink);color:var(--paper);font-family:var(--dot);font-size:11px;border-radius:6px;padding:1px 4px}
.sticker.open{background:rgba(255,255,255,.12);border:2px dashed var(--chalk);color:#fff;box-shadow:none}
.sticker.open .pos{color:#fff}
.sticker.empty{background:rgba(0,0,0,.28);border:2px dashed var(--red);color:#fff;box-shadow:none}
.sticker.empty .pos,.sticker.empty .nat{color:#ffd2cf}
.sticker.gold{background:linear-gradient(135deg,#fff4c2 0%,#f2b705 35%,#fff3b8 55%,#d99a00 80%,#fff1a8 100%);color:#2a1f00;background-size:200% 200%;animation:foil 5s ease-in-out infinite}
.sticker.gold .pos,.sticker.gold .nat{color:#5b4300}
@keyframes foil{50%{background-position:100% 100%}}
.sticker.meme{background:repeating-linear-gradient(45deg,var(--card) 0 6px,var(--paper-2) 6px 12px)}
.sticker .tagm{font-size:8px;font-weight:800;letter-spacing:.12em;color:var(--red)}
.sticker.cap::after{content:"C";position:absolute;top:-7px;left:-6px;background:var(--saffron);color:var(--saffron-ink);font-weight:800;font-size:10px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center}
.sticker.pickable{cursor:pointer;outline:2px solid var(--saffron);outline-offset:1px}
.sticker.pickable.sel{background:var(--saffron);color:var(--saffron-ink);border-style:solid}
.bench{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bench .sticker{position:relative;transform:none;width:auto;max-width:none;left:auto;top:auto}
.bench .sticker.open{background:var(--paper-2);border-color:var(--rule);color:var(--muted)}
.bench .sticker.open .pos{color:var(--muted)}
.chem{font-size:12px;color:var(--muted)}

/* Action panel */
.panel{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:grid;gap:14px;border-top:6px solid var(--ink)}
.panel.mine{border-top-color:var(--saffron)}
.panel h4{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:0;font-weight:800}
.ruling{border-radius:12px;padding:12px;display:grid;gap:6px}
.ruling.yes{background:var(--ok-soft)} .ruling.no{background:var(--red-soft)} .ruling.unk{background:var(--paper-2)}
.ruling .verdict{font-family:var(--display);font-size:26px;font-weight:900;text-transform:uppercase}
.ruling.yes .verdict{color:var(--ok)} .ruling.no .verdict{color:var(--red)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.spin{width:22px;height:22px;border:3px solid var(--rule);border-top-color:var(--cobalt);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.log{max-height:260px;overflow:auto;display:grid;gap:6px;font-size:13px;padding-right:4px}
.log div{border-left:3px solid var(--rule);padding-left:8px}
.log div.a{border-color:var(--teamA)} .log div.b{border-color:var(--teamB)}
.slotgrid{display:flex;flex-wrap:wrap;gap:6px}
.slotbtn{border:2px solid var(--rule);background:var(--paper);border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px}
.slotbtn.sel{background:var(--saffron);border-color:var(--saffron);color:var(--saffron-ink)}

/* Match */
.matchtop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--ink);color:var(--paper);border-radius:16px;padding:12px 16px}
.matchtop .tn{font-family:var(--display);font-weight:900;font-size:clamp(18px,3vw,30px);text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.matchtop .tn.r{text-align:right}
.score{font-family:var(--dot);font-size:clamp(34px,6vw,54px);display:flex;gap:10px;align-items:center;justify-content:center}
.score .clk{font-size:14px;background:var(--saffron);color:var(--saffron-ink);border-radius:6px;padding:2px 8px}
.pitchwrap{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.pitchwrap svg{display:block;width:100%;height:auto}
.goalbanner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.goalbanner div{font-family:var(--display);font-weight:900;font-size:clamp(48px,11vw,130px);color:#fff;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 6px 0 rgba(0,0,0,.35);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.goalbanner div small{display:block;font-size:.26em;text-align:center;letter-spacing:.08em}
.goalbanner .bn{font-size:clamp(30px,6vw,70px)}
.goalbanner .redcard{display:inline-block;width:.5em;height:.7em;background:#e0261f;border-radius:4px;margin-right:.25em;vertical-align:-.05em;box-shadow:0 3px 0 rgba(0,0,0,.35);transform:rotate(-8deg)}
.subboard{display:grid;gap:8px;background:#111;border:3px solid #333;border-radius:10px;padding:10px 14px;font-family:var(--dot);text-shadow:none;text-transform:none;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.goalbanner .subboard{font-size:clamp(14px,2.4vw,22px);font-weight:700;letter-spacing:.02em}
.subboard .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.subboard .tm{color:#fff;border-radius:6px;padding:2px 8px;font-family:var(--sans,inherit);font-size:.75em}
.goalbanner .subboard div{font-size:inherit;text-transform:none;text-shadow:none;animation:none;color:inherit;letter-spacing:inherit}
.subboard .in{color:#5ee37a}.subboard .out{color:#ff6a63}
.feed .ev.sub .m{color:var(--cobalt)}
@keyframes pop{from{transform:scale(.3) rotate(-6deg);opacity:0}}
.matchgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px;align-items:start}
@media (max-width:860px){.matchgrid{grid-template-columns:1fr}}
.feed{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:grid;gap:8px;max-height:460px;overflow:auto}
.feed .ev{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:14px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.feed .ev .m{font-family:var(--dot);color:var(--muted)}
.feed .ev.goal{background:var(--saffron);color:var(--saffron-ink);border-radius:10px;padding:8px;border:0}
.feed .ev.goal .m{color:var(--saffron-ink)}
.feed .ev.red .m{color:var(--red)}
.dossier{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:grid;gap:10px}
.dossier h4{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:0}
.dossier p{margin:0;max-width:68ch}
.rolls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.roll{background:var(--paper);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:13px}
.statt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.statt td{padding:6px 4px;border-bottom:1px solid var(--rule);text-align:center}
.statt td:first-child,.statt td:last-child{font-weight:700;width:30%}
.pens{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pens i{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid var(--ink)}
.pens i.y{background:var(--ok);border-color:var(--ok)} .pens i.n{background:var(--red);border-color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.poss{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--rule)}
.poss i{display:block;height:100%;transition:width .6s}
/* Match viewer */
@media (max-width:620px){.matchtop .tsub{display:none}.matchtop .tn{font-size:18px}}
.matchtop .tn{overflow-wrap:break-word}
.matchtop .tsub{font-family:var(--body);font-weight:600;font-size:12px;text-transform:none;opacity:.75;margin-top:4px;letter-spacing:0}
.pensline{font-family:var(--dot);font-size:13px;text-align:center;min-height:1em;margin-top:2px}
.pitchwrap canvas{display:block;width:100%;height:auto;aspect-ratio:113/74;background:var(--pitch)}
.hltag{position:absolute;left:10px;top:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:6px;pointer-events:none}
.vcard{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,12,24,.62);color:#fff;text-align:center;padding:16px;animation:fade .25s ease-out}
.vcard.cut{background:rgba(8,12,24,.85)}
.vc{display:grid;gap:8px;justify-items:center;max-width:640px}
.vc .vk{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(28px,6vw,64px);line-height:1}
.vc .vs{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.6vw,38px);text-transform:uppercase}
.vc ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;font-size:clamp(12px,1.8vw,16px);text-align:left}
.vc li{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vc .m{font-family:var(--dot);opacity:.8;min-width:38px}
.vc .tm,.subboard .tm{color:#fff;border-radius:6px;padding:1px 8px;font-size:.85em;font-weight:700}
.vc .in,.rrow .in{color:#5ee37a}.vc .out,.rrow .out{color:#ff6a63}
@keyframes fade{from{opacity:0}}
.mombox{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:8px 12px 10px;margin-top:10px}
.mombox svg{display:block;width:100%;height:64px;border-radius:6px;margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:0;border:2px solid var(--rule);border-radius:10px;overflow:hidden;width:fit-content;max-width:100%}
.seg button{border:0;background:var(--card);padding:7px 12px;font-weight:700;font-size:13px;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button.sel{background:var(--ink);color:var(--paper)}

.tacpanel .slh b{font-family:var(--dot);font-size:16px}
.tacpanel .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

.tacpanel.b input[type=range]{accent-color:var(--red)}
.tog{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px}
.tog input{width:18px;height:18px;accent-color:var(--cobalt)}
svg.shape{display:block;width:100%;height:auto;border-radius:10px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.rgrid{grid-template-columns:1fr}}
.rrow{display:grid;grid-template-columns:34px 1fr auto;gap:6px;align-items:center;font-size:13px;padding:3px 0;border-bottom:1px solid var(--rule)}
.rrow.off{opacity:.55}
.rrow .rv{font-family:var(--dot);font-size:13px;background:var(--paper-2);border-radius:5px;text-align:center;padding:1px 0}
.rrow .rv.hi{background:var(--ok-soft);color:var(--ok)} .rrow .rv.lo{background:var(--red-soft);color:var(--red)}
.rrow .rn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rrow .ri{font-size:12px;white-space:nowrap}
.statt.ls td{padding:5px 4px}

.lsl{font-size:12px;color:var(--muted);font-weight:600}
.lsb{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--rule);margin-top:3px;gap:2px}
.lsb i{display:block;height:100%}
.feed .ev.tac .m{color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}

function chemLinks(sq){

  const links=[];

    const ca=(a.clubs||[]).map(norm), cb=(b.clubs||[]).map(norm);

  })().catch(e=>console.warn("prep",e)).finally(()=>{ prepRunning=null; });
  return prepRunning;
}


/* Templated commentary (used when Claude isn't available, and for minor moments) */
function templLine(e, sim){
  const tn = p => G?.players?.[p]?.team || p;
  const n = id => surnameOf(sim, id);
  const has = m => (e.method||[]).includes(m);
  switch(e.type){
    case "kickoff": return "We're under way.";
    case "ht": return `Half-time: ${tn("A")} ${e.score.A}–${e.score.B} ${tn("B")}.`;
    case "ft": return `Full-time: ${tn("A")} ${e.score.A}–${e.score.B} ${tn("B")}.`;
    case "sub": return `${n(e.p)} comes on for ${n(e.out)}.${e.tactical?" An attacking change.":""}`;
    case "yellow": return e.second ? `Second yellow for ${n(e.p)}.` : `Yellow card for ${n(e.p)}.`;
    case "red": return e.second ? `${n(e.p)} picks up a second yellow and he's off!` : `Straight red! ${n(e.p)} is sent off.`;
    case "penalty": return `Penalty! ${n(e.victim)} is brought down by ${n(e.p)}.`;
    case "aura": return `Aura: ${e.name}. ${AURA_TRIGGERS[e.trigger]||""}.`;
    case "tactic": return e.kind==="protect" ? `${tn(e.team)} drop deeper to protect the lead.` : e.kind==="allout" ? `${tn(e.team)} throw everything forward.` : `${tn(e.team)} push more men forward, chasing the game.`;
    case "shootout": return `${n(e.p)} ${e.scored?"scores":"misses"}. Shootout: ${e.score.A}–${e.score.B}.`;
    case "goal": {
      const sc=n(e.p), as=n(e.assist), score=` (${e.score.A}–${e.score.B})`;
      if(e.og) return `Own goal! ${sc} turns it into his own net${score}.`;
      if(has("penalty")) return `${sc} sends the keeper the wrong way from the spot${score}.`;
      if(has("free kick")) return `${sc} curls the free kick into the net${score}!`;
      if(has("header")) return `${as?as+" delivers and ":""}${sc} heads it in${score}!`;
      if(has("counter")) return `A lightning counter-attack, finished by ${sc}${score}.`;
      if(has("through ball")) return `${as||"A defence-splitting pass"} slides ${sc} through, and he finishes${score}.`;
      if(has("cut-back")) return `${as} pulls it back and ${sc} sweeps it home${score}.`;
      if(has("cross")) return `${as} whips in a cross and ${sc} converts${score}.`;
      if(has("long range")) return `${sc} lets fly from distance and it flies in${score}!`;
      if(has("rebound")) return `${sc} pounces on the rebound${score}.`;
      if(has("one-on-one")) return `${sc} goes one-on-one and makes no mistake${score}.`;
      if(has("solo run")) return `${sc} beats his man and finishes${score}.`;
      return `GOAL! ${sc} scores${score}.`;
    }
    case "shot": {
      const p=n(e.p), k=n(e.keeper)||"the keeper";
      if(e.pen) return SAVED.has(e.outcome) ? `${k} saves ${p}'s penalty!` : `${p} misses the penalty!`;
      if(e.outcome==="post") return `${p} hits the post!`;
      if(e.outcome==="bar") return `${p} smashes it off the crossbar!`;
      if(SAVED.has(e.outcome)) return e.big ? `Huge chance for ${p}, but ${k} makes a brilliant save.` : e.outcome==="caught" ? `${k} gathers ${p}'s effort.` : `${p} forces a save from ${k}.`;
      if(e.outcome==="blocked") return `${p}'s shot is blocked.`;
      return e.big ? `${p} should score, but puts it ${e.outcome==="over"?"over":"wide"}.` : `${p} fires ${e.outcome==="over"?"over the bar":"wide"}.`;
    }
  }
  return "";
}

/* Claude-written dossier + commentary for the engine's match */
async function writeReport(st, input, sim){
  if(!sample) return null;
  const tacText = t => `press ${t.press}/10, line ${t.line}/10, width ${t.width}/10, tempo ${t.tempo}/10, mentality ${t.mentality}/10, ${t.buildUp} build-up, ${t.fullbacks} full-backs${t.counter?", counter-attacks":""}`;
  const team = p => { const sq=st.squads[p], ti=input.teams[p]; return {
    name: st.players[p].team, formation: sq.formation, manager: sq.manager?.name ? `${sq.manager.name} (${sq.manager.style||"pragmatic"})` : "none", tactics: tacText(ti.tactics),
    stadium: sq.stadium?.name||"none", aura: sq.aura?.name? `${sq.aura.name} (${sq.aura.effect||""})`:"none", captain: sq.captain,
    xi: slotsOf(sq.formation).map(s=>{ const v=sq.slots[s.k]; return `${s.k}: ${v&&v.name?v.name+(v.isMeme?" [58-rated filler]":"")+(v.golden?" [golden form]":"")+(v.tags?.length?` {${v.tags.join(", ")}}`:"")+` (${v.rating||"?"})`:"EMPTY"}`; }),
    bench: sq.subs.map(v=>v&&v.name?v.name:"empty"), chemistry: chemLinks(sq).slice(0,8).map(l=>`${l.a.k}-${l.b.k} (${l.why.join(", ")})`) }; };
  const idx = keyEventIdx(sim);
  const evs = idx.map(i=>{ const e=sim.events[i]; const o={i, min:minLabel(sim,e), type:e.type, team:e.team?st.players[e.team].team:""};
    if(e.p!=null) o.player=fullOf(sim,e.p); if(e.assist!=null) o.assist=fullOf(sim,e.assist); if(e.out!=null) o.off=fullOf(sim,e.out); if(e.keeper!=null) o.keeper=fullOf(sim,e.keeper); if(e.victim!=null) o.fouled=fullOf(sim,e.victim);
    if(e.method?.length) o.how=e.method.join(", "); if(e.xg!=null) o.xg=e.xg; if(e.outcome) o.outcome=e.outcome; if(e.score) o.score=`${e.score.A}-${e.score.B}`; if(e.name) o.aura=e.name; if(e.kind) o.kind=e.kind; if(e.og) o.ownGoal=true; if(e.second) o.secondYellow=true;
    return o; });
  const top = side => sim.ents.filter(p=>p.team===side && p.played).sort((a,b)=>b.rating-a.rating).slice(0,3).map(p=>`${p.name} ${p.rating}`);
  const motm = sim.motm!=null ? sim.ents[sim.motm].name : "";
  const prompt = `Write the match material for a simulated football match in a draft game between two friends. Players appear in their prime. Be vivid, specific and knowledgeable about the real players and managers, but brief.

PRE-MATCH ROLLS: ${JSON.stringify(sim.rolls)}
TEAM A: ${JSON.stringify(team("A"))}
TEAM B: ${JSON.stringify(team("B"))}
KEY MOMENTS (already decided by the match engine; do not change them): ${JSON.stringify(evs)}
FINAL: ${st.players.A.team} ${sim.final.A}-${sim.final.B} ${st.players.B.team}${sim.pens?` (penalties ${sim.pens.A}-${sim.pens.B})`:""}
STATS: ${JSON.stringify(sim.stats)}
TOP RATINGS: ${st.players.A.team}: ${top("A").join(", ")}; ${st.players.B.team}: ${top("B").join(", ")}. Player of the match: ${motm}.

Reply with only JSON:
{"headline":"A pre-match headline that does NOT reveal the result","dossier":["3 short paragraphs of pre-match scouting: how each manager's tactics will shape the game (pressing, line, full-backs, build-up), the key strengths and weak spots (filler picks, golden players, chemistry, playstyles), the conditions. Must NOT hint at the result."],"keyBattles":["3 one-sentence matchups"],"lines":{"<i>":"one commentary sentence for that key moment"},"verdict":"2-3 sentences explaining why the match went the way it did, mentioning tactics and momentum"}
Write a line for EVERY key moment, keyed by its "i". Keep each line under 26 words. Describe how goals were scored using "how".`;
  try{
    const res = await sample.json(prompt, {modelTier:"default", cache:false});
    if(res && typeof res==="object"){ if(res.lines && typeof res.lines==="object"){ const L={}; for(const k in res.lines) if(String(res.lines[k]).trim()) L[k]=String(res.lines[k]).slice(0,240); res.lines=L; } return res; }
  }catch(e){ console.warn("report", e); }
  return null;
}

// Which seat runs the match + commentary: one whose device can reach Claude.
function simRunner(){ const ok=G.refOk||{}; if(ok.A!==false) return "A"; if(ok.B!==false) return "B"; return "A"; }

function afterState(prev){
  if(!G) return;
  if(G.phase==="draft" && G.round?.step==="judging" && G.round.pending?.judge===mySeat) runJudge();
  if(G.phase==="prematch" && mySeat){
    if(!G.pre){ const k="pi"+G.id; if(!fired[k]){ fired[k]=1; commit(st=>{ if(st.phase!=="prematch"||st.pre) return false; fillEmpties(st); st.tac={A:{},B:{}}; st.pre={ready:{A:false,B:false}, level:"extended", levelBy:null, deadline:Date.now()+PREMATCH_MS, prep:"pending"}; }); } }
    else if(G.pre.prep!=="done" && mySeat===simRunner()){ const k="prep"+G.id+G.pre.deadline; if(!fired[k]){ fired[k]=1; prepSquads(); } }
  }
  if(G.phase==="match" && prev?.phase!=="match"){ matchOffset=0; PB=null; pbClock={rate:1,wall:null,pos:0}; }
  if(G.phase==="match" && !raf) startPlayback();
}

function tick(){
  updateTimerUI();
  if(!G || !mySeat || !canWrite) return;
  const now=Date.now();
  if(G.phase==="draft" && G.round){
    const r=G.round, turn=r.turns[r.ti], mine=turn.p===mySeat;
    if(r.step==="pick" && now > r.deadline + (mine?300:5000)){ const k="to"+r.key; if(!fired[k]){ fired[k]=1; commit(M.timeout(r.key)); } }
    if(r.step==="review" && now > r.reviewDeadline + (mine?5000:300)){ const k="rv"+r.key; if(!fired[k]){ fired[k]=1; commit(M.resolve(r.key,"accept",other(turn.p))); } }
    if(r.step==="judging" && r.pending && now - r.pending.at > 75000){ const k="un"+r.key+(r.pending.tried||[]).length; if(!fired[k]){ fired[k]=1; commit(M.handoff(r.key, r.pending.judge, "timeout")); } }
  }
  if(G.phase==="prematch" && G.pre){
    const both=G.pre.ready.A&&G.pre.ready.B, at = both ? Math.min(G.pre.readyAt||now, G.pre.deadline) : G.pre.deadline;
    const delay = mySeat===simRunner() ? (both?600:0) : 20000;
    if(now > at + delay){ const k="sim"+G.id+G.pre.deadline+":"+(G.pre.attempt||0); if(!fired[k]){ fired[k]=1; runMatch(); } }
  }
  if(G.phase==="report" && G.reportStartedAt && now-G.reportStartedAt>150000){ const k="rp"+G.reportStartedAt; if(!fired[k]){ fired[k]=1; commit(st=>{ if(st.phase!=="report"||Date.now()-st.reportStartedAt<150000) return false; st.phase="prematch"; if(st.pre){ st.pre.attempt=(st.pre.attempt||0)+1; st.pre.deadline=Date.now()+20000; } pushLog(st,"The match host dropped out. Restarting kick-off."); }); } }
}

async function submitPick(){
  if(!G||!G.round) return;
  const r=G.round, turn=r.turns[r.ti]; if(turn.p!==mySeat||r.step!=="pick") return;
  const name = ($("#pick")?.value||"").trim();
  const err = $("#pickerr"); const say = t=>{ if(err) err.textContent=t; };
  if(!name){ say("Type a name first."); return; }
  let slot = null;
  if(r.kind==="starter"){ slot=uiSel.slot; if(!slot){ say("Choose which slot he plays in."); return; } if(G.squads[mySeat].slots[slot]!==null){ say("That slot is already filled. Choose an open one."); return; } }
  if(r.kind==="bonus") slot=turn.slot;
  await commit(M.beginJudging(r.key, mySeat, name, slot));
}
async function submitCaptain(name){ if(!G?.round) return; await commit(M.captain(G.round.key, mySeat, name)); }
async function review(action){ if(!G?.round) return; await commit(M.resolve(G.round.key, action, mySeat)); }

async function runMatch(){
  if(!G || G.phase!=="prematch") return;
  try{ const l = await gameRef.acquire({holder:me.id, ttlMs:180000}); if(!l.acquired) return; }catch(e){}
  const ok0 = await commit(st=>{ if(st.phase!=="prematch") return false; st.phase="report"; st.reportStartedAt=Date.now(); pushLog(st,"The teams are out. Simulating the match and writing the dossier."); });
  if(!ok0) return;
  if(prepRunning) await prepRunning;
  const fresh = structuredClone((await gameRef.get()).data()); if(!fresh || fresh.phase!=="report") return;
  const {need, mgrs} = backfillNeeds(fresh);
  if(need.length || mgrs.length) await backfillSquads(fresh);
  const seed = (Math.floor(Math.random()*2**31)>>>0) || 7;
  const tac = {A:teamTactics(fresh,"A"), B:teamTactics(fresh,"B")};
  const input = buildEngineInput(fresh, seed, tac);
  const sim = await runEngine(input);
  if(!sim){ await commit(st=>{ if(st.phase!=="report") return false; st.phase="prematch"; pushLog(st,"The match engine failed to start. Trying again."); }); return; }
  SIMCACHE = {key: G.id+":"+seed, sim};
  const report = await writeReport(fresh, input, sim);
  await commit(st=>{ if(st.phase!=="report") return false;
    st.squads = fresh.squads;
    st.match = {v:ENGINE_VERSION, seed, tac, level: fresh.pre?.level||"extended", digest: sim.digest,
      final: sim.final, pens: sim.pens?{A:sim.pens.A, B:sim.pens.B}:null, winner: sim.winner, stats: sim.stats,
      motm: sim.motm!=null ? sim.ents[sim.motm].name : null, rolls: sim.rolls, report, kickoffAt: Date.now()+(report?25000:9000)};
    st.phase="match"; });
}
async function rematch(){
  await commit(st=>{
    if(st.phase!=="match" && st.phase!=="done") return false;
    const keep={A:st.players.A, B:st.players.B};
    st.history=[...(st.history||[]), {final:st.match?.final, pens:st.match?.pens?{A:st.match.pens.A,B:st.match.pens.B}:null, winner:st.match?.winner}].slice(-10);
    delete st.match; delete st.pre; delete st.tac; st.usedIds=[]; st.used={}; st.players=keep; st.log=[]; pushLog(st,"Rematch! New draft, new dice.");
    startDraft(st);
  });
  matchOffset=0; PB=null; SIMCACHE=null; if(raf) cancelAnimationFrame(raf); raf=null;
}

        <div style="font-size:14px">${esc(ai?ru.reason:"Claude couldn't rule on this one, so the opponent decides.")}${ai&&ru.searched?` <span style="opacity:.6;font-size:12px">· checked online</span>`:""}</div>

function updateTimerUI(){
  const el=$("#timer"); if(!el||!G) return;
  if(G.phase==="prematch" && G.pre){ const left=clamp(G.pre.deadline-Date.now(),0,PREMATCH_MS); $("#tnum").textContent=Math.ceil(left/1000); $("#tlabel").textContent="kick-off"; $("#tarc").setAttribute("stroke-dashoffset", String(276.5*(1-left/PREMATCH_MS))); el.classList.toggle("low", left<15000); return; }
  if(!G.round) return;
  const r=G.round; const now=Date.now();
  let left, total, label;
  if(r.step==="pick"){ left=r.deadline-now; total=pickMs(r); label="pick"; }
  else if(r.step==="review"){ left=r.reviewDeadline-now; total=REVIEW_MS; label="review"; }
  else { left=total=1; label="ref"; }
  left=clamp(left,0,total);
  const s = r.step==="judging" ? "··" : Math.ceil(left/1000);
  $("#tnum").textContent=s; $("#tlabel").textContent=label;
  $("#tarc").setAttribute("stroke-dashoffset", String(276.5*(1-left/total)));
  el.classList.toggle("low", r.step!=="judging" && left<10000);
}

/* ============================================================
   Team talk: tactics before kick-off
   ============================================================ */
const LEVELS = {key:{label:"Key moments", mins:3, budget:180, note:"Goals and the biggest chances"},
  extended:{label:"Extended", mins:6, budget:360, note:"Every real chance and its build-up"},
  full:{label:"Full highlights", mins:10, budget:600, note:"Long build-ups, set pieces and attacks"}};
const TAC_UI = [
 {k:"press", n:"Pressing", lo:"Sit off", hi:"Gegenpress"},
 {k:"line", n:"Defensive line", lo:"Deep block", hi:"High line"},
 {k:"width", n:"Width", lo:"Narrow", hi:"Wide"},
 {k:"tempo", n:"Tempo", lo:"Patient", hi:"Fast"},
 {k:"mentality", n:"Mentality", lo:"Defensive", hi:"All-out attack"}];
const BUILD_UI = {short:"Short", mixed:"Mixed", direct:"Direct"};
const FB_UI = {inverted:["Inverted","Tuck into midfield"], overlapping:["Overlapping","Run outside the winger"], wingbacks:["Wing-backs","Stay high and wide"], conservative:["Stay home","Hold the back line"]};
const STYLE_NAMES = {possession:"Possession", pressing:"High press", counter:"Counter-attack", pragmatic:"Pragmatic", direct:"Direct"};
function tacSummary(t){ const n=k=>t[k]; const bits=[];
  bits.push(n("press")>=8?"presses high":n("press")<=3?"sits off":"mid-block press");
  bits.push(n("line")>=8?"high line":n("line")<=3?"deep line":"");
  bits.push(FB_UI[t.fullbacks]?FB_UI[t.fullbacks][0].toLowerCase()+" full-backs":"");
  bits.push(t.buildUp==="short"?"plays out from the back":t.buildUp==="direct"?"goes long early":"");
  if(t.counter) bits.push("breaks fast");
  return bits.filter(Boolean).join(" · "); }
// An approximate picture of the in-possession shape these settings produce (mirrors the engine's positioning rules).
function shapeSVG(form, t, side){
  const n=k=>clamp(((+t[k]||5)-1)/9,0,1), Wd=68, Lg=105, C=34, bu=62, lerp=(a,b,f)=>a+(b-a)*f;
  const line=n("line"), ment=n("mentality"), width=n("width"), press=n("press"), fb=t.fullbacks;
  const def=clamp(15+22*line+0.5*(bu-30),12,58), front=Math.max(def+16, Math.min(def+34+14*ment, 97));
  const dots=slotsOf(form).map(s=>{
    if(s.g==="GK") return {k:s.k,u:6+6*line,v:C,gk:1};
    const q=clamp((s.y-19)/67,0,1), v0=s.x/100*Wd, sd=v0<C?-1:1, edge=sd<0?3:Wd-3;
    let u=def+q*(front-def), v=C+(v0-C)*(0.78+0.36*width);
    if(s.g==="FB"){ if(fb==="overlapping"){ u=Math.max(u,Math.min(bu+3,front-5)); v=lerp(v,edge,.7); } else if(fb==="wingbacks"){ u=Math.max(u,Math.min(bu+6,front-3),def+26); v=lerp(v,edge,.85); } else if(fb==="inverted"){ u=def+13; v=C+sd*10; } else u=def+2; }
    else if(s.g==="W"){ if(fb==="inverted") v=lerp(v,edge,.6); else if(fb==="overlapping"||fb==="wingbacks") v=lerp(v,C,.25); }
    else if(s.g==="DM"){ u=def+9; v=lerp(v,C,.5); }
    else if(s.g==="AM"){ if(Math.abs(v-C)>8) v=C+sd*10; }
    return {k:s.k,u:clamp(u,3,101),v:clamp(v,2,66)};
  });
  const col = side==="A" ? "#2f5bff" : "#e8322b", pz=36+54*press;
  return `<svg viewBox="-2 -2 109 79" class="shape" role="img" aria-label="Expected shape in possession and pressing zone">
    <rect x="-2" y="-2" width="109" height="79" style="fill:var(--pitch-2)"/>
    <rect x="0" y="0" width="${pz}" height="68" fill="rgba(242,183,5,.13)"/>
    <line x1="${pz}" y1="0" x2="${pz}" y2="68" stroke="#f2b705" stroke-width=".5" opacity=".8"/>
    <g fill="none" style="stroke:var(--chalk)" stroke-width=".5"><rect x="0" y="0" width="105" height="68"/><line x1="52.5" y1="0" x2="52.5" y2="68"/><circle cx="52.5" cy="34" r="9.15"/><rect x="0" y="13.84" width="16.5" height="40.32"/><rect x="88.5" y="13.84" width="16.5" height="40.32"/></g>
    <line x1="${def}" y1="1" x2="${def}" y2="67" stroke="#fff" stroke-width=".6" stroke-dasharray="1.5 1.5" opacity=".8"/>
    <text x="1" y="73.5" font-size="3.3" fill="#fff" opacity=".85" font-family="Archivo,sans-serif"><tspan fill="#f2b705">■</tspan> pressing zone · <tspan font-weight="700">┆</tspan> back line in possession</text>
    ${dots.map(d=>`<g transform="translate(${d.u.toFixed(1)},${clamp(d.v,3,63).toFixed(1)})"><circle r="2.3" fill="${d.gk?"#f2b705":col}" stroke="#fff" stroke-width=".6"/><text y="5.6" text-anchor="middle" font-size="2.8" fill="#fff" font-family="Archivo,sans-serif" font-weight="700">${d.k}</text></g>`).join("")}
    <text x="104" y="73.5" text-anchor="end" font-size="3.3" fill="#fff" opacity=".85" font-family="Archivo,sans-serif">attacking →</text>
  </svg>`;
}

      <div class="seg big">${Object.entries(LEVELS).map(([k,v])=>`<button type="button" class="${lv===k?"sel":""}" data-level="${k}" ${mySeat?"":"disabled"}><b>${v.label}</b><span>about ${v.mins} min · ${v.note}</span></button>`).join("")}</div>
      ${G.pre.levelBy?`<div class="muted" style="font-size:12px;margin-top:6px">Chosen by ${esc(G.players[G.pre.levelBy].team)}. Either of you can change it.</div>`:""}</div></section>
    <div class="arena two">${tacPanelHTML(left, !!mySeat)}${tacPanelHTML(right, false)}</div>
    <div class="arena two">${teamHTML(left)}${teamHTML(right)}</div>`;
}

/* ============================================================
   Match viewer
   Every device replays the engine's match from the shared seed and
   tactics, then plays a highlights cut of it in real time: build-up,
   chances, set pieces and goals at true speed, with "time skip"
   cards in between. The kick-off time is shared, so both managers
   watch the same moment; 2x/4x and skip are local.
   ============================================================ */
let SIMCACHE=null, simBusy=null, simFail=null, PB=null, lastFeedCount=-1, lastBanner="", lastCard="", lastStatsAt=-1, lastRatIdx=-1;
let pbClock={rate:1, wall:null, pos:0};
const MX=4, MY=3, WW=105+2*MX, WH=68+2*MY, TDT=0.1;
const COL = {A:"#2f5bff", B:"#e8322b", gkA:"#f2b705", gkB:"#21c7b8"};
const matchKey = () => G.id+":"+G.match.seed;
function ensureSim(){
  const m=G.match; if(!m || m.seed==null) return null;
  const key=matchKey();
  if(SIMCACHE && SIMCACHE.key===key) return SIMCACHE.sim;
  if(simBusy===key || simFail===key) return null;
  simBusy=key;
  runEngine(buildEngineInput(G, m.seed, m.tac)).then(sim=>{
    if(simBusy===key) simBusy=null;
    if(sim){ SIMCACHE={key, sim}; } else simFail=key;
    if(G && G.match && matchKey()===key){ PB=null; render(); }

}
function playPos(){ const m=G.match; return pbClock.wall==null ? (Date.now()+matchOffset-(m.kickoffAt||0))/1000 : pbClock.pos+(Date.now()-pbClock.wall)/1000*pbClock.rate; }
function setRate(rate){ const pos=playPos(); pbClock={rate, wall:Date.now(), pos}; }

/* ---------- highlights cut ---------- */
function possStart(R, k, back){ const po=R.PO[k]; let j=k; const lim=Math.max(0,k-back); while(j>lim && R.PO[j-1]===po && R.MD[j-1]===0) j--; return j; }
function nextLive(R, k, n){ for(let j=k;j<Math.min(n,k+700);j++) if(R.MD[j]===0) return j; return -1; }
function buildTimeline(sim, level){
  const R=sim.rec, ft=sim.ftTick, ht=sim.htTick, N=sim.ticks, LV=LEVELS[level]||LEVELS.extended, lv=level==="key"?0:level==="full"?2:1;
  const C=[];
  const add=(a,b,pr,must)=>{ a=Math.max(0,Math.round(a)); b=Math.min(ft-1,Math.round(b));
    if(a<ht && b>=ht){ if(ht-1-a>=15) C.push({a,b:ht-1,pr,must}); if(b-ht>=15) C.push({a:ht,b,pr,must}); return; }
    if(b-a>=15) C.push({a,b,pr,must}); };
  add(0, [70,100,140][lv], 9, true);
  add(ht, ht+[30,50,80][lv], 3, true);
  sim.events.forEach(e=>{
    const k=e.tick;
    if(e.type==="goal"){ const st=e.shotTick??k, s0=possStart(R, st, [160,240,320][lv]); add(Math.min(s0-25, st-70), k+[42,50,60][lv], 100, true); }
    else if(e.type==="shot" && e.outcome!=="goal"){
      if(k>=ft) return;
      const pr = e.xg + (SAVED.has(e.outcome)?0.12:0) + (e.outcome==="post"||e.outcome==="bar"?0.3:0) + (e.big?0.25:0) + (e.pen?0.6:0);
      const s0=possStart(R, e.shotTick, [90,150,230][lv]); add(Math.min(s0-15, e.shotTick-45), k+26, pr*10, e.pen); }
    else if(e.type==="penalty") add(k-55, k+25, 9, true);
    else if(e.type==="red") add(k-55, k+30, 8, true);
    else if(e.type==="yellow" && lv>=1) add(k-35, k+18, 0.9);
    else if(e.type==="attack" && lv>=1) add(k-[0,90,160][lv], k+40, lv===2?0.7:0.35);
    else if(e.type==="corner" && lv>=1){ const t=nextLive(R,k,ft); if(t>0) add(t-28, t+55, lv===2?1.1:0.6); }
    else if(e.type==="aura" && k<ft && k>5) add(k-20, k+40, 2.2);
  });
  C.sort((x,y)=>(y.must?1e9:y.pr)-(x.must?1e9:x.pr) || x.a-y.a);
  const merge=list=>{ const s=[...list].sort((x,y)=>x.a-y.a), out=[];
    for(const w of s){ const l=out[out.length-1]; if(l && w.a<=l.b+40 && !(l.b<ht && w.a>=ht)) l.b=Math.max(l.b,w.b); else out.push({a:w.a,b:w.b}); } return out; };
  const len=list=>merge(list).reduce((t,w)=>t+w.b-w.a,0);
  const sel=[], budget=LV.budget*10*0.9;
  for(const c of C){ sel.push(c); if(!c.must && len(sel)>budget) sel.pop(); }
  const W=merge(sel);
  // the timeline: footage segments with cards between them
  const segs=[]; let t=0, prevB=null;
  const notable=(a,b)=>sim.events.filter(e=>e.tick>a && e.tick<=b && (e.type==="sub"||e.type==="yellow"||e.type==="red"||e.type==="aura"||e.type==="tactic"));
  const card=(type,dur,o)=>{ segs.push({kind:"card", type, t0:t, dur, ...o}); t+=dur; };
  for(const w of W){
    if(prevB!=null){
      const evs=notable(prevB,w.a);
      if(prevB<ht && w.a>=ht) card("ht", 3.4, {from:prevB, to:w.a, evs});
      else { const gap=R.CL[w.a]-R.CL[prevB]; if(gap>40 || evs.length) card("skip", Math.min(4.2, 1.5+0.5*evs.length), {from:prevB, to:w.a, evs}); else card("cut", 0.4, {from:prevB, to:w.a}); }
    }
    segs.push({kind:"play", a:w.a, b:w.b, t0:t, dur:(w.b-w.a)*TDT}); t+=(w.b-w.a)*TDT; prevB=w.b;
  }
  card("ft", 4, {from:prevB, to:ft-1, evs:notable(prevB, ft)});
  if(sim.pens){ segs.push({kind:"play", a:ft, b:N-1, t0:t, dur:(N-1-ft)*TDT, shootout:true}); t+=(N-1-ft)*TDT; card("pens", 4, {from:N-1, to:N-1}); }
  return {segs, total:t, footage:W.reduce((s,w)=>s+w.b-w.a,0)*TDT};
}
function locate(pb, pos){
  if(pos<0) return {tick:0, pre:true};
  if(pos>=pb.total) return {tick:pb.lastTick, done:true};
  const S=pb.segs; let lo=0, hi=S.length-1;
  while(lo<hi){ const mid=(lo+hi+1)>>1; if(S[mid].t0<=pos) lo=mid; else hi=mid-1; }
  const s=S[lo];
  if(s.kind==="play") return {tick:Math.min(s.b, s.a+(pos-s.t0)/TDT), seg:s};
  return {tick:s.type==="ft"||s.type==="pens"?s.from:s.to, card:s, cardPos:(pos-s.t0)/s.dur};
}
function buildPlayback(sim, level){
  const tl=buildTimeline(sim, level), R=sim.rec, N=sim.ticks, E=sim.E;
  // running possession, counting only ticks with the ball in play
  const cumA=new Uint32Array(N), cumP=new Uint32Array(N); let a=0, p=0;
  for(let k=0;k<N;k++){ if(R.MD[k]===0){ p++; if(R.PO[k]===0) a++; } cumA[k]=a; cumP[k]=p; }
  const entered=new Array(E).fill(null), left=new Array(E).fill(null);
  sim.ents.forEach((e,i)=>{ if(!e.bench) entered[i]=0; });
  for(const e of sim.events){ if(e.type==="sub"){ entered[e.p]=e.tick; left[e.out]=e.tick; } if(e.type==="red") left[e.p]=e.tick; }
  const feedIdx=[]; sim.events.forEach((e,i)=>{ if(feedWorthy(e)) feedIdx.push(i); });
  const goals=sim.events.filter(e=>e.type==="goal");
  return {...tl, sim, R, N, E, cumA, cumP, entered, left, feedIdx, goals, lastTick:N-1, ft:sim.ftTick, ht:sim.htTick, bg:null};
}
function getPB(){
  const sim=ensureSim(); if(!sim) return null;
  const lv=G.match.level||"extended", key=matchKey()+":"+lv;
  if(PB && PB.key===key) return PB;
  PB=buildPlayback(sim, lv); PB.key=key; lastFeedCount=-1; lastBanner=""; lastCard=""; lastStatsAt=-1; lastRatIdx=-1; pbClock={rate:1,wall:null,pos:0};
  return PB;
}

/* ---------- per-moment helpers ---------- */
function clockText(pb, k){
  const R=pb.R; k=Math.max(0,Math.min(pb.N-1,Math.floor(k)));
  if(k>=pb.ft) return pb.sim.pens && k<pb.N-1 ? "PENS" : pb.sim.pens ? "PENS" : "FT";
  const c=R.CL[k], h1=k<pb.ht;
  if(h1 && c>=2700) return `45+${Math.floor((c-2700)/60)+1}'`;
  if(!h1 && c>=5400) return `90+${Math.floor((c-5400)/60)+1}'`;
  return `${Math.floor(c/60)+1}'`;
}
function scoreAt(pb, k){ const s={A:0,B:0}; for(const g of pb.goals) if(g.tick<=k) s[g.team]++; return s; }
function ratingsAt(pb, k){
  const idx=Math.max(0,Math.min(Math.floor(k/100), (pb.sim.ratings[0]||[]).length-1));
  if(pb.ratCache && pb.ratCache.idx===idx) return pb.ratCache;
  const out={idx, r:[], tag:[]}, mins=pb.R.CL[Math.min(pb.N-1,Math.floor(k))]/60;
  pb.sim.ents.forEach((e,i)=>{ const arr=pb.sim.ratings[i]||[]; let j=idx; while(j>0 && !arr[j]) j--; const v=arr[j]?arr[j]/10:null; out.r[i]=v;
    out.tag[i] = v==null||pb.entered[i]==null||pb.entered[i]>k ? "" : (v>=7.6 && mins>=15 && k-pb.entered[i]>3000*0.3) ? "🔥" : (v<=5.9 && mins>=20 && k-pb.entered[i]>1200) ? "🧊" : ""; });
  pb.ratCache=out; return out;
}

/* ---------- canvas pitch ---------- */
function pitchBG(w, h, s){
  const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d");
  const cs=getComputedStyle(document.documentElement), p1=cs.getPropertyValue("--pitch").trim()||"#2d7a47", p2=cs.getPropertyValue("--pitch-2").trim()||"#286f40";
  const X=m=>(m+MX)*s, Y=m=>(m+MY)*s;
  x.fillStyle=p2; x.fillRect(0,0,w,h);
  for(let i=0;i<14;i++){ x.fillStyle=i%2?p2:p1; x.fillRect(X(i*7.5), Y(0), 7.5*s+1, 68*s); }
  x.strokeStyle="rgba(255,255,255,.75)"; x.lineWidth=Math.max(1,0.14*s); x.lineJoin="round";
  const R_=(a,b,c2,d)=>x.strokeRect(X(a),Y(b),c2*s,d*s);
  R_(0,0,105,68); x.beginPath(); x.moveTo(X(52.5),Y(0)); x.lineTo(X(52.5),Y(68)); x.stroke();
  x.beginPath(); x.arc(X(52.5),Y(34),9.15*s,0,Math.PI*2); x.stroke();
  for(const side of [0,1]){ const gx=side?105:0, sg=side?-1:1;
    R_(side?105-16.5:0, 34-20.16, 16.5, 40.32); R_(side?105-5.5:0, 34-9.16, 5.5, 18.32);
    x.fillStyle="rgba(255,255,255,.8)"; x.beginPath(); x.arc(X(gx+sg*11),Y(34),Math.max(1.5,.22*s),0,Math.PI*2); x.fill();
    const ang=Math.acos(5.5/9.15); x.beginPath(); if(side) x.arc(X(94),Y(34),9.15*s,Math.PI-ang,Math.PI+ang); else x.arc(X(11),Y(34),9.15*s,-ang,ang); x.stroke();
    x.fillStyle="rgba(255,255,255,.22)"; x.fillRect(side?X(105):X(-2), Y(34-3.66), 2*s, 7.32*s); x.strokeRect(side?X(105):X(-2), Y(34-3.66), 2*s, 7.32*s);
    for(const cy of [0,68]){ x.beginPath(); x.arc(X(gx),Y(cy),1*s, side?(cy?Math.PI:Math.PI/2):(cy?Math.PI*1.5:0), side?(cy?Math.PI*1.5:Math.PI):(cy?Math.PI*2:Math.PI/2)); x.stroke(); }
  }
  x.fillStyle="rgba(255,255,255,.8)"; x.beginPath(); x.arc(X(52.5),Y(34),Math.max(1.5,.22*s),0,Math.PI*2); x.fill();
  return c;
}
function drawPitch(pb, kf){
  const cv=$("#pitch"); if(!cv) return;
  const dpr=Math.min(2.5, window.devicePixelRatio||1), cw=cv.clientWidth||800, w=Math.round(cw*dpr), h=Math.round(w*WH/WW);
  if(cv.width!==w || cv.height!==h || !pb.bg || pb.bgW!==w){ cv.width=w; cv.height=h; pb.bg=pitchBG(w,h,w/WW); pb.bgW=w; }
  const ctx=cv.getContext("2d"), s=w/WW, X=m=>(m+MX)*s, Y=m=>(m+MY)*s, R=pb.R, E=pb.E;
  ctx.drawImage(pb.bg,0,0);
  const k0=Math.max(0,Math.min(pb.N-1,Math.floor(kf))), k1=Math.min(pb.N-1,k0+1), fr=kf-k0;
  const bx0=R.BX[k0]/10, by0=R.BY[k0]/10, bx1=R.BX[k1]/10, by1=R.BY[k1]/10;
  const bjump=Math.abs(bx1-bx0)+Math.abs(by1-by0)>6;
  const bx=bjump?bx0:bx0+(bx1-bx0)*fr, by=bjump?by0:by0+(by1-by0)*fr, bz=(R.BZ[k0]+(bjump?0:(R.BZ[k1]-R.BZ[k0])*fr))/10;
  const rat=ratingsAt(pb, k0), names = s>=7.2, owner=R.OW[k0];
  // shot trail
  const shot=pb.sim.events.find(e=>e.type==="shot" && e.shotTick<=k0 && k0<=e.tick+4);
  if(shot){ const sx=R.BX[shot.shotTick]/10, sy=R.BY[shot.shotTick]/10; ctx.save(); ctx.strokeStyle="rgba(255,255,255,.65)"; ctx.lineWidth=Math.max(1.2,.22*s); ctx.setLineDash([.6*s,.8*s]); ctx.beginPath(); ctx.moveTo(X(sx),Y(sy)); ctx.lineTo(X(bx),Y(by-bz*.55)); ctx.stroke(); ctx.restore(); }
  // ball trail for fast passes
  if(!shot && k0>4){ const ox=R.BX[k0-4]/10, oy=R.BY[k0-4]/10; const d=Math.hypot(bx-ox,by-oy); if(d>3.2 && d<30){ const g=ctx.createLinearGradient(X(ox),Y(oy),X(bx),Y(by)); g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(1,"rgba(255,255,255,.45)"); ctx.strokeStyle=g; ctx.lineWidth=Math.max(1,.25*s); ctx.beginPath(); ctx.moveTo(X(ox),Y(oy)); ctx.lineTo(X(bx),Y(by)); ctx.stroke(); } }
  const pr=Math.max(4.2, 1.05*s);
  ctx.font=`700 ${Math.max(9, Math.round(1.25*s))}px Archivo, system-ui, sans-serif`; ctx.textAlign="center"; ctx.textBaseline="top";
  const drawn=[];
  for(let i=0;i<E;i++){
    const f=R.F[k0*E+i]; if(!(f&1)) continue;
    let x=R.X[k0*E+i]/10, y=R.Y[k0*E+i]/10; const x1=R.X[k1*E+i]/10, y1=R.Y[k1*E+i]/10;
    if((R.F[k1*E+i]&1) && Math.abs(x1-x)+Math.abs(y1-y)<3){ x+=(x1-x)*fr; y+=(y1-y)*fr; }
    const e=pb.sim.ents[i]; drawn.push([i,x,y,e,f]);
  }
  for(const [i,x,y,e,f] of drawn){
    ctx.globalAlpha = f&2 ? 1 : .45;
    if(owner===i){ ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=Math.max(1.2,.18*s); ctx.beginPath(); ctx.arc(X(x),Y(y),pr*1.75,0,Math.PI*2); ctx.stroke(); }
    ctx.fillStyle = e.gk ? (e.team==="A"?COL.gkA:COL.gkB) : COL[e.team];
    ctx.strokeStyle = e.gk ? COL[e.team] : "#fff"; ctx.lineWidth=Math.max(1.2,.2*s);
    ctx.beginPath(); if(f&8) ctx.ellipse(X(x),Y(y),pr*1.25,pr*.8,0,0,Math.PI*2); else ctx.arc(X(x),Y(y),pr,0,Math.PI*2); ctx.fill(); ctx.stroke();
    const near = owner===i || Math.hypot(x-bx,y-by)<16;
    if(names || near){ const nm=surname(e.name).slice(0,12); ctx.lineWidth=3; ctx.strokeStyle="rgba(0,0,0,.6)"; ctx.strokeText(nm, X(x), Y(y)+pr+1); ctx.fillStyle="#fff"; ctx.fillText(nm, X(x), Y(y)+pr+1); }
    const tg=rat.tag[i]; if(tg){ ctx.font=`${Math.max(10,Math.round(1.5*s))}px system-ui, sans-serif`; ctx.textBaseline="middle"; ctx.fillText(tg, X(x)+pr*1.1, Y(y)-pr*1.05); ctx.textBaseline="top"; ctx.font=`700 ${Math.max(9, Math.round(1.25*s))}px Archivo, system-ui, sans-serif`; }
  }
  ctx.globalAlpha=1;
  // ball and its shadow
  const br=Math.max(3.2, (0.5+bz*0.035)*s);
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(X(bx)+bz*.15*s, Y(by)+.25*s, Math.max(2.2,.42*s), Math.max(1.2,.22*s), 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle="#fff"; ctx.strokeStyle="#111"; ctx.lineWidth=Math.max(1,.1*s); ctx.beginPath(); ctx.arc(X(bx), Y(by-bz*.55), br, 0, Math.PI*2); ctx.fill(); ctx.stroke();
}

/* ---------- overlays ---------- */
function overlayAt(pb, k){
  let o=null;
  for(const e of pb.sim.events){
    if(e.tick>k) break;
    const age=k-e.tick;
    if(e.type==="goal" && age<42) o={kind:"goal", team:e.team, e};
    else if(e.type==="shot" && age<22 && ((SAVED.has(e.outcome)&&(e.big||e.pen)) || e.outcome==="post" || e.outcome==="bar")) o={kind:SAVED.has(e.outcome)?"save":"wood", team:e.team, e};
    else if(e.type==="penalty" && age<26) o={kind:"pen", team:e.team, e};
    else if(e.type==="red" && age<32) o={kind:"red", team:e.team, e};
    else if(e.type==="aura" && age<32 && e.tick>5) o={kind:"aura", team:e.team, e};
    else if(e.type==="sub" && age<30) o={kind:"sub", team:e.team, e};
    else if(e.type==="shootout" && age<16) o={kind:"so", team:e.team, e};
  }
  return o;
}
function bannerHTML(o, sim){
  const n=id=>esc(fullOf(sim,id)), tn=p=>esc(G.players[p]?.team||""), col=o.team==="A"?"#dfe5fb":"#fbe1df", e=o.e;
  if(o.kind==="goal") return `<div style="color:${col}">${e.og?"Own goal!":"Goal!"}<small>${n(e.p)}${e.assist!=null&&!e.og?` · assist ${n(e.assist)}`:""} · ${e.score.A}–${e.score.B}</small></div>`;
  if(o.kind==="save") return `<div class="bn">${e.pen?"Penalty saved!":"What a save!"}<small>${n(e.keeper)}</small></div>`;
  if(o.kind==="wood") return `<div class="bn">${e.outcome==="post"?"Off the post!":"Off the bar!"}<small>${n(e.p)}</small></div>`;
  if(o.kind==="pen") return `<div class="bn" style="color:${col}">Penalty!<small>${tn(e.team)}</small></div>`;
  if(o.kind==="red") return `<div class="bn"><i class="redcard"></i>Red card<small>${n(e.p)} · ${tn(e.team)}</small></div>`;
  if(o.kind==="aura") return `<div class="bn" style="color:var(--saffron)">Aura<small>${esc(e.name)}</small></div>`;
  if(o.kind==="sub") return `<div class="subboard"><div class="row"><span class="tm" style="background:${e.team==="A"?COL.A:COL.B}">${tn(e.team)}</span><span class="in">▲ ${n(e.p)}</span><span class="out">▼ ${n(e.out)}</span></div></div>`;
  if(o.kind==="so") return `<div class="bn" style="color:${e.scored?col:"#fff"}">${e.scored?"Scored!":"Missed!"}<small>${n(e.p)} · ${e.score.A}–${e.score.B}</small></div>`;
  return "";
}
function cardHTML(pb, c){
  const sim=pb.sim, tn=p=>esc(G.players[p].team), n=id=>esc(fullOf(sim,id));
  const evLine=e=>{ const tm=`<span class="tm" style="background:${e.team==="A"?COL.A:COL.B}">${tn(e.team)}</span>`, mn=`<span class="m">${minLabel(sim,e)}</span>`;
    if(e.type==="sub") return `<li>${mn}${tm}<span class="in">▲ ${n(e.p)}</span><span class="out">▼ ${n(e.out)}</span></li>`;
    if(e.type==="yellow") return `<li>${mn}${tm}<span>🟨 ${n(e.p)}${e.second?" (second yellow)":""}</span></li>`;
    if(e.type==="red") return `<li>${mn}${tm}<span>🟥 ${n(e.p)}</span></li>`;
    if(e.type==="aura") return `<li>${mn}${tm}<span>✨ ${esc(e.name)}</span></li>`;
    if(e.type==="tactic") return `<li>${mn}${tm}<span>📋 ${esc(templLine(e,sim))}</span></li>`;
    return ""; };
  const list=(c.evs||[]).slice(0,5).map(evLine).join("");
  const sc=scoreAt(pb, c.to);
  if(c.type==="ht") return `<div class="vc"><div class="vk">Half-time</div><div class="vs">${tn("A")} ${sc.A}–${sc.B} ${tn("B")}</div>${list?`<ul>${list}</ul>`:""}</div>`;
  if(c.type==="ft"){ const f=sim.final; return `<div class="vc"><div class="vk">Full-time</div><div class="vs">${tn("A")} ${f.A}–${f.B} ${tn("B")}</div>${sim.pens?`<div class="vs" style="font-size:.6em">Penalties next</div>`:""}${list?`<ul>${list}</ul>`:""}</div>`; }
  if(c.type==="pens") return `<div class="vc"><div class="vk">${tn(sim.winner)} win</div><div class="vs">Penalties ${sim.pens.A}–${sim.pens.B}</div></div>`;
  if(c.type==="skip") return `<div class="vc"><div class="vk">⏩ ${clockText(pb,c.from)} → ${clockText(pb,c.to)}</div>${list?`<ul>${list}</ul>`:""}</div>`;
  return "";
}

/* ---------- side panels ---------- */
function liveStats(pb, k){
  const s={A:{shots:0,onT:0,xg:0,corners:0,fouls:0,cards:0,offsides:0},B:{shots:0,onT:0,xg:0,corners:0,fouls:0,cards:0,offsides:0}};
  for(const e of pb.sim.events){ if(e.tick>k) break; const t=s[e.team]; if(!t) continue;
    if(e.type==="shot"){ t.shots++; t.xg+=e.xg||0; if(e.outcome==="goal"||SAVED.has(e.outcome)) t.onT++; }
    else if(e.type==="corner") t.corners++;
    else if(e.type==="foul"||e.type==="penalty") s[other(e.team)].fouls++;
    else if(e.type==="yellow"||e.type==="red") t.cards++;
    else if(e.type==="offside") t.offsides++; }
  const kk=Math.max(0,Math.min(pb.N-1,Math.floor(k))), pa=pb.cumP[kk]>50?Math.round(100*pb.cumA[kk]/pb.cumP[kk]):50;
  const row=(lab,a,b,fa,fb)=>{ const tot=(fa??a)+(fb??b)||1; return `<tr><td>${a}</td><td><div class="lsl">${lab}</div><div class="lsb"><i style="width:${100*(fa??a)/tot}%;background:${COL.A}"></i><i style="width:${100*(fb??b)/tot}%;background:${COL.B}"></i></div></td><td>${b}</td></tr>`; };
  return row("Possession", pa+"%", (100-pa)+"%", pa, 100-pa) + row("Shots", s.A.shots, s.B.shots) + row("On target", s.A.onT, s.B.onT) + row("xG", s.A.xg.toFixed(2), s.B.xg.toFixed(2), s.A.xg, s.B.xg) + row("Corners", s.A.corners, s.B.corners) + row("Fouls", s.A.fouls, s.B.fouls) + row("Cards", s.A.cards, s.B.cards);
}
function ratingsHTML(pb, k){
  const rat=ratingsAt(pb, k), sim=pb.sim;
  const col=side=>{ const rows=sim.ents.map((e,i)=>({e,i})).filter(({e,i})=>e.team===side && pb.entered[i]!=null && pb.entered[i]<=k);
    return `<div><div class="eyebrow" style="color:${COL[side]}">${esc(G.players[side].team)}</div>${rows.map(({e,i})=>{
      const g=pb.goals.filter(x=>x.tick<=k && x.p===i && !x.og).length, as=pb.goals.filter(x=>x.tick<=k && x.assist===i && !x.og).length;
      const off=pb.left[i]!=null && pb.left[i]<=k, red=sim.events.some(x=>x.type==="red" && x.p===i && x.tick<=k), yel=sim.events.some(x=>x.type==="yellow" && x.p===i && x.tick<=k);
      const v=rat.r[i], cls=v==null?"":v>=7.5?"hi":v<6?"lo":"";
      return `<div class="rrow ${off?"off":""}"><b class="rv ${cls}">${v==null?"–":v.toFixed(1)}</b><span class="rn">${esc(surname(e.name))}${e.meme?' <span class="tagm">58</span>':""}</span><span class="ri">${"⚽".repeat(g)}${as?"🅰️".repeat(Math.min(as,3)):""}${red?"🟥":yel?"🟨":""}${pb.entered[i]>0?'<span class="in">▲</span>':""}${off&&!red?'<span class="out">▼</span>':""}${rat.tag[i]||""}</span></div>`; }).join("")}</div>`; };
  return col("A")+col("B");
}
function momentumSVG(pb){
  const mom=pb.sim.mom, ft=pb.ft, pts=[]; for(let j=0;j*100<=ft && j<mom.length;j++){ const sm=(mom[Math.max(0,j-1)]+2*mom[j]+(mom[j+1]??mom[j]))/4; pts.push([j*100/ft*1000, 40-sm*0.37]); }
  const area=(f)=>`M0,40 ${pts.map(([x,y])=>`L${x.toFixed(1)},${f(y).toFixed(1)}`).join(" ")} L${pts.length?pts[pts.length-1][0].toFixed(1):0},40 Z`;
  const goals=pb.goals.filter(g=>g.tick<ft).map(g=>`<circle cx="${(g.tick/ft*1000).toFixed(1)}" cy="${g.team==="A"?7:73}" r="5" fill="#fff" stroke="${COL[g.team]}" stroke-width="2.5"/>`).join("");
  const htx=(pb.ht/ft*1000).toFixed(1);
  return `<defs><clipPath id="momclip"><rect id="momrev" x="0" y="0" width="0" height="80"/></clipPath></defs>
    <rect x="0" y="0" width="1000" height="80" style="fill:var(--paper)"/>
    <line x1="${htx}" y1="0" x2="${htx}" y2="80" style="stroke:var(--rule)" stroke-dasharray="4 4"/>
    <g clip-path="url(#momclip)"><path d="${area(y=>Math.min(40,y))}" fill="${COL.A}" opacity=".85"/><path d="${area(y=>Math.max(40,y))}" fill="${COL.B}" opacity=".85"/>${goals}</g>
    <line x1="0" y1="40" x2="1000" y2="40" style="stroke:var(--muted)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
}

/* ---------- page ---------- */
function tacChip(p){ const t=G.match?.tac?.[p]; const m=G.squads?.[p]?.manager; if(!t) return ""; return `${esc(G.squads[p].formation)} · ${esc(m&&m.name&&!m.none?surname(m.name):"no manager")} · ${esc(tacSummary(t))}`; }
function matchHTML(){
  const m=G.match, rep=m.report, pb=getPB(), sim=pb?.sim;
  const A=G.players.A.team, B=G.players.B.team, ro=m.rolls||sim?.rolls||{};
  const rollChip=(label,val,roll)=>`<div class="roll">${roll?`<span class="pill">${roll}/6</span>`:""}<div style="min-width:0"><div class="eyebrow">${label}</div><div>${esc(val)}</div></div></div>`;
  const lv=LEVELS[m.level]||LEVELS.extended;
  const mismatch = sim && m.digest && sim.digest!==m.digest;
  const status = !m.seed ? `<div class="vc"><div class="vk">This match was played on an older version</div><div class="vs" style="font-size:.5em">Start a rematch to use the new match engine.</div></div>`
    : simFail===matchKey() ? `<div class="vc"><div class="vk">The match couldn't be built on this device</div><div class="vs" style="font-size:.5em">Refresh the page to try again.</div></div>`
    : !pb ? `<div class="vc"><div class="vk"><span class="spin"></span> Building the match</div><div class="vs" style="font-size:.5em">Your device is replaying every touch from the engine.</div></div>` : "";
  return `<div class="matchtop"><div class="tn" style="color:var(--cobalt-soft)">${esc(A)}<div class="tsub">${tacChip("A")}</div></div><div><div class="score num"><span id="scA">0</span><span class="clk" id="clock">0'</span><span id="scB">0</span></div><div class="pensline num" id="pensline"></div></div><div class="tn r" style="color:var(--red-soft)">${esc(B)}<div class="tsub">${tacChip("B")}</div></div></div>
   <div class="pitchwrap"><canvas id="pitch" role="img" aria-label="Match pitch"></canvas><div class="goalbanner" id="goalbanner"></div><div class="vcard" id="vcard" ${status?"":"hidden"}>${status}</div>
     <div class="hltag">${esc(lv.label)}${pb?` · ${Math.round(pb.total/60)} min`:""}${mismatch?` · <b style="color:var(--saffron)">replay differs from the host's: refresh the page</b>`:""}</div></div>
   <div class="mombox"><div class="eyebrow">Momentum · <span style="color:${COL.A}">▲ ${esc(A)}</span> · <span style="color:${COL.B}">▼ ${esc(B)}</span></div><svg id="mom" viewBox="0 0 1000 80" preserveAspectRatio="none" role="img" aria-label="Momentum chart">${pb?momentumSVG(pb):""}</svg></div>
   <div class="btnrow" style="margin-top:10px;justify-content:space-between"><div class="btnrow">
     <div class="seg sm" role="group" aria-label="Playback speed">${[1,2,4].map(r=>`<button type="button" data-rate="${r}" class="${pbClock.rate===r?"sel":""}">${r}×</button>`).join("")}</div>
     <button class="btn ghost sm" id="skip">Skip to full time</button>${mySeat?`<button class="btn gold sm" id="rematch" hidden>Rematch</button>`:""}<button class="btn ghost sm" id="toLobby">Back to lobby</button></div><span class="muted" id="kick" style="font-size:13px"></span></div>
   <div class="matchgrid">
     <div style="display:grid;gap:16px;align-content:start">
       <div class="feed" id="feed" aria-live="polite"><div class="muted">Kick-off is coming up. Read the dossier while you wait.</div></div>
       <div class="dossier" id="result" hidden></div>
     </div>
     <div style="display:grid;gap:16px;align-content:start">
       <div class="dossier"><div class="eyebrow">Live stats</div><table class="statt ls" id="lstats"></table></div>
       <div class="dossier"><div class="eyebrow">Player ratings · 🔥 on fire · 🧊 ice cold</div><div class="rgrid" id="ratings"></div></div>
       <div class="dossier">
         <div class="eyebrow">Scouting dossier</div>
         <h4>${esc(rep?.headline || `${A} vs ${B}`)}</h4>
         <div class="rolls">
           ${ro.venue?rollChip("Venue", ro.venue.name+(ro.venue.host?` (${G.players[ro.venue.host].team} at home)`:""), ro.venue.roll):""}
           ${ro.weather?rollChip("Weather", ro.weather.name, ro.weather.roll):""}
           ${ro.ref?rollChip("Referee", ro.ref.name, ro.ref.roll):""}
           ${["A","B"].map(p=>{ const i=ro["injury"+p]; if(!i) return ""; return rollChip(`Injury check · ${G.players[p].team}`, i.roll===1?`${i.who} OUT${i.replacedBy?", "+i.replacedBy+" starts":""}`:`${i.who} fit`, i.roll); }).join("")}
         </div>
         ${(rep?.dossier||[]).map(p=>`<p>${esc(p)}</p>`).join("") || `<p class="muted">Claude's dossier isn't available for this match, so the game is using its own commentary.</p>`}
         ${rep?.keyBattles?.length?`<div class="eyebrow">Key battles</div><ul style="margin:0;padding-left:18px;display:grid;gap:4px">${rep.keyBattles.map(k=>`<li>${esc(k)}</li>`).join("")}</ul>`:""}
       </div>
     </div>
   </div>`;
}
function startPlayback(){ const loop=()=>{ frame(false); raf=requestAnimationFrame(loop); }; raf=requestAnimationFrame(loop); }
function frame(force){
  if(!G||G.phase!=="match"||!G.match||!$("#pitch")) return;
  const pb=getPB(); if(!pb) return;
  const m=G.match, pos=playPos(), L=locate(pb, pos), k=L.tick, ki=Math.floor(k), sim=pb.sim;
  drawPitch(pb, k);
  const kick=$("#kick"); if(kick) kick.textContent = pos<0 ? `Kick-off in ${Math.ceil(-pos)}s` : L.done ? "" : `${Math.max(0,Math.ceil((pb.total-pos)/60))} min of highlights left`;
  // score and clock
  const sc=scoreAt(pb, ki); $("#scA").textContent=sc.A; $("#scB").textContent=sc.B;
  $("#clock").textContent = L.pre ? "0'" : L.done ? (sim.pens?"PENS":"FT") : L.card&&L.card.type==="ht" ? "HT" : L.card&&L.card.type==="ft" ? "FT" : clockText(pb, ki);
  const so=sim.events.filter(e=>e.type==="shootout" && e.tick<=ki).pop(), pl=$("#pensline");
  if(pl) pl.textContent = so ? `pens ${so.score.A}–${so.score.B}` : L.done&&sim.pens ? `pens ${sim.pens.A}–${sim.pens.B}` : "";
  // momentum reveal
  const mr=$("#momrev"); if(mr) mr.setAttribute("width", String(Math.min(1000, Math.max(0, Math.min(ki,pb.ft)/pb.ft*1000)).toFixed(1)));
  // cards and banners
  const vc=$("#vcard");
  const cardKey = L.pre ? "pre"+Math.ceil(-pos) : L.card && L.card.type!=="cut" ? L.card.type+L.card.t0 : "";
  if(cardKey!==lastCard && vc){ lastCard=cardKey;
    if(L.pre){ vc.hidden=false; vc.className="vcard"; vc.innerHTML=`<div class="vc"><div class="vk">Kick-off in ${Math.ceil(-pos)}</div><div class="vs" style="font-size:.5em">${esc(LEVELS[m.level]?.label||"Extended")} · about ${Math.round(pb.total/60)} min</div></div>`; }
    else if(L.card && L.card.type!=="cut"){ vc.hidden=false; vc.className="vcard"; vc.innerHTML=cardHTML(pb, L.card); }
    else { vc.hidden=true; vc.innerHTML=""; } }
  if(vc) vc.classList.toggle("cut", !!(L.card && L.card.type==="cut"));
  const gb=$("#goalbanner"), ov=L.card||L.pre ? null : overlayAt(pb, ki), bk=ov ? ov.kind+ov.e.tick : "";
  if(bk!==lastBanner && gb){ lastBanner=bk; gb.innerHTML = ov ? bannerHTML(ov, sim) : ""; }
  // feed
  const shown = L.pre ? [] : pb.feedIdx.filter(i=>sim.events[i].tick<=ki || L.done);
  if(shown.length!==lastFeedCount || force){
    lastFeedCount=shown.length; const lines=m.report?.lines||{}, feed=$("#feed");
    if(feed && shown.length) feed.innerHTML = shown.map(i=>{ const e=sim.events[i], txt=lines[i]||lines[String(i)]||templLine(e,sim);
      const cls=e.type==="goal"?"goal":e.type==="red"?"red":e.type==="sub"?"sub":e.type==="tactic"?"tac":"";
      return `<div class="ev ${cls}"><span class="m">${minLabel(sim,e)}</span><span>${e.team&&e.type!=="goal"&&e.type!=="ht"&&e.type!=="ft"?`<b style="color:${COL[e.team]}">${esc(G.players[e.team].team)}</b> · `:""}${esc(txt)}</span></div>`; }).reverse().join("");
  }
  // live stats + ratings, once a second of match time
  const sk=Math.floor(ki/10);
  if(sk!==lastStatsAt || force){ lastStatsAt=sk; const ls=$("#lstats"); if(ls) ls.innerHTML=liveStats(pb, L.pre?-1:ki); const rg=$("#ratings"); if(rg && (Math.floor(ki/100)!==lastRatIdx || force || L.done)){ lastRatIdx=Math.floor(ki/100); rg.innerHTML=ratingsHTML(pb, L.pre?0:ki); } }
  // result
  const res=$("#result");
  if((L.done || (L.card && (L.card.type==="ft"||L.card.type==="pens"))) && res && res.hidden){
    res.hidden=false; const rm=$("#rematch"); if(rm) rm.hidden=false;
    const s=sim.stats, wn=sim.winner ? G.players[sim.winner].team : null, motm=sim.motm!=null?sim.ents[sim.motm]:null;
    const pens = sim.pens ? `<div class="eyebrow">Penalty shootout</div>${["A","B"].map(p=>`<div class="pens"><b style="min-width:110px">${esc(G.players[p].team)}</b>${sim.pens.log.filter(l=>l.team===p).map(l=>`<i class="${l.scored?"y":"n"}" title="${esc(fullOf(sim,l.p))}"></i>`).join("")} <span class="num">${sim.pens[p]}</span></div>`).join("")}` : "";
    const r=(lab,a,b)=>`<tr><td>${a}</td><td>${lab}</td><td>${b}</td></tr>`;
    res.innerHTML = `<div class="eyebrow">Full time</div><h4>${wn?esc(wn)+" win":"It's a draw"} · ${sim.final.A}–${sim.final.B}${sim.pens?` (${sim.pens.A}–${sim.pens.B} pens)`:""}</h4>
      ${m.report?.verdict?`<p>${esc(m.report.verdict)}</p>`:""}${motm?`<p><span class="pill gold">Player of the match</span> <b>${esc(motm.name)}</b> <span class="num muted">${motm.rating.toFixed(1)}</span></p>`:""}
      <table class="statt"><tr><td style="color:${COL.A}">${esc(G.players.A.team)}</td><td class="eyebrow"></td><td style="color:${COL.B}">${esc(G.players.B.team)}</td></tr>
      ${r("Possession",s.A.poss+"%",s.B.poss+"%")}${r("Shots",s.A.shots,s.B.shots)}${r("On target",s.A.onT,s.B.onT)}${r("xG",s.A.xg.toFixed(2),s.B.xg.toFixed(2))}${r("Big chances",s.A.bigChances,s.B.bigChances)}
      ${r("Passes",s.A.passes,s.B.passes)}${r("Pass accuracy",s.A.passPct+"%",s.B.passPct+"%")}${r("Tackles",s.A.tackles,s.B.tackles)}${r("Saves",s.A.saves,s.B.saves)}${r("Corners",s.A.corners,s.B.corners)}${r("Fouls",s.A.fouls,s.B.fouls)}${r("Cards",`${s.A.yellows}🟨 ${s.A.reds}🟥`,`${s.B.yellows}🟨 ${s.B.reds}🟥`)}</table>${pens}
      ${(G.history||[]).length?`<div class="eyebrow">Earlier games</div><div class="muted" style="font-size:13px">${G.history.map(h=>h.final?`${h.final.A}–${h.final.B}${h.pens?` (${h.pens.A}–${h.pens.B} p)`:""}`:"").join(" · ")}</div>`:""}`;
  }
}


/* ============================================================
   Event binding
   ============================================================ */
function bind(){
  const on=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn));
  on("#create","click",createGame);
  on("#acode","input",e=>{ lsSet("dn_code", e.currentTarget.value.trim()); accessProblem=false; });
  on("[data-join]","click",e=>joinGame(e.currentTarget.dataset.join));
  on("[data-open]","click",e=>openGame(e.currentTarget.dataset.open));
  on("#leave","click",leaveGame); on("#toLobby","click",leaveGame);
  on("#pickform","submit",e=>{ e.preventDefault(); submitPick(); });
  on("[data-slot]","click",e=>{ uiSel.slot=e.currentTarget.dataset.slot; render(); const i=$("#pick"); if(i) i.focus(); });
  on("[data-slot]","keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); uiSel.slot=e.currentTarget.dataset.slot; render(); } });
  on("[data-cap]","click",e=>submitCaptain(e.currentTarget.dataset.cap));
  on("#reroll","click",()=>{ if(G?.round) commit(M.reroll(G.round.key, mySeat)); });
  on("[data-rv]","click",e=>review(e.currentTarget.dataset.rv));
  on("#skip","click",()=>{ if(!G?.match) return; const pb=getPB(); if(!pb) return; pbClock={rate:1, wall:Date.now(), pos:pb.total+1}; document.querySelectorAll("[data-rate]").forEach(b=>b.classList.toggle("sel", b.dataset.rate==="1")); frame(true); });
  on("[data-rate]","click",e=>{ if(!G?.match) return; const r=+e.currentTarget.dataset.rate; setRate(r); document.querySelectorAll("[data-rate]").forEach(b=>b.classList.toggle("sel", +b.dataset.rate===r)); });
  on("#rematch","click",rematch);
  // team talk
  on("[data-tac]","input",e=>{ const el=e.currentTarget, k=el.dataset.tac, v=+el.value; const lab=document.querySelector(`[data-tv="${k}"]`); if(lab) lab.textContent=v;
    const panel=el.closest(".tacpanel"); if(panel && mySeat){ const t={...teamTactics(G,mySeat), [k]:v}; const svg=panel.querySelector("svg.shape"); if(svg) svg.outerHTML=shapeSVG(G.squads[mySeat].formation, t, mySeat); } });
  on("[data-tac]","change",e=>{ if(mySeat) commit(M.setTac(mySeat, e.currentTarget.dataset.tac, +e.currentTarget.value)); });
  on("[data-tacset]","click",e=>{ if(mySeat) commit(M.setTac(mySeat, e.currentTarget.dataset.tacset, e.currentTarget.dataset.v)); });
  on("[data-tacchk]","change",e=>{ if(mySeat) commit(M.setTac(mySeat, e.currentTarget.dataset.tacchk, !!e.currentTarget.checked)); });
  on("#tacreset","click",()=>{ if(mySeat) commit(M.resetTac(mySeat)); });
  on("#ready","click",()=>{ if(mySeat) commit(M.ready(mySeat,true)); });
  on("#unready","click",()=>{ if(mySeat) commit(M.ready(mySeat,false)); });
  on("[data-level]","click",e=>{ if(mySeat) commit(M.level(mySeat, e.currentTarget.dataset.level)); });
}
/* Start up last, once every function and variable above exists. */
function boot(){
  setInterval(tick, 400);   // start the clock first, so nothing below can stop it
  render();
  me.id = lsGet("dn_id") || ("p_" + Math.random().toString(36).slice(2,12)); lsSet("dn_id", me.id);
  if (configured) { try { db = makeDb(); sample = makeSample(); } catch(e) { console.warn(e); db = null; } }
  platformReady = true;
  if(db){
    unsubLobby = db.collection("lobby").orderBy("updatedAt","desc").limit(20).onSnapshot(s=>{ lobby=s.docs.map(d=>d.data()); if(!G) render(); }, e=>{ console.warn(e); canWrite=false; render(); });
    const h = (location.hash||"").replace("#","").toUpperCase();
    if(/^[A-Z0-9]{5}$/.test(h)) openGame(h);
  }
  render();
}
boot();
</script>
